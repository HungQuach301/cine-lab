  - tpl: plate
    type: scene3d
    at: 0
    noi: bien
    p: {hero: a_vinh, kind: '', frame0: 0}
  - tpl: plate
    type: scene3d
    at: 5.6
    noi: thanh_pho
    p: {hero: a_vinh, kind: '', frame0: 134.4, ghost: ghost-1782, city: true}
