segments:
  # 00 — móc câu (Q14): nghề mà máy lấy tên. Trả lời ở đoạn 11 (name, programmers).
  - id: "00"
    part: STORY
    vo: >-
      What happens to a job when a machine takes its name? In the 1940s, a computer was a person with a pencil.
      Today, young workers in AI-exposed jobs have fallen nineteen percent behind their peers.
    vo_offset: 0.6
    tail: 0.6
    fadeIn: 0
    shots:
      - {tpl: desk, at: 0, p: {eras: [{era: 1944, at: 0, label: " "}, {era: 2025, at: "@today-0.3", label: " "}], accent: "#6a4c8c", cam: [{t: 0, x: 0, z: 0.03}, {t: 5, x: -30, z: 0.06}, {t: 10, x: -60, z: 0.09}, {t: 16, x: -90, z: 0.12}],
           cap: [{s: "What happens to a job when a machine takes its name?", at: "@what", src: []}, {s: "1940s: a computer was a person", at: "@1940s", src: [NASA1]},
                 {s: "today: the youngest workers in AI-exposed jobs", at: "@today", src: [CAN]}, {num: can, s: "employment, ages 22–25, vs. less-exposed peers (2026)", at: "@nineteen"}]}}

  - id: "01"
    part: STORY
    vo: >-
      At dusk, the lamplighter passes a research laboratory by an airfield. The engineers have gone home, but one long room is still lit.
      Rows of women sit with pencils, slide rules, and machines that clatter when they multiply.
    vo_offset: 3.4
    min_dur: 27
    tail: 1.2
    shots:
      - {tpl: text, at: 0, p: {lamp: true, lines: [{s: "WHEN COMPUTERS WERE PEOPLE", px: 76}, {s: "Last Lamplighters · Episode 7", px: 34, serif: false}]}}
      - {tpl: street, at: 3.0, in: fade, p: {lamps: [{x: 260}, {x: 860, lit: "@passes+0.8"}, {x: 1460}, {x: 2060}], lighter: {from: 500, to: 820, walk: [3.2, "@passes+0.5"], lights: [1]}, warm: 0.6, windows: 0.7,
                                 cam: [{t: 3, x: 0, z: 0}, {t: 7, x: -100, z: 0.02}, {t: "@engineers", x: -240, z: 0.06}]}}
      - {tpl: desk, at: "@rows-0.4", in: fade, p: {eras: [{era: 1944, at: "@rows-0.4", label: " "}], accent: "#6a4c8c", cam: [{t: "@rows", x: 60, z: 0.0}, {t: "@slide", x: 20, z: 0.04}, {t: "@multiply+1.2", x: -20, z: 0.08}, {t: "@multiply+5", x: -50, z: 0.11}],
           cap: [{s: "pencils · slide rules · calculating machines", at: "@pencils"}]}}

  - id: "02"
    part: HISTORY
    vo: >-
      Before electronic computers, the word computer meant a person. It was a job title: someone who performed mathematical equations and calculations by hand.
      In 1935, the aeronautical laboratory at Langley, Virginia, started a computer pool with five women. They read the data from wind tunnel tests, calculated, and plotted the results,
      using slide rules, magnifying glasses, and calculating machines that could multiply and take square roots.
      It was work the engineers had once done themselves: essential, but time-consuming.
    shots:
      - {tpl: archive, at: 0, p: {img: assets/ll/archive/fsa-8d10672.jpg, rid: LOC-8d10672, focus: [0.5, 0.45], credit: "Office worker computing figures, Lititz, Pa., 1942 · Library of Congress",
           cam: [{t: 0, x: 40, z: 0.0}, {t: 6, x: 10, z: 0.04}, {t: 12, x: -20, z: 0.08}],
           cap: [{s: "before electronic computers: a computer was a person", at: "@before", src: [NASA1]}, {s: "a job title", at: "@title"}, {s: "calculations by hand", at: "@hand"}]}}
      - {tpl: desk, at: "@1935-0.4", in: fade, p: {eras: [{era: 1944, at: "@1935-0.4", label: "1935"}], accent: "#6a4c8c", cam: [{t: "@1935", x: 0, z: 0.02}, {t: "@five", x: -20, z: 0.04}, {t: "@wind", x: -40, z: 0.06}, {t: "@magnifying", x: -80, z: 0.1}, {t: "@roots+1", x: -100, z: 0.12}],
           cap: [{s: "Langley, Virginia, 1935: a computer pool of five women", at: "@1935", src: [NASA1]}, {s: "wind tunnel data: read, calculate, plot", at: "@wind"},
                 {s: "slide rules · magnifying glasses · calculating machines", at: "@magnifying"}, {s: "work the engineers once did themselves", at: "@engineers"}]}}

  - id: "03"
    part: HISTORY
    vo: >-
      The work grew with the war. A 1942 report counted seventy-five women computers at the laboratory; many were former high school teachers.
      By 1946, the head of computing had trained about four hundred women and placed them across the laboratory.
      Black women were hired as computers too, but under segregation they worked in a separate section, the West Area Computers, with separate dining rooms and bathrooms.
      It was also a way into aeronautical research for women, at a time when most were not being hired as engineers. The pay was much better than most jobs open to women at the time. And the computers did more in a morning than an engineer alone could finish in a day.
    shots:
      - {tpl: isotype, at: 0, p: {title: "Women computers at the Langley laboratory", subtitle: "one laboratory, not a national count", unit: 10, unitName: "women", per: 20,
           groups: [{label: "1942 (report)", num: c42, at: "@seventyfive"}, {label: "by 1946 (trained)", num: c46, at: "@four"}],
           cap: [{s: "the work grew with the war", at: "@war", src: [NASA1]}, {s: "many were former teachers", at: "@teachers"}]}}
      - {tpl: desk, at: "@black-0.4", in: fade, p: {eras: [{era: 1944, at: "@black-0.4", label: "1944"}], accent: "#6a4c8c", cam: [{t: "@black", x: 0, z: 0.02}, {t: "@segregation", x: -30, z: 0.05}, {t: "@time", x: -50, z: 0.07}, {t: "@pay", x: -60, z: 0.08}, {t: "@pay+4.5", x: -75, z: 0.09}, {t: "@morning", x: -90, z: 0.1}, {t: "@day+1", x: -110, z: 0.12}],
           cap: [{s: "segregation: the West Area Computers", at: "@segregation", src: [NASA1]}, {s: "separate dining rooms and bathrooms", at: "@separate#2"},
                 {s: "a way into aeronautical research", at: "@aeronautical"}, {s: "pay: better than most jobs open to women", at: "@pay"}, {s: "more in a morning than an engineer in a day", at: "@morning"}]}}

  - id: "04"
    part: HISTORY
    vo: >-
      Then the machine arrived that would take their name. In 1947, the agency acquired a huge electronic computer, and it got its own computing group.
      With the first electronic computers, the human computers took on programming duties as well. At the Jet Propulsion Laboratory in California, a team of women computers went on to become some of the earliest computer programmers.
      One of their main tasks was computing the planned paths of spacecraft. After Sputnik, the laboratory built Explorer 1, which in 1958 became the first American satellite.
      At first, JPL notes, the machines were fast, but not nearly as reliable as the people.
    shots:
      - {tpl: archive, at: 0, p: {img: assets/ll/archive/usnwr-89395.jpg, rid: LOC-89395, focus: [0.5, 0.55], credit: "IBM computer room, New Haven, 1967 · Library of Congress",
           cam: [{t: 0, x: 0, z: 0.0}, {t: 6, x: -30, z: 0.04}, {t: 12, x: -60, z: 0.08}, {t: 18, x: -80, z: 0.11}, {t: 24, x: -100, z: 0.13}, {t: 30, x: -110, z: 0.14}, {t: 36, x: -120, z: 0.15}, {t: 42, x: -130, z: 0.16}],
           cap: [{s: "the machine that took their name", at: "@machine", src: [NASA1]}, {s: "1947: a huge electronic computer", at: "@1947", src: [NASA1]}, {s: "human computers take on programming", at: "@programming"},
                 {s: "JPL: some of the earliest programmers", at: "@earliest", src: [NASA2]}, {s: "computing the paths of spacecraft", at: "@paths"}, {s: "1958: Explorer 1", at: "@explorer", src: [NASA2]}, {s: "at first: fast machines, less reliable than people", at: "@reliable", src: [NASA2]}]}}

  - id: "05"
    part: HISTORY
    vo: >-
      Programming became a large occupation of its own. By 1988, computer programmers held five hundred nineteen thousand jobs.
      In its 1990 handbook, the BLS made a forecast that sounds familiar. Employment would not grow as rapidly as in the past, because improved software and programming techniques simplify or eliminate some programming tasks.
      And on artificial intelligence, it wrote: AI principles and languages will become just additional tools available to programmers.
      It also warned that competition had increased for entry level positions.
    shots:
      - {tpl: sign, at: 0, p: {num: prog88, caption: "computer programmer jobs, United States, 1988", at: "@nineteen", capAt: "@jobs", wall: plaster,
           cam: [{t: 0, x: 0, z: 0.0}, {t: 4, x: -20, z: 0.02}, {t: "@1988", x: -40, z: 0.04}],
           cap: [{s: "programming: a large occupation of its own", at: "@occupation", src: [OOH90]}]}}
      - {tpl: quote, at: "@handbook-0.4", in: slide, p: {beats: [{s: "the BLS, 1990: a familiar forecast", at: "@handbook"}, {s: "not as rapidly as in the past", at: "@rapidly"}],
           text: "…improved software and programming techniques simplify or eliminate some programming tasks.", who: "U.S. Bureau of Labor Statistics", where: "Occupational Outlook Handbook, 1990–91", at: "@improved", src: [OOH90]}}
      - {tpl: quote, at: "@artificial-0.4", in: flip, p: {beats: [{s: "and on artificial intelligence", at: "@artificial"}, {s: "a warning: entry level", at: "@warned"}],
           text: "AI principles and languages will…become just additional tools available to programmers.", who: "U.S. Bureau of Labor Statistics", where: "Occupational Outlook Handbook, 1990–91", at: "@principles", src: [OOH90]}}

  - id: "06"
    part: STORY
    vo: >-
      The lamplighter walks on. The laboratory window goes dark. Across the street, in a tall office building, one desk is still lit:
      a young programmer watches lines of code appear on a screen, faster than anyone could type them.
    vo_offset: 2.5
    min_dur: 27
    tail: 1.5
    shots:
      - {tpl: street, at: 0, p: {lamps: [{x: 260}, {x: 860}, {x: 1460}, {x: 2060}], lighter: {from: 300, to: 1300, walk: [0.5, "@lit+1"]}, warm: 0.4, windows: 0.4,
                                 cam: [{t: 0, x: 0, z: 0}, {t: 4, x: -100, z: 0.02}, {t: 8, x: -200, z: 0.035}, {t: "@lit+1", x: -300, z: 0.05}]}}
      - {tpl: desk, at: "@young-0.4", in: fade, p: {eras: [{era: 2025, at: "@young-0.4", label: " "}], accent: "#6a4c8c",
           cam: [{t: "@young", x: 0, z: 0}, {t: "@code", x: -40, z: 0.04}, {t: "@faster", x: -80, z: 0.08}, {t: "@faster+5", x: -110, z: 0.1}]}}

  - id: "07"
    part: TODAY
    vo: >-
      Today the tool writes code. In 2025, BLS economists wrote that software developers can use generative AI to develop, test, and document code.
      They called the effect on the occupation highly uncertain. AI is well suited to the work, but cheaper software could raise demand for it, and someone has to build and maintain the AI systems themselves.
      Their projection for software developers, 2023 to 2033: growth of seventeen point nine percent.
    shots:
      - {tpl: quote, at: 0, p: {beats: [{s: "today the tool writes code", at: "@tool"}, {s: "BLS economists, 2025", at: "@economists"}, {s: "develop · test · document", at: "@develop"}, {s: "highly uncertain", at: "@uncertain"}],
           text: "Software developers can use GenAI to develop, test, and document code…", who: "BLS economists", where: "Monthly Labor Review, February 2025", at: "@software", src: [MLR25]}}
      - {tpl: desk, at: "@suited-0.4", in: fade, p: {eras: [{era: 2025, at: "@suited-0.4", label: "2025"}], accent: "#6a4c8c", cam: [{t: "@suited", x: 0, z: 0.03}, {t: "@cheaper", x: -30, z: 0.06}, {t: "@maintain", x: -60, z: 0.09}, {t: "@projection", x: -80, z: 0.1}],
           cap: [{s: "AI is well suited to the work…", at: "@suited", src: [MLR25]}, {s: "…but cheaper software could raise demand", at: "@cheaper"}, {s: "someone builds and maintains the AI", at: "@maintain"},
                 {num: sd23_chg, s: "software developers, projected 2023–33", at: "@seventeen"}]}}

  - id: "08"
    part: TODAY
    vo: >-
      The newest BLS projections, from January 2026, say the same. Software developers held about one point six nine million jobs in 2024.
      The projection for 2034 is one point nine six million, growth of fifteen point eight percent, compared with three point one percent for all jobs.
      On these forecasts, this is one of the fastest-growing jobs in the country, not a vanishing one.
    shots:
      - {tpl: isotype, at: 0, p: {title: "Software developers, United States", subtitle: "employment, 2024 and projected 2034", unit: 100000, unitName: "jobs", per: 20,
           groups: [{label: "2024", num: sd24, at: "@six"}, {label: "2034 (projected)", num: sd34, at: "@nine#2"}],
           cap: [{s: "BLS projections, January 2026", at: "@newest", src: [MLR26]}]}}
      - {tpl: bars, at: "@fifteen-1.2", in: slide, p: {title: "Projected job growth, 2024–34", subtitle: "same source, same period: BLS", unit: '%', max: 18, kindEach: true,
           beats: [{s: "a growing job, on these forecasts", at: "@fastestgrowing"}],
           bars: [{label: "Software developers", num: sd_chg, at: "@fifteen"}, {label: "All occupations", num: all_chg, at: "@three"}]}}

  - id: "09"
    part: TODAY
    vo: >-
      But forecasts are not the whole picture. Economists at Stanford studied payroll records for millions of workers from the payroll company ADP.
      Overall employment is still robust. But employment of workers aged twenty-two to twenty-five in AI-exposed jobs, such as software development and customer service, now stands nineteen percent below where it would be had it kept pace with less-exposed peers.
      In plain numbers, employment of that age group in the most exposed jobs fell about eleven percent from late 2022 to mid 2026, while in the least exposed jobs it grew about ten percent.
      Experienced workers show no such gap. The authors tested other explanations, such as interest rates, remote work, and the tech sector, and the pattern broadly held. And the change comes mostly from fewer young people being hired, not from people being let go.
    shots:
      - {tpl: desk, at: 0, p: {eras: [{era: 2025, at: 0, label: "2026"}], accent: "#6a4c8c", cam: [{t: 0, x: 0, z: 0.03}, {t: 5, x: -30, z: 0.05}, {t: 10, x: -60, z: 0.08}, {t: 16, x: -80, z: 0.1}],
           cap: [{s: "forecasts are not the whole picture", at: "@forecasts"}, {s: "Stanford: payroll records for millions of workers", at: "@payroll", src: [CAN]}, {s: "overall employment: still robust", at: "@robust"}]}}
      - {tpl: sign, at: "@nineteen-1.2", in: fade, p: {num: can, caption: "employment, ages 22–25, AI-exposed jobs, vs. less-exposed peers", at: "@nineteen", capAt: "@pace", wall: brick,
           cam: [{t: "@nineteen-1.2", x: 0, z: 0.0}, {t: "@pace", x: -30, z: 0.03}, {t: "@eleven", x: -40, z: 0.04}, {t: "@ten", x: -45, z: 0.045}, {t: "@experienced", x: -50, z: 0.05}, {t: "@tested", x: -55, z: 0.055}, {t: "@sector", x: -60, z: 0.06}, {t: "@hired", x: -70, z: 0.07}],
           cap: [{s: "in plain numbers: −11% vs. +10% (most vs. least exposed, ages 22–25)", at: "@plain", src: [CAN]}, {s: "experienced workers: no such gap", at: "@experienced", src: [CAN]}, {s: "other explanations tested: the pattern broadly held", at: "@tested"}, {s: "fewer young people hired, not more let go", at: "@hired"}]}}

  - id: "10"
    part: TODAY
    vo: >-
      So here is the comparison, with a caution. The numbers from Langley count one laboratory; the numbers today count a whole country. We will not set them side by side.
      What we can compare is the pattern. Then, the electronic computer took over the arithmetic, and the people who did it moved up to programming the machine.
      Today, AI tools can develop, test, and document code, and the people who write software work alongside them.
      Not the same technology. The same pattern: a repetitive human task, taken over by an automated system.
      But the differences matter. Back then, the new machine needed new people to program it. This time, the change shows up first at the bottom of the ladder, where people learn the job.
    shots:
      - {tpl: archive, at: 0, p: {img: assets/ll/archive/usnwr-89395.jpg, rid: LOC-89395, focus: [0.5, 0.55], credit: "IBM computer room, New Haven, 1967 · Library of Congress",
           cam: [{t: 0, x: -80, z: 0.12}, {t: 8, x: -50, z: 0.09}, {t: 16, x: -20, z: 0.06}, {t: 24, x: 0, z: 0.04}],
           cap: [{s: "The comparison, with a caution", at: "@comparison"}, {s: "one laboratory vs. a whole country: not side by side", at: "@laboratory"}, {s: "what we can compare is the pattern", at: "@pattern"},
                 {s: "then: the machine takes the arithmetic…", at: "@arithmetic", src: [NASA1]}, {s: "…people move up to programming it", at: "@moved"}]}}
      - {tpl: desk, at: "@today#2-0.4", in: fade, p: {eras: [{era: 2025, at: "@today#2-0.4", label: "2025"}], accent: "#6a4c8c", cam: [{t: "@today#2", x: 0, z: 0.0}, {t: "@same", x: -40, z: 0.04}, {t: "@differences", x: -80, z: 0.08}, {t: "@ladder", x: -110, z: 0.1}],
           cap: [{s: "today: AI tools develop, test, document code", at: "@tools", src: [MLR25]}, {s: "people work alongside them", at: "@alongside"}, {s: "not the same technology — the same pattern", at: "@technology"},
                 {s: "but the differences matter", at: "@differences"}, {s: "then: new machines needed new people", at: "@needed"}, {s: "now: the bottom of the ladder first", at: "@bottom", src: [CAN]}]}}

  - id: "11"
    part: TODAY
    vo: >-
      What happens to a job when a machine takes its name? Many of the computers became programmers, and some became engineers. For them, the work did not disappear; it climbed.
      The question now is where the first rung comes from, for the young people who would once have learned the job by doing the simple parts of it.
      No projection can settle that yet. That is what we will be watching.
    min_dur: 26
    shots:
