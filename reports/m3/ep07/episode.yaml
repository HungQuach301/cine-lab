                  {w: "@reading", img: "khung đôi: bàn tính 1940s | màn hình mã"}, {w: "@checking#2", img: "khung đôi: đồ thị và dòng mã được đánh dấu"}]}
    pause: [{before: "@ten", s: 0.7}]
    speed: 0.97   # ASR tham lam (Q28f) nghe "1.7-2 million" ở bản 1.00; đọc chậm 3 % để tách rõ "seven two"
    vo: >-
      The second is software developers: the people who design applications and plan how the pieces fit together.
      Their jobs are projected to grow, from one point seven two million in 2025 to one point eight nine million in 2035. That is ten point two percent, compared with three point five percent for all jobs.
      BLS expects strong demand, driven in part by the continued expansion of software development for artificial intelligence.
      Put these sources together, and one reading is that the work is moving: less typing of every line, more deciding what to build, designing how it fits, and checking what the tool wrote.
      It is a reading, not a forecast. But checking the machine's numbers is an old job here.
    shots:
      - {tpl: plate, at: 0, p: {hero: tower_code, frame0: 600, cap: [{s: "2 · software developers: design applications, plan how the pieces fit", at: "@design", src: [OOHSD]}]},
