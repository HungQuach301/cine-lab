           {s: "projected to shrink, 2025–35", at: "@shrink", src: [OOHCP]}]},
         sfx: [{file: assets/ll/sfx/keyboard-typing.mp3, at: 0.3, src_ss: 3.0, dur: 4.0, gain_db: -18, fade_ms: 600}]}
      - {tpl: plate, at: "@programming-0.4", in: fade, p: {hero: tower_code, frame0: 360, cap: [{s: "programming work continues to be automated", at: "@automated", src: [OOHCP]}, {s: "companies: technologies including AI", at: "@companies", src: [OOHCP]},
           {s: "higher-skilled tasks: likely to shift…", at: "@higherskilled", src: [OOHCP]}, {s: "…to other workers, such as software developers", at: "@developers", src: [OOHCP]}]},
         sfx: [{file: assets/ll/sfx/keyboard-typing.mp3, at: "@programming", src_ss: 6.3, dur: 4.0, gain_db: -15, fade_ms: 400}]}

