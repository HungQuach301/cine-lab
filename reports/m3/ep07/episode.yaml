segments:
  # ===== HỒI 1 · MỞ (ấm) =====
  - id: "00"
    part: STORY
    map: {q: "What happens to a job when a machine takes its name?", act: 1, emo: curiosity, color: warm, cue: theme, trade: [adding-machine, teleprinter-tape, keyboard-typing],
          in: cut, out: cut, lamp: {in: true, out: false},
          nouns: [{w: "@job", img: "dải cửa sổ sáng của phòng tính toán bên sân bay"}, {w: "@pencil", img: "bàn tính: giấy kẻ ô, máy tính cơ"}, {w: "@machine#2", img: "đầu đọc băng đục lỗ, cuộn băng quay"}, {w: "@code", img: "màn hình mã hiện dần"}]}
    vo: >-
      What happens to a job when a machine takes its name? The word computer has stood for three kinds of work.
      First, a person who calculated with a pencil. Second, the people who programmed a new machine. Third, people working beside a machine that can help write the code.
      Same word. Three different jobs.
    vo_offset: 0.6
    tail: 0.6
    fadeIn: 0
    shots:
      - {tpl: plate, at: 0, p: {hero: air_hook, frame0: 0, title: "WHEN COMPUTERS WERE PEOPLE", subtitle: "One word, three jobs · Last Lamplighters · Episode 7", titleAt: "@stood", titleOut: "@first-0.4",
           cap: [{s: "What happens to a job when a machine takes its name?", at: "@what", src: []}]},
         sfx: [{file: assets/ll/sfx/adding-machine.mp3, at: 0.6, src_ss: 2.0, dur: 3.5, gain_db: -20, fade_ms: 900}]}
      - {tpl: plate, at: "@first-0.3", in: fade, p: {hero: pool_desk, frame0: 60, cap: [{s: "first: a person who calculated with a pencil", at: "@first", src: [NASA1]}]},
         sfx: [{file: assets/ll/sfx/adding-machine.mp3, at: "@first", src_ss: 6.0, dur: 3.0, gain_db: -14, fade_ms: 300}]}
      - {tpl: plate, at: "@second-0.3", in: fade, p: {hero: relay_tape, frame0: 24, cap: [{s: "second: the people who programmed a new machine", at: "@second", src: [NASA1]}]},
         sfx: [{file: assets/ll/sfx/teleprinter-tape.mp3, at: "@second", src_ss: 4.0, dur: 3.0, gain_db: -14, fade_ms: 300}]}
      - {tpl: plate, at: "@third-0.3", in: fade, p: {hero: tower_code, frame0: 48, cap: [{s: "third: people beside a machine that can help write code", at: "@third", src: [MLR25]}]},
         sfx: [{file: assets/ll/sfx/keyboard-typing.mp3, at: "@third", src_ss: 2.0, dur: 3.2, gain_db: -15, fade_ms: 300}]}
      - {tpl: plate, at: "@same-0.3", in: fade, p: {hero: air_hook, frame0: 180, cap: [{s: "same word · three different jobs", at: "@same", src: []}]},
         sfx: [{file: assets/ll/sfx/adding-machine.mp3, at: "@same", src_ss: 12.0, dur: 3.0, gain_db: -20, fade_ms: 900}]}

  - id: "01"
    part: STORY
    map: {q: "Who works in that lit window?", act: 1, emo: wonder, color: warm, cue: theme, trade: [footsteps-steps, gas-hiss, adding-machine],
          in: cut, out: match, out_note: "đèn bàn sau ô kính → cùng đèn bàn chao xanh trên bàn tính (match cut); tiếng máy cộng vào trước 1 s", lamp: {in: true, out: true},
          nouns: [{w: "@lamplighter", img: "người thắp đèn đi dọc lối đá"}, {w: "@laboratory", img: "toà phòng thí nghiệm, nhà chứa máy bay, ống hầm gió"}, {w: "@window", img: "dải cửa sổ sáng"}, {w: "@flame", img: "ngọn lửa mồi đầu sào chạm đèn khí"}, {w: "@lamp", img: "đèn bàn sau ô kính bừng"}]}
    vo: >-
      At dusk, the lamplighter passes a research laboratory by an airfield. One long window is still lit.
      The lamplighter raises the flame to the post beside it, and inside, a desk lamp comes on, as if the light had been handed through the glass.
      Lamplighting is a job machines took over long ago. Tonight, it opens the story of another.
    vo_offset: 1.0
    min_dur: 28
    tail: 1.4
    shots:
      - {tpl: plate, at: 0, p: {hero: air_light, frame0: 0, ev: [{at: 3.0, what: "người thắp đèn vào khung"}, {at: 7.0, what: "người thắp đèn đi ngang ô cửa đầu"}, {at: 9.4, what: "dừng, giơ sào"}, {at: 10.6, what: "đèn khí bén"}, {at: 13.8, what: "đèn bàn sau kính bừng"}, {at: 18.0, what: "máy tới sát ô cửa"}, {at: 23.0, what: "máy dừng, nhìn vào phòng tính toán"}]},
         sfx: [{file: assets/ll/sfx/footsteps-steps.mp3, at: 1.0, src_ss: 0.5, dur: 8.5, gain_db: -13, fade_ms: 500}, {file: assets/ll/sfx/gas-hiss.mp3, at: 10.6, src_ss: 2.0, dur: 1.8, gain_db: -8, fade_ms: 200},
               {file: assets/ll/sfx/adding-machine.mp3, at: 14.0, src_ss: 8.0, dur: 7.0, gain_db: -22, fade_ms: 900}]}

  # ===== HỒI 2 · QUÁ KHỨ + CHUYỂN GIAO (sepia) =====
  - id: "02"
    part: HISTORY
    map: {q: "What did a human computer actually do?", act: 2, emo: craft, color: sepia, cue: history, trade: [adding-machine, film-reader, pencil-paper],
          in: match, in_note: "đèn bàn chao xanh khớp đèn bàn sau ô kính; tiếng máy cộng vào trước hình 1 s (J-cut)", out: cut, lamp: {in: true, out: false},
          nouns: [{w: "@person", img: "bàn tính: người (bóng) bên máy tính cơ"}, {w: "@hand", img: "giấy kẻ ô, đường đồ thị vẽ tay"}, {w: "@five", img: "phòng có năm bàn có người"}, {w: "@film", img: "ảnh NASA: máy đọc phim và máy Friden"},
                  {w: "@graph", img: "đường đồ thị vẽ dần trên giấy kẻ ô"}, {w: "@machines", img: "máy tính cơ, xe nhảy bậc"}, {w: "@engineers", img: "năm bàn tính, bảng đen phương trình"}]}
    vo: >-
      Before electronic computers, the word computer meant a person. It was a job title: someone who performed mathematical equations and calculations by hand.
      In 1935, five women formed the first computer pool at the Langley aeronautical laboratory in Virginia. They read film of the wind tunnel instruments, ran the calculations, and plotted the results on graph paper,
      using slide rules, magnifying glasses, and calculating machines that could multiply and take square roots. Their graphs went back to the engineers, to design the next test.
    shots:
      - {tpl: plate, at: 0, p: {hero: pool_desk, frame0: 0, cap: [{s: "before electronic computers: a computer was a person", at: "@before", src: [NASA1]}, {s: "a job title", at: "@title"}, {s: "equations and calculations, by hand", at: "@hand", src: [NASA1]}]},
         sfx: [{file: assets/ll/sfx/adding-machine.mp3, at: -1.0, src_ss: 1.0, dur: 7.0, gain_db: -15, fade_ms: 700}]}
      - {tpl: plate, at: "@1935-0.4", in: fade, p: {hero: pool_five, frame0: 0, cap: [{s: "Langley, Virginia, 1935", at: "@1935", src: [NASA1]}, {s: "the first computer pool: five women", at: "@pool", src: [NASA1]}]},
         sfx: [{file: assets/ll/sfx/wall-clock.mp3, at: "@1935", src_ss: 3.0, dur: 6.0, gain_db: -18, fade_ms: 600}]}
      - {tpl: archive, at: "@read-0.3", in: fade, p: {img: assets/ll/archive/nasa-LRC-1952-B701_P-74769.jpg, rid: NASA-LRC-1952-B701_P-74769, focus: [0.42, 0.45], credit: "Computer with Friden calculator, 1952 · NASA",
           cam: [{t: "@read-0.3", x: 30, z: 0.03}, {t: "@plotted+0.7", x: -10, z: 0.08}], cap: [{s: "read film of the wind tunnel instruments", at: "@read", src: [NASA1]}, {s: "run the calculations", at: "@ran"}]},
         sfx: [{file: assets/ll/sfx/film-reader.mp3, at: "@read", src_ss: 5.0, dur: 3.0, gain_db: -16, fade_ms: 400}]}
      - {tpl: plate, at: "@plotted-0.3", in: fade, p: {hero: pool_desk, frame0: 200, cap: [{s: "plot the results on graph paper", at: "@plotted", src: [NASA1]}, {s: "slide rules · magnifying glasses · calculating machines", at: "@slide"}]},
         sfx: [{file: assets/ll/sfx/pencil-paper.mp3, at: "@plotted", src_ss: 4.0, dur: 3.5, gain_db: -12, fade_ms: 400}, {file: assets/ll/sfx/adding-machine.mp3, at: "@multiply", src_ss: 14.0, dur: 3.0, gain_db: -15, fade_ms: 300}]}
      - {tpl: plate, at: "@graphs-0.4", in: fade, p: {hero: pool_five, frame0: 200, cap: [{s: "the graphs went back to the engineers…", at: "@graphs", src: [NASA1]}, {s: "…to design the next test", at: "@design"}]},
         sfx: [{file: assets/ll/sfx/wall-clock.mp3, at: "@graphs", src_ss: 12.0, dur: 4.0, gain_db: -18, fade_ms: 500}]}

  - id: "03"
    part: HISTORY
    map: {q: "Who were the computers, and what did the job open?", act: 2, emo: pride, color: sepia, cue: history, trade: [pencil-paper, footsteps-steps, wall-clock],
          in: cut, out: cut, lamp: {in: true, out: true},
          nouns: [{w: "@skilled", img: "bàn tính cận: thước tính, máy tính cơ"}, {w: "@door", img: "khung cửa từ hành lang tối nhìn vào phòng sáng"}, {w: "@narrow", img: "khung cửa hẹp"}, {w: "@engineers", img: "khung cửa hẹp, phòng sáng phía trong"}, {w: "@morning", img: "chồng giấy tính toán cao dần, đồng hồ"}]}
    vo: >-
      It was skilled work. Most of the women had degrees in mathematics or the sciences, and a good number had been high school teachers.
      The job was a door: a way into aeronautical research at a time when most women simply were not being hired as engineers, and it paid much better than most jobs open to women.
      It was a narrow door. The computers were classed as subprofessionals, while men with similar degrees were often hired as junior engineers, for more pay.
      A 1942 document said the computers did more in a morning than an engineer alone could finish in a day.
    shots:
      - {tpl: plate, at: 0, p: {hero: pool_desk, frame0: 360, cap: [{s: "skilled work", at: "@skilled"}, {s: "most had degrees in mathematics or the sciences", at: "@degrees", src: [NASA1]}, {s: "a good number: former high school teachers", at: "@good", src: [NASA1]}]},
         sfx: [{file: assets/ll/sfx/pencil-paper.mp3, at: 0.2, src_ss: 12.0, dur: 4.0, gain_db: -13, fade_ms: 500}]}
      - {tpl: plate, at: "@door-0.4", in: fade, p: {hero: pool_door, frame0: 0, cap: [{s: "the job was a door", at: "@door"}, {s: "a way into aeronautical research", at: "@aeronautical", src: [NASA1]}, {s: "…when most women were not being hired as engineers", at: "@simply", src: [NASA1]}, {s: "pay: much better than most jobs open to women", at: "@paid", src: [NASA1]}]},
         sfx: [{file: assets/ll/sfx/footsteps-steps.mp3, at: "@door", src_ss: 2.0, dur: 3.0, gain_db: -15, fade_ms: 400}, {file: assets/ll/sfx/adding-machine.mp3, at: "@research", src_ss: 4.0, dur: 5.0, gain_db: -20, fade_ms: 800}]}
      - {tpl: plate, at: "@narrow-0.4", in: fade, p: {hero: pool_door, frame0: 240, cap: [{s: "a narrow door", at: "@narrow"}, {s: "computers: classed as subprofessionals", at: "@subprofessionals", src: [NASA1]}, {s: "men with similar degrees: junior engineers, more pay", at: "@similar", src: [NASA1]}]},
         sfx: [{file: assets/ll/sfx/wall-clock.mp3, at: "@narrow", src_ss: 20.0, dur: 5.0, gain_db: -17, fade_ms: 500}]}
      - {tpl: plate, at: "@1942-0.4", in: fade, p: {hero: pool_stack, frame0: 0, cap: [{s: "a 1942 document:", at: "@1942", src: [NASA1]}, {s: "more in a morning than an engineer alone in a day", at: "@morning", src: [NASA1]}]},
         sfx: [{file: assets/ll/sfx/wall-clock.mp3, at: "@1942", src_ss: 30.0, dur: 7.0, gain_db: -15, fade_ms: 600}, {file: assets/ll/sfx/adding-machine.mp3, at: "@morning", src_ss: 18.0, dur: 4.0, gain_db: -16, fade_ms: 500}]}

  - id: "04"
    part: HISTORY
    map: {q: "How far did the work spread, and for whom?", act: 2, emo: weight, color: sepia, cue: history, trade: [adding-machine, wall-clock],
          in: cut, out: cut, lamp: {in: false, out: true},
          nouns: [{w: "@war", img: "ảnh NASA 1943: nữ vận hành thiết bị nghiên cứu ở hầm gió"}, {w: "@tunnels", img: "ảnh NASA 1943: hầm gió hai chiều"}, {w: "@seventyfive", img: "hàng hình người 1942", anchor: c42},
                  {w: "@about", img: "hàng hình người 1946, rồi phòng đầy dần người", anchor: c46}, {w: "@segregation", img: "vách ngăn giữa hai phòng tính toán giống hệt nhau"}, {w: "@work", img: "hai phòng, cùng việc"}]}
    pause: [{before: "@about", s: 0.7}]
    vo: >-
      Then came the war, and computing spread from one office into the wind tunnels and research divisions. A 1942 report counted seventy-five women computers.
      By 1946, the head of computing had trained about four hundred and placed them across the laboratory.
      The door did not open evenly. In the 1940s, Langley also began recruiting Black women with college degrees as computers.
      Under segregation, they were grouped in a separate section, the West Area Computers, with segregated dining rooms and bathrooms. They did the same work. In the 1950s, the sections began to integrate.
    shots:
