  - id: "05"
    part: HISTORY
    map: {q: "What happened when the machine arrived?", act: 2, emo: change, color: sepia, cue: history, trade: [relay-bank, teleprinter-tape],
          in: cut, out: cut, lamp: {in: false, out: false},
          nouns: [{w: "@second", img: "hành lang tủ rơ-le, đèn báo nhấp nháy"}, {w: "@computer", img: "ảnh NASA 1947: phòng máy Bell"}, {w: "@tape", img: "ảnh NASA 1947: người vận hành cầm băng"}, {w: "@programming#2", img: "đầu đọc băng đục lỗ, băng chạy"}]}
    vo: >-
      Then came the second kind of work. In 1947, the laboratory's agency acquired a huge electronic computer, and it got its own computing group:
      people in charge of programming it, feeding it punched tape to solve the equations of high-speed flight.
      With the first electronic computers, NASA's history says, the human computers took on programming duties as well.
    shots:
      - {tpl: plate, at: 0, p: {hero: relay_row, frame0: 0, cap: [{s: "the second kind of work", at: "@second"}]},
         sfx: [{file: assets/ll/sfx/relay-bank.mp3, at: -0.5, src_ss: 30.0, dur: 6.0, gain_db: -13, fade_ms: 600}]}
      - {tpl: archive, at: "@1947-0.3", in: fade, p: {img: assets/ll/archive/nasa-LRC-1947-B701_P-51532.jpg, rid: NASA-LRC-1947-B701_P-51532, focus: [0.5, 0.48], credit: "Bell computer control room, Langley, 1947 · NASA",
