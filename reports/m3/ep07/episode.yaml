shorts:
  - id: S1
    hook: "'Computer' used to be a job title"
    vo: >-
      Before electronic computers, the word computer meant a person. It was a job title: someone who performed mathematical equations and calculations by hand.
      In 1935, five women formed the first computer pool at the Langley aeronautical laboratory in Virginia.
    shots:
      - {tpl: plate, at: 0, p: {hero: s_pool, frame0: 0, fx: 0.5, cap: [{s: "a computer was a person", at: "@person", src: [NASA1]}, {s: "a job title", at: "@title"}, {s: "calculations by hand", at: "@hand"},
           {s: "1935: a computer pool of five women", at: "@1935", src: [NASA1]}]},
         sfx: [{file: assets/ll/sfx/adding-machine.mp3, at: 0.3, src_ss: 2.0, dur: 8.0, gain_db: -16, fade_ms: 900}]}
  - id: S2
    hook: "Programmers vs. developers, 2025–35"
    vo: >-
      Here, two job titles that sound alike are heading in different directions. The first is computer programmers: people who write, modify, and test code.
      Their jobs are projected to shrink from 2025 to 2035. The second is software developers: the people who design applications and plan how the pieces fit together.
      Their jobs are projected to grow, from one point seven two million in 2025 to one point eight nine million in 2035.
    shots:
      - {tpl: plate, at: 0, p: {hero: s_tower, frame0: 0, fx: 0.5, cap: [{s: "two job titles", at: "@titles"}, {s: "two directions", at: "@directions"}, {s: "programmers: projected to shrink", at: "@shrink", src: [OOHCP]},
           {s: "developers: design applications", at: "@second", src: [OOHSD]}, {num: sd35, s: "software developer jobs, projected 2035", at: "@nine"}]},
         sfx: [{file: assets/ll/sfx/keyboard-typing.mp3, at: 0.3, src_ss: 2.0, dur: 10.0, gain_db: -17, fade_ms: 900}]}
  - id: S3
    hook: "1990: AI as 'just additional tools'"
    vo: >-
      In 1990, the government's job handbook looked ahead. Improved software, it said, would simplify or eliminate some programming tasks.
      And artificial intelligence would become just additional tools available to programmers.
    shots:
      - {tpl: plate, at: 0, p: {hero: s_relay, frame0: 0, fx: 0.5, cap: [{s: "BLS job handbook, 1990", at: "@1990", src: [OOH90]}, {s: "software: simplify or eliminate…", at: "@simplify"}, {s: "…some programming tasks", at: "@tasks"},
           {s: "AI: “just additional tools…”", at: "@artificial", src: [OOH90]}, {s: "“…available to programmers”", at: "@available"}]},
         sfx: [{file: assets/ll/sfx/teleprinter-tape.mp3, at: 0.3, src_ss: 30.0, dur: 9.0, gain_db: -16, fade_ms: 900}]}
