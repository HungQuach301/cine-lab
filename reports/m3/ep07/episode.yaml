      - {tpl: quote, at: "@programming-0.4", in: slide, p: {beats: [{s: "generative AI", at: "@generative"}, {s: "develop · test · document code", at: "@develop"}, {s: "…and write user stories", at: "@user"}],
           text: "Programming is one of many work activities in which new LLMs and GenAI are well suited to augment worker efforts…", who: "BLS economists", where: "Monthly Labor Review, February 2025", at: "@programming", src: [MLR25]}}
      - {tpl: plate, at: "@stories-0.4", in: fade, p: {hero: tower_code, frame0: 480, cap: [{s: "user stories", at: "@stories", src: [MLR25]}, {s: "what a feature should do for the people who use it", at: "@feature"}]},
         sfx: [{file: assets/ll/sfx/mouse-clicks.mp3, at: "@stories", src_ss: 4.0, dur: 3.0, gain_db: -13, fade_ms: 300}]}
      - {tpl: plate, at: "@economists#2-0.4", in: fade, p: {hero: tower_floor, frame0: 0, cap: [{s: "the effect on the occupation: “highly uncertain”", at: "@highly", src: [MLR25]}]},
         sfx: [{file: assets/ll/sfx/keyboard-typing.mp3, at: "@highly", src_ss: 1.1, dur: 3.0, gain_db: -18, fade_ms: 600}]}

  - id: "11"
    part: TODAY
    map: {q: "Which job is shrinking, and which is growing?", act: 3, emo: clarity, color: cold, cue: today, trade: [keyboard-typing, teleprinter-tape],
          in: cut, out: cut, lamp: {in: true, out: true},
          nouns: [{w: "@titles", img: "toàn sàn: hàng bàn, phần lớn trống"}, {w: "@programmers", img: "toàn sàn, bàn trống"}, {w: "@automated", img: "màn hình mã tự hiện"}, {w: "@developers", img: "người (bóng) bên màn hình, đèn bàn"}]}
    vo: >-
      Here, two job titles that sound alike are heading in different directions. The first is computer programmers: people who write, modify, and test code.
      Their jobs are projected to shrink from 2025 to 2035. Programming work continues to be automated, BLS says, companies are expected to use technologies including AI,
      and some higher-skilled programming tasks will likely shift to other workers, such as software developers.
    shots:
