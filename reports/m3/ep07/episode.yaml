         sfx: [{file: assets/ll/sfx/relay-bank.mp3, at: "@1947", src_ss: 90.0, dur: 5.0, gain_db: -15, fade_ms: 500}]}
      - {tpl: archive, at: "@people-0.3", in: fade, p: {img: assets/ll/archive/nasa-LRC-1947-B701_P-52134.jpg, rid: NASA-LRC-1947-B701_P-52134, focus: [0.42, 0.42], credit: "Routine tape, Bell computer, 1947 · NASA",
