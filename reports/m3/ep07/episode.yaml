  - id: "13"
    part: TODAY
    map: {q: "What about the people just starting out?", act: 3, emo: concern, color: cold, cue: today, trade: [keyboard-typing, mouse-clicks],
          in: cut, out: cut, lamp: {in: true, out: true},
          nouns: [{w: "@starting", img: "bàn đầu hàng trống, đèn tắt"}, {w: "@payroll", img: "toàn sàn văn phòng"}, {w: "@gap", img: "cái thang tựa cột đèn, góc thấp"}, {w: "@nineteen", img: "cái thang, bậc dưới cùng chìm bóng; −19% trên dải chú thích"}, {w: "@hired", img: "bàn đầu hàng trống"}]}
    vo: >-
      What about the people just starting out? Economists at Stanford studied payroll records for millions of workers through June 2026. Overall employment is still robust.
      What they found is not a wave of layoffs. It is a gap. Employment of workers aged twenty-two to twenty-five in AI-exposed jobs, such as software development and customer service,
      now stands nineteen percent below where it would be had it kept pace with their less-exposed peers. Experienced workers show no comparable gap.
      And the gap comes mostly from fewer young people being hired, not from people being let go.
      The authors are careful: the hardest part, they write, is separating AI from everything else changing in the economy.
    shots:
      - {tpl: plate, at: 0, p: {hero: tower_floor, frame0: 0, cap: [{s: "the people just starting out", at: "@starting"}, {s: "Stanford: payroll records, millions of workers, to June 2026", at: "@stanford", src: [CAN]}, {s: "overall employment: still robust", at: "@robust", src: [CAN]}]},
         sfx: [{file: assets/ll/sfx/mouse-clicks.mp3, at: 0.5, src_ss: 18.0, dur: 2.5, gain_db: -16, fade_ms: 400}]}
      - {tpl: plate, at: "@layoffs-0.6", in: fade, p: {hero: ladder_low, frame0: 0, cap: [{s: "not a wave of layoffs: a gap", at: "@gap", src: [CAN]}, {s: "e.g. software development, customer service", at: "@customer", src: [CAN]},
           {num: can, s: "employment, ages 22–25, AI-exposed jobs, vs. less-exposed peers (2026)", at: "@nineteen"}]},
         sfx: [{file: assets/ll/sfx/gas-hiss.mp3, at: "@layoffs", src_ss: 5.0, dur: 4.0, gain_db: -18, fade_ms: 900}, {file: assets/ll/sfx/footsteps-steps.mp3, at: "@peers", src_ss: 9.0, dur: 2.5, gain_db: -18, fade_ms: 400}]}
      - {tpl: plate, at: "@experienced-0.4", in: fade, p: {hero: tower_in, frame0: 300, cap: [{s: "experienced workers: no comparable gap", at: "@experienced", src: [CAN]}, {s: "mostly: fewer young people hired…", at: "@mostly", src: [CAN]}, {s: "…not more people let go", at: "@let"}]},
         sfx: [{file: assets/ll/sfx/keyboard-typing.mp3, at: "@experienced", src_ss: 9.0, dur: 3.0, gain_db: -17, fade_ms: 400}]}
      - {tpl: plate, at: "@authors-0.4", in: fade, p: {hero: tower_floor, frame0: 360, cap: [{s: "the hardest part: separating AI…", at: "@hardest", src: [CAN]}, {s: "…from everything else changing in the economy", at: "@everything", src: [CAN]}]},
         sfx: [{file: assets/ll/sfx/mouse-clicks.mp3, at: "@authors", src_ss: 30.0, dur: 2.5, gain_db: -16, fade_ms: 400}]}

  - id: "14"
    part: TODAY
    map: {q: "Where will the next beginners learn?", act: 3, emo: reflection, color: cold, cue: today, trade: [relay-bank, keyboard-typing, gas-hiss],
          in: cut, out: match, out_note: "ngọn đèn trên đầu thang → ngọn đèn cạnh dải cửa sổ phòng tính toán (match cut); tiếng đèn xì", lamp: {in: true, out: true},
          nouns: [{w: "@possibility", img: "toàn sàn, bàn đầu hàng trống"}, {w: "@technology", img: "khung đôi: tủ rơ-le 1947 | màn hình mã"}, {w: "@machine", img: "khung đôi"}, {w: "@ladder", img: "cái thang tựa cột đèn, bậc dưới chìm bóng"}, {w: "@beginners#3", img: "bậc dưới cùng của thang"}]}
    vo: >-
      They raise one possibility: AI may be taking over the checkable, routine tasks that once justified hiring beginners.
      The technology is not the same as in 1947, but the pattern is familiar: a repetitive task goes to a machine, and people move to the work around it.
      One difference matters. Back then, the new machine needed new people to program it, so the change opened doors at the start of a career.
      This time, it shows up first at the bottom of the ladder. If the tools take on the simple tasks that beginners once learned on, where will the next beginners learn?
    tail: 1.2
    shots:
      - {tpl: plate, at: 0, p: {hero: tower_floor, frame0: 300, cap: [{s: "one possibility: AI may take over checkable, routine tasks", at: "@possibility", src: [CAN]}, {s: "…that once justified hiring beginners", at: "@justified"}]},
         sfx: [{file: assets/ll/sfx/keyboard-typing.mp3, at: 0.3, src_ss: 2.2, dur: 3.0, gain_db: -18, fade_ms: 600}]}
      - {tpl: diptych, at: "@technology-0.4", in: fade, p: {split: "@technology+0.3", left: {hero: relay_row, i: 200, fx: 0.5}, right: {hero: tower_code, i: 420, fx: 0.5},
           cap: [{s: "not the same technology as in 1947", at: "@technology", src: [NASA1]}, {s: "a familiar pattern: a repetitive task goes to a machine…", at: "@pattern"}, {s: "…people move to the work around it", at: "@people"}]},
         sfx: [{file: assets/ll/sfx/relay-bank.mp3, at: "@technology", src_ss: 200.0, dur: 4.0, gain_db: -15, fade_ms: 500}]}
      - {tpl: plate, at: "@back-0.4", in: fade, p: {hero: relay_tape, frame0: 200, cap: [{s: "back then: the new machine needed new people", at: "@needed"}, {s: "doors at the start of a career", at: "@doors"}]},
         sfx: [{file: assets/ll/sfx/teleprinter-tape.mp3, at: "@back", src_ss: 70.0, dur: 4.0, gain_db: -15, fade_ms: 400}]}
      - {tpl: plate, at: "@this-0.4", in: fade, p: {hero: ladder, frame0: 0, cap: [{s: "this time: the bottom of the ladder first", at: "@bottom", src: [CAN]}, {s: "the simple tasks beginners once learned on", at: "@simple"}, {s: "where will the next beginners learn?", at: "@where", src: []}]},
         sfx: [{file: assets/ll/sfx/gas-hiss.mp3, at: "@this", src_ss: 4.0, dur: 3.0, gain_db: -14, fade_ms: 700}, {file: assets/ll/sfx/footsteps-steps.mp3, at: "@where+1.0", src_ss: 0.5, dur: 2.0, gain_db: -16, fade_ms: 400}]}

  # ===== HỒI 4 · KẾT (ấm) =====
  - id: "15"
    part: TODAY
    map: {q: "What happens to a job when a machine takes its name? (trả lời)", act: 4, emo: resolve, color: warm, cue: theme, trade: [adding-machine, teleprinter-tape, keyboard-typing],
          in: match, in_note: "ngọn đèn khí cạnh dải cửa sổ, khớp ngọn đèn trên đầu thang", out: cut, lamp: {in: true, out: true},
          nouns: [{w: "@job", img: "dải cửa sổ phòng tính toán lúc chạng vạng"}, {w: "@calculating", img: "bàn tính 1940s"}, {w: "@programming", img: "đầu đọc băng đục lỗ"}, {w: "@beside", img: "màn hình mã, đèn bàn"},
                  {w: "@name#2", img: "đèn bàn sau ô kính bừng"}, {w: "@newest", img: "dải cửa sổ sáng"}]}
    vo: >-
      What happens to a job when a machine takes its name? Three times, the word computer meant different work: calculating by hand, programming the machine, and now working beside it.
      The arithmetic went to the machine, and many of the people moved on to the work around it. Now the machine can help write the code.
      The name stayed; the work moved on. Whether the newest workers can move on with it is the question this time.
    tail: 0.8
    shots:
      - {tpl: plate, at: 0, p: {hero: air_hook, frame0: 96, cap: [{s: "What happens to a job when a machine takes its name?", at: "@what", src: []}, {s: "three times, the word meant different work", at: "@three"}]},
