  - id: "06"
    part: HISTORY
    map: {q: "Who checked whom, the machine or the people?", act: 2, emo: tension, color: sepia, cue: history, trade: [pencil-paper, relay-bank, adding-machine],
          in: cut, out: cut, lamp: {in: true, out: false},
          nouns: [{w: "@paths", img: "đường quỹ đạo vẽ dần trên giấy kẻ ô"}, {w: "@programmers", img: "quỹ đạo, máy tính cơ, đèn bàn"}, {w: "@explorer", img: "quỹ đạo khép vòng"}, {w: "@machines", img: "tủ rơ-le nhấp nháy"}, {w: "@astronaut", img: "ảnh NASA 1957: phòng máy IBM 704 và bàn tính"}]}
    vo: >-
      At the Jet Propulsion Laboratory in California, women computers calculated the paths of spacecraft, and went on to become some of the first computer programmers at NASA.
      In 1958, their calculations helped put Explorer 1, the first American satellite, into orbit.
      At first, as JPL puts it, the machines were fast but not nearly as reliable as the people.
      Before the first American orbital flight, the astronaut asked for a mathematician who had started out as a human computer to check the machine's numbers.
    shots:
      - {tpl: plate, at: 0, p: {hero: pool_orbit, frame0: 0, cap: [{s: "JPL, California: computing the paths of spacecraft", at: "@paths", src: [NASA2]}, {s: "some of the first computer programmers at NASA", at: "@programmers", src: [NASA2]},
           {s: "1958: Explorer 1, the first American satellite", at: "@1958", src: [NASA2]}, {s: "…into orbit", at: "@orbit"}]},
         sfx: [{file: assets/ll/sfx/pencil-paper.mp3, at: 0.3, src_ss: 20.0, dur: 6.0, gain_db: -13, fade_ms: 500}, {file: assets/ll/sfx/adding-machine.mp3, at: "@1958", src_ss: 8.0, dur: 3.5, gain_db: -16, fade_ms: 400}]}
      - {tpl: plate, at: "@first#3-0.4", in: fade, p: {hero: relay_row, frame0: 160, cap: [{s: "at first: the machines were fast…", at: "@first#3", src: [NASA2]}, {s: "…but not nearly as reliable as the people", at: "@reliable", src: [NASA2]}]},
         sfx: [{file: assets/ll/sfx/relay-bank.mp3, at: "@first#3", src_ss: 150.0, dur: 5.0, gain_db: -14, fade_ms: 500}]}
      - {tpl: archive, at: "@before-0.3", in: fade, p: {img: assets/ll/archive/nasa-LRC-1957-B701_P-05391.jpg, rid: NASA-LRC-1957-B701_P-05391, focus: [0.48, 0.55], credit: "IBM 704 room, Langley, 1957 · NASA",
           cam: [{t: "@before-0.3", x: 30, z: 0.02}, {t: "@numbers+1", x: -20, z: 0.09}], cap: [{s: "the first American orbital flight", at: "@orbital", src: [NASA3]}, {s: "a mathematician who started as a human computer", at: "@mathematician", src: [NASA3]}, {s: "“check the machine's numbers”", at: "@check", src: [NASA3]}]},
         sfx: [{file: assets/ll/sfx/adding-machine.mp3, at: "@check", src_ss: 4.0, dur: 3.0, gain_db: -16, fade_ms: 400}]}

  - id: "07"
    part: HISTORY
    map: {q: "When the arithmetic left, where did the people go?", act: 2, emo: change, color: sepia, cue: history, trade: [wall-clock, teleprinter-tape],
          in: cut, out: cut, lamp: {in: true, out: true},
          nouns: [{w: "@arithmetic", img: "phòng tính toán, đèn bàn tắt dần"}, {w: "@dwindling", img: "phòng tính toán vắng dần"}, {w: "@engineering", img: "ảnh NASA 1959: các nữ nhà nghiên cứu Langley"}, {w: "@programming", img: "đầu đọc băng đục lỗ"}, {w: "@equal", img: "vách ngăn hai phòng"}]}
    vo: >-
      Over time, the arithmetic itself went to the machines. Human computing at Langley lasted into the 1970s,
      but NASA calls those years the dwindling days of human computing, as electronic computers became part of everyday work. The job of calculating by hand faded away.
      Many of the people found new work. Through the 1950s and 1960s, more and more of them worked their way out of the computer pool and into engineering.
      Others moved into programming. Not all of them, and not on equal terms.
    shots:
      - {tpl: plate, at: 0, p: {hero: pool_empty, frame0: 0, cap: [{s: "over time: the arithmetic went to the machines", at: "@arithmetic", src: [NASA3]}, {s: "human computing at Langley: into the 1970s", at: "@1970s", src: [NASA1]},
           {s: "“the dwindling days of human computing”", at: "@dwindling", src: [NASA3]}, {s: "electronic computers: part of everyday work", at: "@everyday", src: [NASA3]}, {s: "calculating by hand faded away", at: "@faded"}]},
         sfx: [{file: assets/ll/sfx/wall-clock.mp3, at: 0.3, src_ss: 8.0, dur: 9.0, gain_db: -16, fade_ms: 900}]}
      - {tpl: archive, at: "@many-0.3", in: fade, p: {img: assets/ll/archive/nasa-LRC-1959-B701_P-00007.jpg, rid: NASA-LRC-1959-B701_P-00007, focus: [0.5, 0.5], credit: "Women researchers at Langley, 1959 · NASA",
           cam: [{t: "@many-0.3", x: -20, z: 0.02}, {t: "@others+0.6", x: 20, z: 0.08}], cap: [{s: "many found new work", at: "@many"}, {s: "1950s–60s: out of the computer pool…", at: "@through", src: [NASA3]}, {s: "…worked their way…", at: "@worked"}, {s: "…into engineering", at: "@engineering"}]},
         sfx: [{file: assets/ll/sfx/pencil-paper.mp3, at: "@many", src_ss: 30.0, dur: 3.0, gain_db: -15, fade_ms: 400}]}
      - {tpl: plate, at: "@others-0.4", in: fade, p: {hero: relay_tape, frame0: 120, cap: [{s: "others: into programming", at: "@others", src: [NASA1]}]},
         sfx: [{file: assets/ll/sfx/teleprinter-tape.mp3, at: "@others", src_ss: 60.0, dur: 3.0, gain_db: -15, fade_ms: 400}]}
      - {tpl: plate, at: "@not-0.3", in: fade, p: {hero: pool_split, frame0: 200, cap: [{s: "not all of them, and not on equal terms", at: "@not"}]},
         sfx: [{file: assets/ll/sfx/wall-clock.mp3, at: "@not", src_ss: 48.0, dur: 4.0, gain_db: -17, fade_ms: 600}]}

  - id: "08"
    part: HISTORY
    map: {q: "Did anyone see the next change coming?", act: 2, emo: foresight, color: sepia, cue: history, trade: [teleprinter-tape, wall-clock, footsteps-steps],
          in: cut, out: jcut, out_note: "dải cửa sổ phòng tính toán lúc chạng vạng → cùng toà nhà lúc tối (đoạn 09); bước chân người thắp đèn vào trước hình 1,2 s", lamp: {in: false, out: true},
          nouns: [{w: "@occupation", img: "đầu đọc băng đục lỗ, băng chạy"}, {w: "@five", img: "hành lang tủ máy, số 519,000 trên dải chú thích", anchor: prog88}, {w: "@handbook", img: "đầu đọc băng đục lỗ (sổ tay 1990 nhìn về nghề lập trình)"}, {w: "@artificial", img: "dải cửa sổ phòng tính toán lúc chạng vạng, đèn khí"}]}
    pause: [{before: "@five", s: 0.7}]
    vo: >-
      Programming grew into a large occupation of its own. By 1988, computer programmers held five hundred nineteen thousand jobs in the United States.
      That count comes from another era, with different job definitions, so we will not set it beside today's numbers.
      In 1990, the government's job handbook looked ahead. Improved software, it said, would simplify or eliminate some programming tasks.
      And artificial intelligence would become just additional tools available to programmers.
    shots:
      - {tpl: plate, at: 0, p: {hero: relay_tape, frame0: 160, cap: [{s: "programming: a large occupation of its own", at: "@programming", src: [OOH90]}]},
         sfx: [{file: assets/ll/sfx/teleprinter-tape.mp3, at: 0.2, src_ss: 26.0, dur: 4.0, gain_db: -15, fade_ms: 500}]}
      - {tpl: plate, at: "@1988-0.6", in: fade, p: {hero: relay_row, frame0: 240, cap: [{num: prog88, s: "computer programmer jobs, United States, 1988", at: "@five"}]},
         sfx: [{file: assets/ll/sfx/relay-bank.mp3, at: "@1988", src_ss: 120.0, dur: 5.0, gain_db: -16, fade_ms: 600}]}
      - {tpl: plate, at: "@count-0.4", in: fade, p: {hero: pool_grow, frame0: 60, cap: [{s: "a count from another era, other job definitions", at: "@count", src: [OOH90]}, {s: "not set beside today's numbers", at: "@beside"}]},
         sfx: [{file: assets/ll/sfx/adding-machine.mp3, at: "@count", src_ss: 12.0, dur: 4.0, gain_db: -18, fade_ms: 600}]}
      - {tpl: plate, at: "@1990-0.4", in: fade, p: {hero: relay_tape, frame0: 300, cap: [{s: "1990: the government's job handbook", at: "@1990", src: [OOH90]}, {s: "it looked ahead", at: "@looked"}]},
         sfx: [{file: assets/ll/sfx/teleprinter-tape.mp3, at: "@1990", src_ss: 50.0, dur: 3.5, gain_db: -16, fade_ms: 500}]}
      - {tpl: quote, at: "@improved-0.4", in: flip, p: {beats: [{s: "the BLS, 1990", at: "@improved"}],
           text: "…improved software and programming techniques simplify or eliminate some programming tasks.", who: "U.S. Bureau of Labor Statistics", where: "Occupational Outlook Handbook, 1990–91", at: "@improved", src: [OOH90]}}
      - {tpl: plate, at: "@artificial-0.4", in: fade, p: {hero: air_light, frame0: 480, cap: [{s: "AI: “just additional tools available to programmers”", at: "@artificial", src: [OOH90]}]},
         sfx: [{file: assets/ll/sfx/adding-machine.mp3, at: "@artificial", src_ss: 20.0, dur: 5.0, gain_db: -20, fade_ms: 900}]}

  # ===== HỒI 3 · HIỆN TẠI + TƯƠNG LAI (lạnh) =====
  - id: "09"
    part: STORY
    map: {q: "Where is the light now?", act: 3, emo: unease, color: cold, cue: today, trade: [footsteps-steps, keyboard-typing],
          in: jcut, in_note: "bước chân người thắp đèn vào trước hình 1,2 s, kéo qua điểm cắt", out: cut, lamp: {in: true, out: false},
          nouns: [{w: "@lamplighter", img: "người thắp đèn đi qua cột đèn"}, {w: "@dark", img: "dải cửa sổ phòng tính toán tắt"}, {w: "@tower", img: "tháp văn phòng sau mái nhà, một tầng bừng"}, {w: "@developer", img: "người (bóng) bên hai màn hình"}, {w: "@code", img: "mã hiện dần trên màn hình"}, {w: "@check", img: "một dòng mã được đánh dấu"}]}
