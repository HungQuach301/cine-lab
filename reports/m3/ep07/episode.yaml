shorts:
  - id: S1
    hook: "A 'computer' used to be a person"
    vo: >-
      Before electronic computers, the word computer meant a person. In 1935, a government aeronautics lab started a computer pool with five women. By 1946, it had trained about four hundred. When electronic computers arrived, the human computers took on programming duties.
    shots:
      - {tpl: desk, at: 0, p: {eras: [{era: 1944, at: 0, label: " "}, {era: 1988, at: "@electronic#2-0.3", label: " "}], accent: "#6a4c8c", cam: [{t: 0, x: 0, z: 0.02}, {t: 8, x: -30, z: 0.06}, {t: 16, x: -60, z: 0.1}, {t: 22, x: -80, z: 0.12}],
           cap: [{s: "a computer was a person", at: "@person", src: [NASA1]}, {s: "1935: a pool of five women", at: "@1935", src: [NASA1]}, {num: c46, s: "trained by 1946", at: "@four"},
                 {s: "then: the human computers took on programming", at: "@programming"}]}}
  - id: S2
    hook: "1990: 'AI will be just another tool for programmers'"
    vo: >-
      In 1990, the Bureau of Labor Statistics wrote that AI principles and languages would become just additional tools available to programmers. It also expected improved software to simplify or eliminate some programming tasks. Thirty-six years later, that is the question again.
    shots:
      - {tpl: desk, at: 0, p: {eras: [{era: 1988, at: 0, label: " "}, {era: 2025, at: "@thirtysix-0.3", label: " "}], accent: "#6a4c8c", cam: [{t: 0, x: 0, z: 0.02}, {t: 8, x: -30, z: 0.06}, {t: 16, x: -60, z: 0.1}],
           cap: [{s: "BLS, 1990", at: "@1990", src: [OOH90]}, {s: "AI: just additional tools for programmers", at: "@principles"}, {s: "software simplifies some programming tasks", at: "@simplify"}, {s: "the question, again", at: "@question"}]}}
  - id: S3
    hook: "Young workers in AI-exposed jobs: −19%"
    vo: >-
      Stanford economists studied payroll data for millions of workers. Employment of twenty-two to twenty-five year olds in AI-exposed jobs now stands nineteen percent below where it would be had it kept pace with less-exposed peers. Experienced workers show no such gap.
    shots:
      - {tpl: sign, at: 0, p: {num: can, at: "@nineteen", cam: [{t: 0, x: 0, z: 0.0}, {t: 6, x: -20, z: 0.03}],
           cap: [{s: "payroll data, millions of workers", at: "@payroll", src: [CAN]}, {s: "ages 22–25, AI-exposed jobs", at: "@twentytwo", src: [CAN]}, {s: "vs. less-exposed peers", at: "@pace"}, {s: "experienced workers: no gap", at: "@experienced"}]}}
