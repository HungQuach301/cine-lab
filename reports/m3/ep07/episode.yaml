  - id: "10"
    part: TODAY
    map: {q: "What does the third kind of work look like?", act: 3, emo: curiosity, color: cold, cue: today, trade: [keyboard-typing, mouse-clicks],
          in: cut, out: cut, lamp: {in: true, out: true},
          nouns: [{w: "@code", img: "màn hình mã"}, {w: "@economists", img: "toàn sàn văn phòng đêm (BLS economists, 2025)"}, {w: "@stories", img: "màn hình thứ hai: sơ đồ chức năng"}, {w: "@uncertain", img: "toàn sàn văn phòng đêm"}]}
    vo: >-
      Today, the third kind of work. The computer can help write the code. In 2025, BLS economists wrote that programming is one of the activities AI is well suited to augment.
      Software developers can use generative AI to develop, test, and document code, and to write user stories, short descriptions of what a feature should do for the people who use it.
      The economists called the effect on the occupation highly uncertain.
    shots:
      - {tpl: plate, at: 0, p: {hero: tower_code, frame0: 240, cap: [{s: "today: the third kind of work", at: "@today"}, {s: "the computer can help write the code", at: "@help", src: [MLR25]}]},
         sfx: [{file: assets/ll/sfx/keyboard-typing.mp3, at: 0.2, src_ss: 12.8, dur: 4.5, gain_db: -15, fade_ms: 500}]}
      - {tpl: plate, at: "@2025-0.4", in: fade, p: {hero: tower_floor, frame0: 480, cap: [{s: "BLS economists, 2025", at: "@2025", src: [MLR25]}]},
