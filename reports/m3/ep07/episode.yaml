         sfx: [{file: assets/ll/sfx/teleprinter-tape.mp3, at: "@punched", src_ss: 20.0, dur: 3.5, gain_db: -15, fade_ms: 400}]}
      - {tpl: plate, at: "@human-0.4", in: fade, p: {hero: relay_tape, frame0: 0, cap: [{s: "human computers took on programming duties", at: "@human", src: [NASA1]}]},
