      - {tpl: plate, at: "@ten-1.2", in: fade, p: {hero: tower_code, frame0: 720, cap: [{s: "same source, same period: BLS projections 2025–35", at: "@that", src: [OOHSD, EP]}, {num: sd_chg, s: "software developers, projected 2025–35", at: "@ten"}, {num: all_chg, s: "all jobs, projected 2025–35", at: "@three"}]},
         sfx: [{file: assets/ll/sfx/keyboard-typing.mp3, at: "@ten", src_ss: 5.0, dur: 3.0, gain_db: -18, fade_ms: 400}]}
      - {tpl: plate, at: "@bls-0.4", in: fade, p: {hero: tower_floor, frame0: 240, cap: [{s: "BLS: strong demand…", at: "@demand", src: [OOHSD]}, {s: "…driven in part by software development for AI", at: "@expansion", src: [OOHSD]}]},
         sfx: [{file: assets/ll/sfx/keyboard-typing.mp3, at: "@bls", src_ss: 12.0, dur: 3.5, gain_db: -17, fade_ms: 500}]}
      - {tpl: diptych, at: "@put-0.4", in: fade, p: {split: "@put+0.3", left: {hero: pool_desk, i: 300, fx: 0.5}, right: {hero: tower_code, i: 300, fx: 0.5},
           cap: [{s: "one reading: the work is moving", at: "@reading"}, {s: "less typing of every line", at: "@less"}, {s: "more deciding what to build · designing", at: "@deciding"}, {s: "…and checking what the tool wrote", at: "@checking"}, {s: "a reading, not a forecast", at: "@forecast"}, {s: "checking the machine's numbers: an old job here", at: "@checking#2"}]},
