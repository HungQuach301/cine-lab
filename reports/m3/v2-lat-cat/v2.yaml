segments:
  - id: "00"
    part: STORY
    vo: >-
      What happened to the typing pool? In 1970, about three point nine million Americans were stenographers, typists, or secretaries.
      Today, typing for a living is projected to shrink thirty-four percent. Who gets the next door?
    vo_offset: 0.6
    tail: 0.6
    fadeIn: 0
    shots:
      - {tpl: rows, at: 0, p: {variant: typing, rows: 3, per: 7, dim: ["@today", "@percent"], screen: "@percent",
           cam: [{t: 0, x: 0, z: 0.02}, {t: 4, x: -40, z: 0.06}, {t: 8, x: -70, z: 0.1}, {t: 12, x: -90, z: 0.13}, {t: 18, x: -110, z: 0.16}],
           cap: [{s: "What happened to the typing pool?", at: "@what"}, {num: st70, s: "stenographers, typists & secretaries, U.S., 1970", at: "@three"}, {num: wp_chg, s: "word processors & typists, projected 2025–35", at: "@thirtyfour"},
                 {s: "Who gets the next door?", at: "@who"}]}}

  - id: "01"
    part: STORY
    vo: >-
      At dusk, the lamplighter passes an office block. On the third floor, rows of green desk lamps, and a sound comes down to the street:
      keys striking, a small bell, the slap of a carriage return. This was the typing pool.
    vo_offset: 3.4
    min_dur: 24
    tail: 1.2
    shots:
      - {tpl: text, at: 0, p: {lamp: true, lines: [{s: "THE TYPING POOL", px: 84}, {s: "Last Lamplighters · Episode 4", px: 34, serif: false}]}}
      - {tpl: street, at: 3.0, in: fade, p: {lamps: [{x: 260}, {x: 860, lit: "@passes+0.8"}, {x: 1460}, {x: 2060}], lighter: {from: 500, to: 820, walk: [3.2, "@passes+0.5"], lights: [1]}, warm: 0.6, windows: 0.9,
                                 cam: [{t: 3, x: 0, z: 0}, {t: 7, x: -90, z: 0.02}, {t: "@floor", x: -260, z: 0.06}]}}
      - {tpl: rows, at: "@sound-0.4", in: fade, p: {variant: typing, rows: 3, per: 7, cam: [{t: "@sound", x: 40, z: 0}, {t: "@bell", x: 0, z: 0.05}, {t: "@pool+1.2", x: -40, z: 0.1}]}}

  - id: "02"
    part: HISTORY
    vo: >-
      The typewriter made a new kind of job almost overnight. Letters, contracts, invoices, all of it now had to be typed, and someone had to take it down first in shorthand.
      In 1900, the U.S. census counted about one hundred thirty-four thousand stenographers, typists, and secretaries. By 1930, about one point one million.
      By 1950, about one point seven million. The census itself warns that the 1900 figures are approximations, and that definitions shifted from count to count.
      So read the early line as a shape, not a precise measure. And the shape is a boom.
    min_dur: 30
    shots:
      - {tpl: archive, at: 0, p: {img: assets/ll/archive/fsa-8d03493.jpg, rid: LOC-8d03493, credit: "Library of Congress, FSA/OWI Collection (no known restrictions)",
           cam: [{t: 0, x: 40, z: 0.0}, {t: 6, x: 0, z: 0.05}, {t: 12, x: -40, z: 0.1}], cap: [{s: "The typewriter: a new kind of job", at: "@typewriter"}, {s: "letters · contracts · invoices · shorthand", at: "@letters"}]}}
      - {tpl: isotype, at: "@1900-1.0", in: fade, p: {title: "Stenographers, typists & secretaries, U.S.", subtitle: "census counts · 1900 figures are approximations", unit: 100000, unitName: "workers",
           groups: [{label: "1900", num: st1900, at: "@1900"}, {label: "1930", num: st1930, at: "@1930"}, {label: "1950", num: st1950, at: "@1950"}],
           cap: [{s: "counted in the U.S. census", at: "@census"}, {s: "1900 figures: approximations only", at: "@approximations"}, {s: "a shape, not a precise measure", at: "@shape"}]}}
