  - id: "10"
    part: TODAY
    map: {q: "What does the translator's desk look like today?", act: 3, emo: clarity, color: cold, cue: today, trade: [computer-home, keyboard-typing, mouse-clicks],
          in: cut, out: cut, lamp: {in: true, out: true},
          nouns: [{w: "@box", img: "màn hình bản nháp máy"}, {w: "@handbook", img: "bàn người dịch hôm nay: hai màn hình"}, {w: "@database", img: "màn hình trái: tài liệu tham khảo, bảng thuật ngữ"},
                  {w: "@draft", img: "màn hình phải: câu nháp máy, đang sửa"}, {w: "@postediting", img: "đoạn được duyệt chuyển màu xanh"}]}
    vo: >-
      That box is machine translation. After 2010, Google Translate arrived as a phone app and inside web browsers, and it went into everyday use.
      Today, the government's job handbook describes two kinds of machine on the translator's desk. One keeps a database of sentences already translated, so they can be reused.
      The other, machine translation software, writes a first draft, which the translator then reviews. The handbook calls this post-editing: the same word the committee used in 1966 for people correcting the machine.
      Then, it was slower than translating from scratch. Now it is part of the job.
    shots:
      - {tpl: plate, at: 0, p: {hero: st_screen, frame0: 240, cap: [{s: "after 2010", at: "@2010", src: [FLP]}, {s: "Google Translate: a phone app…", at: "@google", src: [FLP]}, {s: "…and inside web browsers", at: "@inside", src: [FLP]}, {s: "…and into everyday use", at: "@everyday", src: [FLP]}]},
         sfx: [{file: assets/ll/sfx/computer-home.mp3, at: 0.2, src_ss: 40.0, dur: 6.0, gain_db: -16, fade_ms: 500}]}
      - {tpl: plate, at: "@today-0.4", in: fade, p: {hero: st_room, frame0: 0, cap: [{s: "the government's job handbook, today", at: "@handbook", src: [OOHIT]}, {s: "one machine: a database of sentences already translated", at: "@database", src: [OOHIT]}]},
         sfx: [{file: assets/ll/sfx/mouse-clicks.mp3, at: "@today", src_ss: 4.0, dur: 3.0, gain_db: -15, fade_ms: 300}]}
      - {tpl: plate, at: "@other-0.4", in: fade, p: {hero: st_screen, frame0: 480, cap: [{s: "the other: machine translation software…", at: "@software", src: [OOHIT]}, {s: "…writes a first draft", at: "@draft", src: [OOHIT]}, {s: "the translator reviews: post-editing", at: "@reviews", src: [OOHIT]}]},
         sfx: [{file: assets/ll/sfx/keyboard-typing.mp3, at: "@other", src_ss: 2.0, dur: 4.0, gain_db: -16, fade_ms: 400}]}
      - {tpl: diptych, at: "@same-0.3", in: fade, p: {split: "@now-0.2", left: {hero: pe_mark, i: 300, fx: 0.5}, right: {hero: st_screen, i: 600, fx: 0.55}, labels: ["1966: postediting", "today: post-editing"],
           cap: [{s: "the same word as 1966", at: "@same", src: [ALPAC]}, {s: "then: slower than translating from scratch", at: "@then#2"}, {s: "now: part of the job", at: "@now", src: [OOHIT]}]},
         sfx: [{file: assets/ll/sfx/pencil-paper.mp3, at: "@same", src_ss: 50.0, dur: 3.5, gain_db: -17, fade_ms: 400}, {file: assets/ll/sfx/keyboard-typing.mp3, at: "@now", src_ss: 8.0, dur: 3.0, gain_db: -17, fade_ms: 400}]}

  - id: "11"
    part: TODAY
    map: {q: "Did everyday machine translation change translators' jobs?", act: 3, emo: sober, color: cold, cue: today, trade: [computer-home, mouse-clicks],
          in: cut, out: cut, lamp: {in: true, out: false},
          nouns: [{w: "@oxford", img: "bàn người dịch hôm nay, góc cửa sổ"}, {w: "@markets", img: "bàn người dịch hôm nay, phố ngoài cửa sổ"}, {w: "@twentyeight", img: "biển số ≈28,000 trên tường gạch", anchor: frey},
                  {w: "@editors", img: "kệ từ điển, bàn làm việc"}, {w: "@higherskilled", img: "màn hình: đoạn được duyệt"}]}
    pause: [{before: "@twentyeight", s: 0.7}]
    vo: >-
      The change shows up in the numbers too. Economists at Oxford compared hundreds of local job markets across the United States.
      Where people used Google Translate more, translator employment grew more slowly. What they found was not layoffs.
      It was jobs that never appeared: they estimate about twenty-eight thousand translator jobs that the profession's growth would have created, but did not. It is an estimate, not a count.
      Similar jobs, such as editors and technical writers, showed no such effect. The study also points to a shift toward higher-skilled translation work, the tasks machine translation cannot easily replace.
    shots:
      - {tpl: plate, at: 0, p: {hero: st_side, frame0: 0, cap: [{s: "Oxford economists", at: "@oxford", src: [FLP]}, {s: "hundreds of local job markets across the United States", at: "@hundreds", src: [FLP]}, {s: "where people used Google Translate more…", at: "@google", src: [FLP]}, {s: "…translator employment grew more slowly", at: "@slowly", src: [FLP]},
           {s: "not layoffs", at: "@layoffs"}]},
         sfx: [{file: assets/ll/sfx/computer-home.mp3, at: 0.3, src_ss: 60.0, dur: 6.0, gain_db: -17, fade_ms: 600}]}
      - {tpl: sign, at: "@never-0.5", in: fade, p: {num: frey, at: "@twentyeight", wall: plaster,
           cam: [{t: "@never-0.5", x: 0, z: 0.0}, {t: "@count+1", x: -30, z: 0.04}], cap: [{s: "translator jobs never added, U.S., after 2010", at: "@growth", src: [FLP]}, {s: "an estimate, not a count", at: "@estimate", src: [FLP]}]},   # Q5 1080p: chữ caption trên tường 3,28:1 → đưa xuống dải chú thích tối
         sfx: [{file: assets/ll/sfx/mouse-clicks.mp3, at: "@never", src_ss: 10.0, dur: 2.5, gain_db: -18, fade_ms: 300}]}
      - {tpl: plate, at: "@similar-0.4", in: fade, p: {hero: st_room, frame0: 200, cap: [{s: "editors, technical writers: no such effect", at: "@editors", src: [FLP]}, {s: "a shift toward higher-skilled work", at: "@shift", src: [FLP]}]},
         sfx: [{file: assets/ll/sfx/computer-home.mp3, at: "@similar", src_ss: 80.0, dur: 5.0, gain_db: -17, fade_ms: 600}]}
      - {tpl: plate, at: "@tasks-0.4", in: fade, p: {hero: st_screen, frame0: 720, cap: [{s: "the tasks machine translation cannot easily replace", at: "@tasks", src: [FLP]}]},
         sfx: [{file: assets/ll/sfx/keyboard-typing.mp3, at: "@tasks", src_ss: 12.0, dur: 3.5, gain_db: -17, fade_ms: 400}]}

  - id: "12"
    part: TODAY
    map: {q: "How has interpreting changed?", act: 3, emo: warmth, color: cold, cue: today, trade: [keyboard-typing, radio-tuning],
          in: cut, out: cut, lamp: {in: false, out: false},
          nouns: [{w: "@interpreting", img: "buồng phiên dịch từ xa: tai nghe, micro, màn hình"}, {w: "@remotely", img: "người phiên dịch (lưng) đeo tai nghe trước màn hình"}, {w: "@sign", img: "màn hình gọi video: người ra dấu"},
                  {w: "@courtrooms", img: "phòng xử 1945: dãy buồng kính"}]}
    vo: >-
      That is translation, the written word. Interpreting, the spoken and signed word, has changed in its own way. Interpreters now work remotely as well as in person.
      Demand for American Sign Language interpreters is expected to grow, as more people use video relay services: online video calls with a sign language interpreter on the line.
      And in courtrooms, where this story began, most states now require interpreters to be certified.
