shorts:
  - id: S1
    hook: "The trial that changed interpreting"
    vo: >-
      In October 1945, Leon Dostert, who had been General Eisenhower's interpreter during the war, was asked to set up the interpretation for the war crimes tribunal at Nuremberg.
      He chose a method many thought would not work: simultaneous interpretation, speaking while the speaker is still speaking. IBM donated the equipment.
    shots:
      - {tpl: plate, at: 0, p: {hero: s_booth, frame0: 0, fx: 0.5, cap: [{s: "October 1945 · Nuremberg", at: "@october", src: [HUT06]}, {s: "Leon Dostert, Eisenhower's interpreter", at: "@dostert", src: [HUT06]},
           {s: "a method many thought would not work", at: "@method"}, {s: "simultaneous interpretation", at: "@simultaneous"}, {s: "IBM donated the equipment", at: "@ibm", src: [HUT06]}]},
         sfx: [{file: assets/ll/sfx/radio-tuning.mp3, at: 0.3, src_ss: 0.5, dur: 3.0, gain_db: -16, fade_ms: 500}]}
  - id: S2
    hook: "1954: a machine that translated 250 words"
    vo: >-
      So Dostert, who had used machines to help interpreters, turned to a machine that would translate by itself.
      On January 7, 1954, his Georgetown team and IBM showed it in New York. The computer knew only two hundred fifty words and six rules of grammar, enough for those chosen sentences.
      The next morning it was on front pages, and the forecasts said a machine built just for translation could be ready within a few years.
    shots:
      - {tpl: plate, at: 0, p: {hero: s_ibm, frame0: 0, fx: 0.5, cap: [{s: "Dostert: a machine to translate", at: "@dostert", src: [HUT06]}, {s: "New York, January 7, 1954", at: "@january", src: [HUT06]}, {num: w250, s: "six rules of grammar", at: "@hundred"},
           {s: "front pages", at: "@front"}, {s: "the forecast: a few years", at: "@forecasts", src: [HUT06]}]},
         sfx: [{file: assets/ll/sfx/card-punch.mp3, at: 0.3, src_ss: 10.0, dur: 10.0, gain_db: -17, fade_ms: 900}]}
  - id: S3
    hook: "A 1966 word for translators is back"
    vo: >-
      The other, machine translation software, writes a first draft, which the translator then reviews. The handbook calls this post-editing: the same word the committee used in 1966 for people correcting the machine.
      Then, it was slower than translating from scratch. Now it is part of the job.
    shots:
      - {tpl: plate, at: 0, p: {hero: s_studio, frame0: 0, fx: 0.5, cap: [{s: "machine translation: a first draft", at: "@software", src: [OOHIT]}, {s: "the translator reviews: post-editing", at: "@reviews", src: [OOHIT]},
           {s: "the same word as 1966", at: "@same", src: [ALPAC]}, {s: "then: slower · now: part of the job", at: "@now"}]},
         sfx: [{file: assets/ll/sfx/computer-home.mp3, at: 0.3, src_ss: 40.0, dur: 10.0, gain_db: -17, fade_ms: 900}]}
