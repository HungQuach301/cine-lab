  - id: "13"
    part: TODAY
    map: {q: "What do the forecasts say for the next ten years?", act: 3, emo: measured, color: cold, cue: today, trade: [computer-home, keyboard-typing],
          in: cut, out: cut, lamp: {in: false, out: true},
          nouns: [{w: "@government", img: "isotype việc làm 2025 và 2035"}, {w: "@two", img: "buồng phiên dịch từ xa; +2.0% trên dải chú thích", anchor: it_chg}, {w: "@positions", img: "buồng phiên dịch: người làm việc"}, {w: "@computers", img: "màn hình: bản nháp máy đang được duyệt"}]}
    pause: [{before: "@two", s: 0.7}]
    vo: >-
      And the next ten years? The government projects that interpreters and translators will grow from about seventy-four thousand jobs in 2025 to about seventy-five thousand in 2035.
      That is two percent over the whole decade, about fifteen hundred more jobs, slower than the three and a half percent projected for all jobs. Slower growth, not decline.
      Even so, about six thousand positions are projected to open each year, mostly to replace people who retire or change careers.
      Computer tools, including AI, are making the work more efficient, the handbook says. But many of these jobs cannot be entirely automated, because computers cannot yet produce work comparable to what human translators do in most cases. Cannot yet.
    shots:
      - {tpl: plate, at: 0, p: {hero: vrs_side, frame0: 0, cap: [{s: "the next ten years?", at: "@next", src: []}]},
         sfx: [{file: assets/ll/sfx/keyboard-typing.mp3, at: 0.3, src_ss: 5.0, dur: 2.5, gain_db: -20, fade_ms: 400}]}
      - {tpl: isotype, at: "@projects-0.8", in: fade, p: {title: "Interpreters and translators, United States", subtitle: "jobs, 2025 and projected 2035 · BLS", unit: 2500, unitName: "jobs", per: 31,
           groups: [{label: "2025", num: it25, at: "@seventyfour"}, {label: "2035 (projected)", num: it35, at: "@seventyfive"}], cap: [{s: "interpreters and translators", at: "@interpreters"}]}}
      - {tpl: plate, at: "@two-0.9", in: fade, p: {hero: vrs_screen, frame0: 120, cap: [{num: it_chg, s: "interpreters and translators, projected 2025–35", at: "@two"}, {s: "about 1,500 more jobs over the decade", at: "@fifteen", src: [OOHIT]},
           {num: all_chg, s: "all jobs, projected 2025–35", at: "@half"}, {s: "slower growth, not decline", at: "@slower#2"}, {num: open, s: "openings projected each year", at: "@six"}, {s: "mostly to replace people who retire or change careers", at: "@replace", src: [OOHIT]}]},
         sfx: [{file: assets/ll/sfx/keyboard-typing.mp3, at: "@two-0.5", src_ss: 9.0, dur: 2.5, gain_db: -20, fade_ms: 400}, {file: assets/ll/sfx/mouse-clicks.mp3, at: "@even", src_ss: 30.0, dur: 2.5, gain_db: -18, fade_ms: 300}]}
      - {tpl: plate, at: "@computer-0.4", in: fade, p: {hero: st_screen, frame0: 960, cap: [{s: "computer tools, including AI…", at: "@tools", src: [OOHIT]}, {s: "…are making the work more efficient", at: "@efficient", src: [OOHIT]}, {s: "but many of these jobs cannot be entirely automated", at: "@entirely", src: [OOHIT]}, {s: "“…computers cannot yet produce work comparable to what human translators do…”", at: "@comparable", src: [OOHIT]},
           {s: "cannot yet", at: "@yet#2"}]},
         sfx: [{file: assets/ll/sfx/computer-home.mp3, at: "@computer", src_ss: 70.0, dur: 6.0, gain_db: -17, fade_ms: 600}]}

  - id: "14"
    part: TODAY
    map: {q: "So what happened to the people who carry words between languages?", act: 3, emo: resolve, color: cold, cue: today, trade: [radio-tuning, typewriter-1960s, computer-home],
          in: cut, out: jcut, out_note: "bước chân người thắp đèn (đoạn 15) vào trước hình 1,0 s, kéo qua điểm cắt", lamp: {in: true, out: true},
          nouns: [{w: "@comparison", img: "khung đôi: bản in sửa đỏ 1960s | màn hình duyệt bản nháp hôm nay"}, {w: "@patterns", img: "khung đôi có nhãn 1966 · today"}, {w: "@everyday", img: "bàn người dịch hôm nay"},
                  {w: "@waiting", img: "phòng xử 1945: buồng kính"}, {w: "@checking", img: "màn hình duyệt bản nháp"}, {w: "@video", img: "buồng phiên dịch từ xa"}]}
    vo: >-
      Here is the comparison we can make, and it is a comparison of patterns, not of technologies. In both eras, a repetitive part of the work went to a machine, and people moved to the work around it.
      One difference matters. In 1966, the machine was not good enough, and the committee said so. This time, the machine is in everyday use, and the Oxford study finds it has slowed the growth of translator jobs.
      So what happened to the people who carry words between languages? When machine translation finally reached everyday use, the profession did not disappear.
      The work moved: from waiting for a speaker to stop, to speaking at the same time; from writing every sentence, to checking a machine's draft; from the courtroom booth, to the video call.
    shots:
      - {tpl: diptych, at: 0, p: {split: "@both-0.2", left: {hero: pe_mark, i: 420, fx: 0.5}, right: {hero: st_screen, i: 840, fx: 0.55}, labels: ["1966", "today"],
           cap: [{s: "the comparison we can make", at: "@comparison", src: []}, {s: "a comparison of patterns, not of technologies", at: "@patterns"}, {s: "a repetitive part of the work goes to a machine…", at: "@repetitive"}, {s: "…and people move to the work around it", at: "@moved"}]},
         sfx: [{file: assets/ll/sfx/pencil-paper.mp3, at: 0.3, src_ss: 60.0, dur: 4.0, gain_db: -18, fade_ms: 500}, {file: assets/ll/sfx/computer-home.mp3, at: "@both", src_ss: 90.0, dur: 4.0, gain_db: -18, fade_ms: 500}]}
      - {tpl: plate, at: "@one-0.4", in: fade, p: {hero: pe_room, frame0: 420, cap: [{s: "one difference: in 1966, not good enough", at: "@1966", src: [ALPAC]}]},
         sfx: [{file: assets/ll/sfx/typewriter-1960s.mp3, at: "@one", src_ss: 50.0, dur: 4.0, gain_db: -19, fade_ms: 600}]}
      - {tpl: plate, at: "@this-0.4", in: fade, p: {hero: st_side, frame0: 240, cap: [{s: "this time: the machine in everyday use", at: "@this", src: [FLP]}, {s: "the Oxford study…", at: "@oxford", src: [FLP]}, {s: "…slower growth in translator jobs", at: "@slowed", src: [FLP]}]},
         sfx: [{file: assets/ll/sfx/computer-home.mp3, at: "@this", src_ss: 100.0, dur: 5.0, gain_db: -18, fade_ms: 600}]}
      - {tpl: plate, at: "@so#2-0.4", in: fade, p: {hero: vrs_room, frame0: 300, cap: [{s: "so what happened to the people?", at: "@so#2", src: []}, {s: "machine translation reached everyday use…", at: "@finally", src: [FLP]}, {s: "…and the profession did not disappear", at: "@disappear", src: [OOHIT]}]},
         sfx: [{file: assets/ll/sfx/keyboard-typing.mp3, at: "@so#2", src_ss: 6.0, dur: 2.5, gain_db: -19, fade_ms: 300}]}
      - {tpl: plate, at: "@waiting-0.3", in: fade, p: {hero: booth_in, frame0: 260, cap: [{s: "from waiting for a speaker to stop, to speaking at the same time", at: "@waiting"}]},
         sfx: [{file: assets/ll/sfx/radio-tuning.mp3, at: "@waiting", src_ss: 3.0, dur: 2.5, gain_db: -18, fade_ms: 300}]}
      - {tpl: plate, at: "@writing-0.3", in: fade, p: {hero: st_screen, frame0: 1080, cap: [{s: "from writing every sentence, to checking a machine's draft", at: "@writing"}]},
         sfx: [{file: assets/ll/sfx/keyboard-typing.mp3, at: "@writing", src_ss: 14.0, dur: 3.0, gain_db: -18, fade_ms: 300}]}
      - {tpl: plate, at: "@courtroom-0.3", in: fade, p: {hero: st_side, frame0: 480, cap: [{s: "from the courtroom booth, to the video call", at: "@courtroom"}]},
