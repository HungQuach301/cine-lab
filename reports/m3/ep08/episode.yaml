         sfx: [{file: assets/ll/sfx/radio-tuning.mp3, at: 0.5, src_ss: 4.5, dur: 2.5, gain_db: -19, fade_ms: 400}]}
      - {tpl: plate, at: "@equipment-0.4", in: fade, p: {hero: booth_bench, frame0: 96, cap: [{s: "the equipment did not replace the interpreters", at: "@replace"}]},
