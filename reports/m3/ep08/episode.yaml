segments:
  # ===== HỒI 1 · MỞ (ấm) =====
  - id: "00"
    part: STORY
    map: {q: "When machines learned to translate, what happened to the people who do it?", act: 1, emo: curiosity, color: warm, cue: theme, trade: [card-punch, typewriter-1960s, computer-home],
          in: cut, out: jcut, out_note: "G2 T01: câu hỏi nói xong, hoà 1 s sang phố thư viện; bước chân phố vào trước hình 0,8 s, kéo qua điểm nối sang 01 (cùng cảnh đinh lib_light, khung liền)", lamp: {in: true, out: false},
          nouns: [{w: "@computer", img: "máy in dòng nhả câu tiếng Anh, phòng máy 1954"}, {w: "@russian", img: "giấy in câu dịch từ tiếng Nga"}, {w: "@machines", img: "phòng máy IBM: tủ máy, thẻ đục lỗ"}, {w: "@people", img: "người dịch (bóng) bên màn hình bản nháp máy"}]}
    vo: >-
      In 1954, a computer in New York translated more than sixty Russian sentences. The forecasts said that within a few years, machines would translate almost anything.
      But it took far longer. When the machines finally arrived, what happened to the people who carry words between languages?
    vo_offset: 0.6
    tail: 1.2
    fadeIn: 0
    shots:
      - {tpl: plate, at: 0, p: {hero: ibm_print, frame0: 24, cap: [{s: "New York, 1954: a computer translates Russian sentences", at: "@computer", src: [HUT06]}]},
         sfx: [{file: assets/ll/sfx/card-punch.mp3, at: 0.4, src_ss: 4.0, dur: 4.5, gain_db: -18, fade_ms: 700}]}
      - {tpl: plate, at: "@forecasts-0.3", in: fade, p: {hero: ibm_room, frame0: 96, cap: [{s: "the forecast: within a few years", at: "@forecasts", src: [HUT06]}]},
         sfx: [{file: assets/ll/sfx/card-punch.mp3, at: "@forecasts", src_ss: 20.0, dur: 3.5, gain_db: -16, fade_ms: 500}]}
      - {tpl: plate, at: "@but-0.3", in: fade, p: {hero: lib_hook, frame0: 0, title: "FROM HEADPHONES TO MACHINE DRAFTS", subtitle: "How translators' work changed · Last Lamplighters · Episode 8", titleAt: "@but", titleOut: "@when-0.4"},
         sfx: [{file: assets/ll/sfx/library-room.mp3, at: "@but-0.3", src_ss: 140.0, dur: 4.0, gain_db: -19, fade_ms: 800}]}
      - {tpl: plate, at: "@when-0.3", in: fade, p: {hero: st_screen, frame0: 48, cap: [{s: "what happened to the people who carry words between languages?", at: "@what", src: []}]},
         sfx: [{file: assets/ll/sfx/computer-home.mp3, at: "@when", src_ss: 10.0, dur: 4.0, gain_db: -17, fade_ms: 500}]}
      - {tpl: plate, at: "@languages+1.1", in: {type: fade, d: 1.0}, p: {hero: lib_light, frame0: 0},
         sfx: [{file: assets/ll/sfx/footsteps-steps.mp3, at: "@languages+0.3", src_ss: 0.5, dur: 10.2, gain_db: -13, fade_ms: 600}]}

  - id: "01"
    part: STORY
    map: {q: "Who is working behind the lit window?", act: 1, emo: wonder, color: warm, cue: theme, trade: [footsteps-steps, gas-hiss, library-room],
          in: jcut, out: jcut, out_note: "không khí phòng đọc (đoạn 02) vào trước hình 0,6 s, kéo qua điểm cắt", lamp: {in: true, out: true},
          nouns: [{w: "@lamplighter", img: "người thắp đèn đi dọc phố trước thư viện"}, {w: "@library", img: "mặt tiền thư viện đá, dải cửa sổ sáng"}, {w: "@volunteers", img: "phòng đọc: bàn dài, đèn chao xanh, người dịch (bóng) bên thư"},
                  {w: "@flame", img: "ngọn lửa mồi đầu sào chạm đèn khí"}, {w: "@lamp", img: "đèn đọc sách sau ô kính bừng"}]}
    vo: >-
      At dusk, the lamplighter passes a library. Inside, volunteers bend over messages written in Dutch, Polish, German, and French, translating each one.
      The lamplighter raises the flame to the post by the window, and inside, a reading lamp comes on. Lamplighting is a job machines took over long ago.
      Tonight, its flame opens the story of a job machines were once expected to take over quickly.
    vo_offset: 3.0
    min_dur: 34
    tail: 1.4
    shots:
      - {tpl: plate, at: 0, p: {hero: lib_light, frame0: 27, ev: [{at: 1.4, what: "người thắp đèn vào khung"}, {at: 4.9, what: "đi ngang dải cửa sổ"}]}}   # G2 T01: nối tiếp khung lib_light cuối đoạn 00; bước chân phố bắt đầu ở đoạn 00 (J-cut)
      - {tpl: plate, at: "@inside-0.3", in: fade, p: {hero: lib_read, frame0: 0, cap: [{s: "Dutch · Polish · German · French", at: "@dutch", src: []}]},
         sfx: [{file: assets/ll/sfx/library-room.mp3, at: "@inside-0.6", src_ss: 30.0, dur: 7.0, gain_db: -15, fade_ms: 700}]}
      - {tpl: plate, at: "@raises-0.4", in: fade, p: {hero: lib_light, frame0: 158, ev: [{at: "@raises+1.0", what: "đèn khí bén"}, {at: "@reading", what: "đèn đọc sách sau kính bừng"}],
           cap: [{s: "lamplighting: a job machines took over long ago", at: "@lamplighting", src: []}, {s: "tonight: the story of another job…", at: "@tonight"}, {s: "…one machines were expected to take over quickly", at: "@expected"}]},
         sfx: [{file: assets/ll/sfx/gas-hiss.mp3, at: "@raises+1.0", src_ss: 2.0, dur: 1.8, gain_db: -8, fade_ms: 200}, {file: assets/ll/sfx/library-room.mp3, at: "@reading", src_ss: 60.0, dur: 6.0, gain_db: -20, fade_ms: 900}]}

  # ===== HỒI 2 · QUÁ KHỨ + CHUYỂN GIAO (sepia) =====
  - id: "02"
    part: HISTORY
    map: {q: "How did translators and interpreters work before machines?", act: 2, emo: craft, color: sepia, cue: history, trade: [library-room, paper-flip, typewriter-old],
          in: jcut, in_note: "J-cut: không khí phòng đọc vào trước hình 0,6 s; cắt từ đèn đọc sách sau kính (đoạn 01) vào chính phòng đọc đó, đèn chao xanh trong khung", out: cut, lamp: {in: true, out: false},
          nouns: [{w: "@volunteers", img: "phòng đọc 3D: người dịch tình nguyện bên thư"}, {w: "@photograph", img: "ảnh LoC: người dịch tình nguyện ở thư viện Red Cross, 1942"}, {w: "@translators", img: "ảnh LoC: hai người dịch bàn một bức thư"},
                  {w: "@interpreters", img: "ảnh LoC: người đọc to bức thư cho người bên cạnh"}, {w: "@trial", img: "phòng xử 1945: dãy buồng kính"}]}
    vo: >-
      Those volunteers were real. A photograph taken in 1942, at the Red Cross in Washington, shows them at work. Translators worked with writing, one sentence at a time.
      Interpreters worked with speech, and they worked the same way: the speaker stopped, and then the interpreter said it again in another language.
      A few years later, a trial changed how interpreters worked.
    shots:
      - {tpl: plate, at: 0, p: {hero: lib_read, frame0: 240, cap: [{s: "those volunteers were real", at: "@real", src: []}]},
         sfx: [{file: assets/ll/sfx/library-room.mp3, at: -0.6, src_ss: 90.0, dur: 5.0, gain_db: -15, fade_ms: 600}]}
      - {tpl: archive, at: "@photograph-0.6", in: {type: fade, d: 1.4}, p: {img: assets/ll/archive/fsa-8d21281.jpg, rid: LOC-8d21281, focus: [0.5, 0.5], credit: "Red Cross volunteer translators, Washington, D.C., 1942 · Library of Congress",
           cam: [{t: "@photograph-0.6", x: 40, z: 0.02}, {t: "@sentence+1", x: -30, z: 0.12}], cap: [{s: "Red Cross, Washington, 1942", at: "@1942", src: []}, {s: "translators: writing, one sentence at a time", at: "@writing"}]},
         sfx: [{file: assets/ll/sfx/paper-flip.mp3, at: "@writing", src_ss: 0.5, dur: 2.5, gain_db: -16, fade_ms: 300}]}
      - {tpl: archive, at: "@interpreters-0.4", in: fade, p: {img: assets/ll/archive/fsa-8d21282.jpg, rid: LOC-8d21282, focus: [0.55, 0.45], credit: "Red Cross Foreign Inquiry Service, Washington, D.C., 1942 · Library of Congress",
           cam: [{t: "@interpreters-0.4", x: -40, z: 0.04}, {t: "@language+1", x: 30, z: 0.14}], cap: [{s: "interpreters: speech", at: "@speech"}, {s: "the speaker stops, then the interpreter speaks", at: "@stopped"}]},
         sfx: [{file: assets/ll/sfx/library-room.mp3, at: "@interpreters", src_ss: 120.0, dur: 5.0, gain_db: -17, fade_ms: 600}]}
      - {tpl: plate, at: "@few-0.3", in: fade, p: {hero: booth_room, frame0: 0, cap: [{s: "a few years later: a trial", at: "@trial"}]},
         sfx: [{file: assets/ll/sfx/radio-tuning.mp3, at: "@trial", src_ss: 0.5, dur: 2.5, gain_db: -18, fade_ms: 400}]}

  - id: "03"
    part: HISTORY
    map: {q: "How did one trial change interpreting?", act: 2, emo: focus, color: sepia, cue: history, trade: [radio-tuning, paper-flip, typewriter-old],
          in: cut, out: cut, lamp: {in: false, out: true},
          nouns: [{w: "@dostert", img: "phòng xử: dãy buồng kính phiên dịch"}, {w: "@nuremberg", img: "phòng xử toàn cảnh: băng ghế, tai nghe"}, {w: "@simultaneous", img: "trong buồng: người phiên dịch (lưng) bên micro"},
                  {w: "@headphones", img: "tai nghe trên băng ghế, núm chọn kênh"}, {w: "@booths", img: "dãy buồng kính có biển ngôn ngữ"}, {w: "@warning", img: "đèn cảnh báo nhấp nháy trong buồng"}]}
    vo: >-
      In October 1945, Leon Dostert, who had been General Eisenhower's interpreter during the war, was asked to set up the interpretation for the war crimes tribunal at Nuremberg.
      He chose a method many thought would not work: simultaneous interpretation, speaking while the speaker is still speaking. IBM donated the equipment.
      Every participant in the courtroom wore headphones and could choose a language. The interpreters sat in booths, each working into their own language only, with a warning light to ask a speaker to slow down.
    shots:
      - {tpl: plate, at: 0, p: {hero: booth_room, frame0: 72, cap: [{s: "October 1945: Leon Dostert", at: "@dostert", src: [HUT06]}, {s: "General Eisenhower's wartime interpreter", at: "@general", src: [HUT06]}, {s: "asked to set up the interpretation…", at: "@asked", src: [HUT06]}, {s: "…for the war crimes tribunal at Nuremberg", at: "@tribunal", src: [HUT06]}]},
         sfx: [{file: assets/ll/sfx/radio-tuning.mp3, at: 0.4, src_ss: 0.2, dur: 2.2, gain_db: -20, fade_ms: 400}, {file: assets/ll/sfx/paper-flip.mp3, at: "@nuremberg", src_ss: 1.0, dur: 2.5, gain_db: -18, fade_ms: 400}]}
      - {tpl: plate, at: "@method-0.4", in: fade, p: {hero: booth_in, frame0: 0, cap: [{s: "a method many thought would not work", at: "@method", src: [HUT06]}, {s: "simultaneous interpretation", at: "@simultaneous"},
           {s: "IBM donated the equipment", at: "@ibm", src: [HUT06]}]},
         sfx: [{file: assets/ll/sfx/radio-tuning.mp3, at: "@method", src_ss: 2.0, dur: 3.0, gain_db: -17, fade_ms: 400}]}
      - {tpl: plate, at: "@every-0.4", in: fade, p: {hero: booth_bench, frame0: 0, cap: [{s: "headphones for every participant · choose a language", at: "@headphones", src: [BOWEN]}]},
         sfx: [{file: assets/ll/sfx/radio-tuning.mp3, at: "@choose", src_ss: 4.0, dur: 2.8, gain_db: -14, fade_ms: 300}]}
      - {tpl: plate, at: "@booths-0.5", in: fade, p: {hero: booth_in, frame0: 120, cap: [{s: "each interpreter: into their own language only", at: "@own", src: [BOWEN]}, {s: "a warning light: please slow down", at: "@warning", src: [BOWEN]}],
           ev: [{at: "@warning+0.4", what: "đèn cảnh báo nhấp nháy"}]},
         sfx: [{file: assets/ll/sfx/typewriter-old.mp3, at: "@booths", src_ss: 2.0, dur: 3.5, gain_db: -22, fade_ms: 700}]}

  - id: "04"
    part: HISTORY
    map: {q: "Did the new equipment replace the interpreters?", act: 2, emo: clarity, color: sepia, cue: history, trade: [radio-tuning, paper-flip],
          in: cut, out: jcut, out_note: "bước chân người thắp đèn vào trước hình 1,0 s (đoạn 05)", lamp: {in: true, out: false},
          nouns: [{w: "@simultaneous", img: "toàn cảnh phòng xử, dãy buồng kính sáng"}, {w: "@equipment", img: "tai nghe, núm chọn kênh trên băng ghế"}, {w: "@interpreters", img: "người phiên dịch (lưng) trong buồng"},
                  {w: "@nations", img: "dãy buồng kính, biển ngôn ngữ"}, {w: "@georgetown", img: "phòng máy 1954: tủ máy, thẻ đục lỗ"}]}
    vo: >-
      It was the first large-scale use of simultaneous interpretation, and historians count it a success. The new equipment did not replace the interpreters.
      It changed their job, from waiting for the speaker to stop, to speaking at the same time.
      Soon the United Nations installed a similar system, and Dostert went on to Georgetown University in Washington, to train linguists for government service.
