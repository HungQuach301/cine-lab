  - id: "05"
    part: HISTORY
    map: {q: "Could a machine translate on its own?", act: 2, emo: hope, color: sepia, cue: history, trade: [footsteps-steps, card-punch, teleprinter-tape],
          in: jcut, in_note: "bước chân người thắp đèn từ cuối đoạn 04 kéo qua điểm cắt", out: cut, lamp: {in: true, out: false},
          nouns: [{w: "@lamplighter", img: "người thắp đèn đi qua thư viện, đèn khí sáng"}, {w: "@soviet", img: "phòng máy 1954"}, {w: "@machine", img: "tủ máy, băng từ quay, thẻ đục lỗ"},
                  {w: "@hundred", img: "máy in dòng; 250 words trên dải chú thích", anchor: w250}, {w: "@pages", img: "máy in dòng nhả câu tiếng Anh"}]}
    pause: [{before: "@two", s: 0.7}]
    # 09/10 (chủ dự án, G1 v2): Quá khứ + Chuyển giao đo thật 45,4 % > 45 % → rút câu "Machines had long since taken over lamplighting; now they were turned on language."
    vo: >-
      The lamplighter walks on.
      After the war, American officials worried about how little they knew of Soviet work, written in Russian.
      So Dostert, who had used machines to help interpreters, turned to a machine that would translate by itself.
      On January 7, 1954, his Georgetown team and IBM showed it in New York. The computer knew only two hundred fifty words and six rules of grammar, enough for those chosen sentences.
      The next morning it was on front pages, and the forecasts said a machine built just for translation could be ready within a few years.
    shots:
      - {tpl: plate, at: 0, p: {hero: lib_walk, frame0: 0, ev: [{at: 1.0, what: "người thắp đèn bước vào khung"}, {at: 6.0, what: "đi ngang thư viện"}]},
         sfx: [{file: assets/ll/sfx/footsteps-steps.mp3, at: -1.0, src_ss: 3.0, dur: 7.5, gain_db: -13, fade_ms: 500}]}
      - {tpl: plate, at: "@after-0.4", in: fade, p: {hero: ibm_room, frame0: 0, cap: [{s: "after the war: Soviet work, written in Russian", at: "@soviet", src: [HUT06]}, {s: "Dostert: from helping interpreters…", at: "@used", src: [HUT06]}, {s: "…to a machine that would translate by itself", at: "@itself", src: [HUT06]}]},
         sfx: [{file: assets/ll/sfx/card-punch.mp3, at: "@after", src_ss: 30.0, dur: 6.0, gain_db: -17, fade_ms: 600}]}
      - {tpl: plate, at: "@january-0.4", in: fade, p: {hero: ibm_print, frame0: 0, cap: [{s: "January 7, 1954 · New York", at: "@january", src: [HUT06]}, {s: "Dostert's Georgetown team and IBM", at: "@georgetown", src: [HUT06]}, {s: "the computer knew only…", at: "@knew", src: [HUT06]}, {num: w250, s: "and six rules of grammar", at: "@hundred"}],
           ev: [{at: "@computer+0.5", what: "máy in bắt đầu nhả chữ"}]},
         sfx: [{file: assets/ll/sfx/teleprinter-tape.mp3, at: "@january", src_ss: 40.0, dur: 5.0, gain_db: -17, fade_ms: 500}]}
      - {tpl: plate, at: "@next-0.4", in: fade, p: {hero: ibm_room, frame0: 240, cap: [{s: "front pages the next morning", at: "@front", src: [HUT06]}, {s: "the forecast: a machine built just for translation…", at: "@forecasts", src: [HUT06]}, {s: "…ready within a few years", at: "@ready", src: [HUT06]}]},
         sfx: [{file: assets/ll/sfx/card-punch.mp3, at: "@next", src_ss: 60.0, dur: 5.0, gain_db: -17, fade_ms: 600}]}

  - id: "06"
    part: HISTORY
    map: {q: "Twelve years later, what had the money bought?", act: 2, emo: scrutiny, color: sepia, cue: history, trade: [typewriter-1960s, wall-clock],
          in: cut, out: cut, lamp: {in: true, out: false},
          nouns: [{w: "@committee", img: "phòng dịch 1960s: bàn gỗ, máy chữ, tạp chí tiếng Nga"}, {w: "@people", img: "phòng dịch có người làm (bóng)"}, {w: "@sixtytwo", img: "isotype 262 người dịch liên bang"},
                  {w: "@translators#2", img: "phòng dịch, người dịch (bóng) bên máy chữ"}, {w: "@money", img: "biển số $20 million"}]}
    vo: >-
      In 1966, twelve years after the demonstration, a committee of the National Academy of Sciences took stock. First, it counted the people.
      In October 1962, the federal government employed only two hundred sixty-two translators and clerk-translators in the United States, and the committee found more translators available than there was work for them.
      There was no shortage of people for a machine to fix. Then it counted the money. Over ten years, the government had spent some twenty million dollars on machine translation and related research.
    shots:
      - {tpl: plate, at: 0, p: {hero: pe_room, frame0: 0, cap: [{s: "1966: twelve years after the demonstration", at: "@1966", src: [ALPAC]}, {s: "a committee of the National Academy of Sciences (ALPAC)", at: "@committee", src: [ALPAC]}, {s: "first, it counted the people", at: "@counted"}]},
         sfx: [{file: assets/ll/sfx/typewriter-1960s.mp3, at: 0.3, src_ss: 5.0, dur: 5.0, gain_db: -18, fade_ms: 600}]}
      - {tpl: isotype, at: "@october-0.6", in: fade, p: {title: "Federal translators and clerk-translators", subtitle: "employed in the United States, October 1962", unit: 10, unitName: "people", per: 27,
           groups: [{label: "Oct 1962", num: fed62, at: "@sixtytwo"}], cap: [{s: "a small field, not a shortage", at: "@available", src: [ALPAC]}]}}
      - {tpl: plate, at: "@shortage-0.4", in: fade, p: {hero: pe_room, frame0: 200, cap: [{s: "more translators available than work", at: "@shortage", src: [ALPAC]}]},
         sfx: [{file: assets/ll/sfx/wall-clock.mp3, at: "@shortage", src_ss: 20.0, dur: 4.0, gain_db: -18, fade_ms: 600}]}
      - {tpl: sign, at: "@money-0.5", in: fade, p: {num: mt20, caption: "U.S. government spending on machine translation, ten years", at: "@twenty", capAt: "@research", wall: plaster,
           cam: [{t: "@money-0.5", x: 0, z: 0.0}, {t: "@research+2", x: -30, z: 0.04}]},
         sfx: [{file: assets/ll/sfx/typewriter-1960s.mp3, at: "@money", src_ss: 20.0, dur: 3.0, gain_db: -20, fade_ms: 500}]}

  - id: "07"
    part: HISTORY
    map: {q: "What did the machine's output look like?", act: 2, emo: doubt, color: sepia, cue: history, trade: [pencil-paper, typewriter-1960s],
          in: cut, out: cut, lamp: {in: false, out: true},
          nouns: [{w: "@georgetown", img: "bản in máy: chữ in hoa, câu lủng củng"}, {w: "@correct", img: "bút đỏ gạch và sửa trên bản in"}, {w: "@postediting", img: "bản in có vết bút đỏ"}, {w: "@conclusion", img: "trích ALPAC 1966"}]}
    vo: >-
      The results were thin. Back in 1962, eight years into the work, the Georgetown project had tried to produce useful output, and it had to have people correct the machine's output.
      The committee called this postediting. The postedited translation took slightly longer, and cost more, than ordinary human translation.
      Its conclusion was blunt: there was no immediate or predictable prospect of useful machine translation.
    shots:
      - {tpl: plate, at: 0, p: {hero: pe_mark, frame0: 0, cap: [{s: "1962: the Georgetown project's output", at: "@georgetown", src: [ALPAC]}, {s: "people had to correct the machine", at: "@correct"}, {s: "the committee's word: postediting", at: "@postediting", src: [ALPAC]},
           {s: "slightly longer, and costlier, than human translation", at: "@slightly", src: [ALPAC]}], ev: [{at: "@correct", what: "bút đỏ bắt đầu sửa"}]},
         sfx: [{file: assets/ll/sfx/pencil-paper.mp3, at: "@correct-0.5", src_ss: 10.0, dur: 4.0, gain_db: -15, fade_ms: 600}, {file: assets/ll/sfx/pencil-paper.mp3, at: "@postediting", src_ss: 30.0, dur: 6.0, gain_db: -15, fade_ms: 600}]}
      - {tpl: quote, at: "@conclusion-0.4", in: flip, p: {beats: [{s: "the conclusion, 1966", at: "@conclusion"}], text: "…there is no immediate or predictable prospect of useful machine translation.", who: "ALPAC", where: "Language and Machines, 1966", at: "@immediate", src: [ALPAC]}}
      - {tpl: plate, at: "@immediate+3.6", in: fade, p: {hero: pe_room, frame0: 320, cap: [{s: "no immediate or predictable prospect", at: "@immediate+3.8", src: [ALPAC]}]},
         sfx: [{file: assets/ll/sfx/typewriter-1960s.mp3, at: "@immediate+3.6", src_ss: 30.0, dur: 3.0, gain_db: -20, fade_ms: 600}]}

  - id: "08"
    part: HISTORY
    map: {q: "Which machine actually helped?", act: 2, emo: insight, color: sepia, cue: history, trade: [typewriter-1960s, paper-flip, footsteps-steps],
          in: cut, out: jcut, out_note: "bước chân người thắp đèn vào trước hình 1,2 s (đoạn 09)", lamp: {in: true, out: true},
          nouns: [{w: "@agency", img: "bảng thuật ngữ in liên tục cạnh máy chữ"}, {w: "@list", img: "bảng thuật ngữ: từ Nga và bản dịch"}, {w: "@errors", img: "máy chữ gõ bản dịch sạch"}, {w: "@aids", img: "người dịch (bóng) bên máy chữ, đèn bàn"}]}
    vo: >-
      But the committee also found a machine that did help. At a military translation agency in Germany, a computer produced a list of the technical terms in each text, with their translations.
      Translators who had the list finished much faster, and made a third fewer errors than translators without it.
      So the committee recommended research into language, and better human translation, with machine aids. A machine to help the translator, not to replace one.
    shots:
      - {tpl: plate, at: 0, p: {hero: pe_gloss, frame0: 0, cap: [{s: "a military translation agency, Germany", at: "@military", src: [ALPAC]}, {s: "a computer made a list…", at: "@list", src: [ALPAC]}, {s: "…of each text's technical terms, with translations", at: "@technical", src: [ALPAC]},
           {s: "translators who had the list…", at: "@had", src: [ALPAC]}, {s: "…much faster · a third fewer errors", at: "@faster", src: [ALPAC]}], ev: [{at: 1.0, what: "máy chữ bắt đầu gõ"}]},
         sfx: [{file: assets/ll/sfx/typewriter-1960s.mp3, at: 0.6, src_ss: 10.0, dur: 9.0, gain_db: -15, fade_ms: 600}, {file: assets/ll/sfx/typewriter-1960s.mp3, at: "@faster", src_ss: 40.0, dur: 6.0, gain_db: -16, fade_ms: 600}]}
      - {tpl: plate, at: "@recommended-0.4", in: fade, p: {hero: pe_room, frame0: 120, cap: [{s: "the recommendation: research into language…", at: "@research", src: [ALPAC]}, {s: "…and machine aids for human translators", at: "@aids", src: [ALPAC]},
           {s: "a machine to help the translator, not to replace one", at: "@help"}]},
         sfx: [{file: assets/ll/sfx/paper-flip.mp3, at: "@recommended", src_ss: 4.0, dur: 2.5, gain_db: -17, fade_ms: 400}, {file: assets/ll/sfx/footsteps-steps.mp3, at: "@replace+0.4", src_ss: 3.0, dur: 3.0, gain_db: -20, fade_ms: 400}]}

  # ===== HỒI 3 · HIỆN TẠI + TƯƠNG LAI (lạnh) =====
  - id: "09"
    part: STORY
    map: {q: "Where is the light now?", act: 3, emo: passage, color: cold, cue: today, trade: [footsteps-steps, computer-home],
          in: jcut, in_note: "bước chân người thắp đèn vào trước hình 1,2 s, kéo qua điểm cắt", out: cut, lamp: {in: true, out: false},
          nouns: [{w: "@lamplighter", img: "người thắp đèn đi qua thư viện"}, {w: "@lamps", img: "cửa sổ thư viện tắt dần"}, {w: "@screen", img: "ô cửa căn hộ: màn hình sáng, người (bóng)"}, {w: "@paragraph", img: "màn hình: đoạn văn hiện ra bằng thứ tiếng khác"}]}
    vo: >-
      The lamplighter walks on, and the years pass: the sixties, the eighties, a new century. The library's lamps go out.
      Across the street, a screen is lit in an apartment. Someone pastes a paragraph into a box, and a moment later it comes back in another language.
