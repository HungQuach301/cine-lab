           cap: [{s: "the sixties · the eighties · a new century", at: "@sixties", src: []}, {s: "across the street…", at: "@across"}, {s: "…a screen, lit in an apartment", at: "@screen"}]},
         sfx: [{file: assets/ll/sfx/footsteps-steps.mp3, at: -1.2, src_ss: 3.0, dur: 7.0, gain_db: -13, fade_ms: 500}, {file: assets/ll/sfx/computer-home.mp3, at: "@screen", src_ss: 20.0, dur: 5.0, gain_db: -20, fade_ms: 600}]}
