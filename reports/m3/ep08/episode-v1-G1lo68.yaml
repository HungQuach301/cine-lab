  # 00 — móc câu (Q14): máy có dịch được không? Trả lời ở đoạn 11 (machine, translate, person).
  - id: "00"
    part: STORY
    vo: >-
      Can a machine translate? In 1966, a government committee said no: not usefully, and not soon.
      Today, one study estimates about twenty-eight thousand American translator jobs that were never created.
    vo_offset: 0.6
    tail: 0.6
    fadeIn: 0
    shots:
