shorts:
  - id: S1
    hook: "1966: 'no immediate or predictable prospect'"
    vo: >-
      In 1966, a committee of the National Academy of Sciences judged machine translation. After ten years and some twenty million dollars of government spending, its verdict was blunt: there is no immediate or predictable prospect of useful machine translation. Today, machine translation is in everyday use.
    shots:
      - {tpl: desk, at: 0, p: {eras: [{era: 1962, at: 0, label: " "}, {era: 2025, at: "@today-0.3", label: " "}], accent: "#3d6b4f", cam: [{t: 0, x: 0, z: 0.02}, {t: 8, x: -30, z: 0.06}, {t: 16, x: -60, z: 0.1}, {t: 22, x: -80, z: 0.12}],
           cap: [{s: "National Academy of Sciences, 1966", at: "@committee", src: [ALPAC]}, {num: mt20, s: "over ten years", at: "@twenty"}, {s: "no immediate or predictable prospect", at: "@immediate"},
                 {s: "today: in everyday use", at: "@everyday"}]}}
  - id: S2
    hook: "Google Translate and translator jobs"
    vo: >-
      Economists at Oxford compared six hundred ninety-five U.S. labor markets. Where people used Google Translate more, translator employment grew more slowly. They estimate about twenty-eight thousand fewer translator positions were created. It is an estimate, not a count.
    shots:
      - {tpl: sign, at: 0, p: {num: frey, at: "@twentyeight", cam: [{t: 0, x: 0, z: 0.0}, {t: 6, x: -20, z: 0.03}],
           cap: [{s: "Oxford: 695 U.S. labor markets", at: "@oxford", src: [FLP]}, {s: "more Google Translate → slower job growth", at: "@slowly"}, {s: "positions not created", at: "@created"}, {s: "an estimate, not a count", at: "@estimate"}]}}
  - id: S3
    hook: "The BLS on translators and AI"
    vo: >-
      The Bureau of Labor Statistics says interpreters and translators have become more productive as AI translation improves, and that this is reducing demand for them. Its projection: one point seven percent growth from 2024 to 2034, about half the three point one percent for all jobs.
    shots:
      - {tpl: desk, at: 0, p: {eras: [{era: 2025, at: 0, label: " "}], accent: "#3d6b4f", cam: [{t: 0, x: 0, z: 0.02}, {t: 8, x: -30, z: 0.06}, {t: 16, x: -60, z: 0.1}, {t: 22, x: -80, z: 0.12}],
           cap: [{s: "BLS: more productive with AI translation", at: "@productive", src: [MLR26]}, {s: "reducing demand", at: "@reducing"}, {num: it_chg, s: "interpreters & translators, projected 2024–34", at: "@one"},
                 {num: all_chg, s: "all jobs, projected 2024–34", at: "@three"}]}}
