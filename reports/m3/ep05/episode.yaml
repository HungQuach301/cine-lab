segments:
  # 00 — móc câu (Q14): ranh giới phán đoán 1966 ↔ phần mềm định giá từ ảnh; số neo −9 % (2025–35). Trả lời ở đoạn 11 (people, judgment).
  - id: "00"
    part: STORY
    vo: >-
      Who decides what a damaged car is worth? In 1966, government economists said judgment could not be computerized.
      Today, software can draft the estimate for a wreck from a photo, and auto damage appraisers are projected to shrink nine percent.
    vo_offset: 0.6
    tail: 0.6
    fadeIn: 0
    shots:
      - {tpl: inspect, at: 0, p: {era: 2025, walk: [0.5, 6], flash: ["@photo", "@photo+0.6"], estimate: "@draft+0.6", cam: [{t: 0, x: 0, z: 0.02}, {t: 4, x: -30, z: 0.05}, {t: 8, x: -60, z: 0.08}, {t: 12, x: -80, z: 0.1}, {t: 18, x: -100, z: 0.12}],
           cap: [{s: "Who decides what a damaged car is worth?", at: "@who"}, {s: "1966: judgment cannot be computerized (BLS)", at: "@1966"},
                 {s: "today: software drafts the estimate from a photo", at: "@today"}, {num: ap_chg, s: "auto damage appraisers, projected 2025–35", at: "@nine"}]}}

  - id: "01"
    part: STORY
    vo: >-
      At dusk, the lamplighter works down a street of offices. In one building, an insurance company keeps its lights on late.
      Each file on every desk is a claim, and each claim is a question: what happened, and what is it worth?
    vo_offset: 3.4
    min_dur: 27
    tail: 1.2
    shots:
      - {tpl: text, at: 0, p: {lamp: true, lines: [{s: "THE CLAIMS DESK", px: 84}, {s: "Last Lamplighters · Episode 5", px: 34, serif: false}]}}
      - {tpl: street, at: 3.0, in: fade, p: {lamps: [{x: 260}, {x: 860, lit: "@works+0.8"}, {x: 1460}, {x: 2060}], lighter: {from: 500, to: 820, walk: [3.2, "@works+0.5"], lights: [1]}, warm: 0.6, windows: 0.9,
                                 cam: [{t: 3, x: 0, z: 0}, {t: 7, x: -100, z: 0.02}, {t: "@building", x: -260, z: 0.06}]}}
      - {tpl: desk, at: "@each-0.4", in: fade, p: {eras: [{era: 1963, at: "@each-0.4", label: " "}], accent: "#b6462c", cam: [{t: "@each", x: 60, z: 0.0}, {t: "@question", x: 20, z: 0.04}, {t: "@worth+1.2", x: -20, z: 0.08}, {t: "@worth+5", x: -50, z: 0.11}],
           cap: [{s: "each file is a claim", at: "@each"}, {s: "what happened, and what is it worth?", at: "@question"}]}}

  - id: "02"
    part: HISTORY
    vo: >-
      Behind every claim, there used to be a small army of clerks. In the 1950s, insurance was paperwork on an enormous scale: premiums to bill, policies to update, claims to record and pay.
      In 1964, U.S. insurance carriers employed about eight hundred eighty-five thousand people, and most of them did office work.
      Then a new machine arrived at head office: the electronic computer.
    min_dur: 26
    shots:
      - {tpl: archive, at: 0, p: {img: assets/ll/archive/fsa-8d27894.jpg, rid: LOC-8d27894, focus: [0.5, 0.42], credit: "Insurance office, Baltimore, 1943 · Library of Congress",
           cam: [{t: 0, x: 40, z: 0.0}, {t: 6, x: 10, z: 0.04}, {t: 12, x: -20, z: 0.08}, {t: 18, x: -40, z: 0.11}, {t: 26, x: -60, z: 0.14}],
           cap: [{s: "Behind every claim: a small army of clerks", at: "@army"}, {s: "premiums to bill · policies to update · claims to pay", at: "@premiums"},
                 {num: ins64, s: "employees of U.S. insurance carriers, 1964 — most in office work", at: "@eight"}, {s: "then: the electronic computer", at: "@electronic"}]}}

  - id: "03"
    part: HISTORY
    vo: >-
      In 1966, the Bureau of Labor Statistics published a study of what the computer was doing to insurance offices.
      Employment in company computer units soared, from about six hundred people in 1954 to about sixteen thousand by 1963.
      And the routine work began to move. Routine clerical record keeping declined in two-thirds of the companies surveyed.
      Jobs like premium billing, tasks which formerly required large numbers of clerks handling files, went to the machine.
      So did the policy evaluation clerks, who calculated the cash values of policies using rate books and manual calculators.
    shots:
      - {tpl: archive, at: 0, p: {img: assets/ll/archive/usnwr-89395.jpg, rid: LOC-89395, focus: [0.5, 0.55], credit: "IBM computer room, New Haven, 1967 · Library of Congress",
           cam: [{t: 0, x: 0, z: 0.0}, {t: 5, x: -40, z: 0.06}], cap: [{s: "BLS study, 1966: what the computer did to insurance offices", at: "@1966"}]}}
      - {tpl: isotype, at: "@six-1.0", in: fade, p: {title: "People working in insurance computer units", subtitle: "U.S. insurance carriers", unit: 1000, unitName: "people", per: 16,
           groups: [{label: "1954", num: edp54, at: "@six"}, {label: "1963", num: edp63, at: "@sixteen"}], cap: [{s: "company computer units soared", at: "@soared"}]}}
      - {tpl: desk, at: "@routine-0.4", in: fade, p: {eras: [{era: 1963, at: "@routine-0.4", label: "1963"}], accent: "#b6462c", cam: [{t: "@routine", x: 0, z: 0.02}, {t: "@premium", x: -40, z: 0.06}, {t: "@rate", x: -80, z: 0.1}],
           cap: [{num: rec, s: "of surveyed companies: routine record keeping declined (1963)", at: "@twothirds"}, {s: "premium billing went to the machine", at: "@premium"}, {s: "tasks once done by large numbers of clerks", at: "@clerks"}, {s: "policy evaluation clerks, too", at: "@policy"},
                 {s: "policy evaluation clerks: rate books and manual calculators", at: "@rate"}]}}

  - id: "04"
    part: HISTORY
    vo: >-
      What about the claims desk itself? The computer reached it too: companies used it to keep reserves for unpaid claims and then to process the claims.
      But the BLS noticed something. On claims, the computer was intended to improve the company's loss record, rather than to save clerical man-hours.
      Field offices could send an approved claim amount to head office by wire, and a machine printed the check.
      The judgment, deciding what a claim was worth, stayed with people.
    shots:
      - {tpl: desk, at: 0, p: {eras: [{era: 1963, at: 0, label: "1963"}], accent: "#b6462c", cam: [{t: 0, x: -40, z: 0.06}, {t: 5, x: 0, z: 0.03}, {t: 10, x: 40, z: 0.0}],
           cap: [{s: "What about the claims desk?", at: "@claims"}, {s: "reserves for unpaid claims, then claims processing", at: "@reserves"}]}}
      - {tpl: quote, at: "@noticed-0.4", in: slide, p: {beats: [{s: "what the BLS noticed", at: "@noticed"}], text: "…intended to improve the company's loss record rather than to save clerical man-hours.", who: "U.S. Bureau of Labor Statistics", where: "Bulletin 1468, 1966", at: "@intended", src: [B1468]}}
      - {tpl: desk, at: "@field-0.4", in: fade, p: {eras: [{era: 1963, at: "@field-0.4", label: "1963"}], accent: "#b6462c", cam: [{t: "@field", x: 0, z: 0.02}, {t: "@printed", x: -50, z: 0.06}, {t: "@judgment", x: -90, z: 0.1}],
           cap: [{s: "field office → approved amount by wire", at: "@field"}, {s: "a machine prints the check", at: "@printed"}, {s: "the judgment stays with people", at: "@judgment"}]}}

  - id: "05"
    part: HISTORY
    vo: >-
      And office jobs did not collapse. In two hundred seven companies surveyed, office employment reached about three hundred sixty-six thousand by January 1963,
      up thirty-one point five percent over nine years, though it grew more slowly than before.
      Few people were laid off as a direct result. The BLS pointed to high turnover among young clerical workers, a growing industry, and some new computer jobs.
      And it drew a line: jobs requiring some judgment and decision making, jobs that cannot be computerized, would remain.
    shots:
      - {tpl: archive, at: 0, p: {img: assets/ll/archive/fsa-8c01946.jpg, rid: LOC-8c01946, focus: [0.5, 0.42], credit: "Insurance office, Dayton, Wash., 1941 · Library of Congress",
           cam: [{t: 0, x: 0, z: 0.02}, {t: 5, x: -30, z: 0.07}], cap: [{s: "Office jobs did not collapse", at: "@collapse"}, {s: "207 surveyed companies, 1954–1963", at: "@surveyed"}]}}
      - {tpl: sign, at: "@thirtyone-1.2", in: fade, p: {num: off_chg, caption: "office employment, 207 surveyed insurers, 1954–63 (nine years)", at: "@thirtyone", capAt: "@nine", wall: plaster,
           cam: [{t: "@thirtyone-1.2", x: 0, z: 0.0}, {t: "@nine", x: -30, z: 0.03}]}}
      - {tpl: desk, at: "@few-0.4", in: fade, p: {eras: [{era: 1963, at: "@few-0.4", label: "1963"}], accent: "#b6462c", cam: [{t: "@few", x: 30, z: 0.04}, {t: "@turnover", x: 0, z: 0.07}, {t: "@line", x: -30, z: 0.1}],
           cap: [{s: "few laid off as a direct result", at: "@few"}, {s: "turnover · a growing industry · new computer jobs", at: "@turnover"}]}}
      - {tpl: quote, at: "@line-0.4", in: flip, p: {beats: [{s: "the BLS drew a line", at: "@line"}], text: "…jobs requiring some judgment and decision making—jobs that cannot be computerized…", who: "U.S. Bureau of Labor Statistics", where: "Bulletin 1468, 1966", at: "@requiring", src: [B1468]}}

  - id: "05b"
    part: HISTORY
    vo: >-
      By the late 1980s, the computer had reached the adjuster's desk too. The government's 1990 handbook of occupations described claim representatives
      who kept records of clients and claims on computer terminals, and a growing number who carried portable lap-top computers on assignment.
      Material damage adjusters, it said, inspect automobile damage and use the latest computerized estimating equipment to prepare estimates of the damage.
      The machine now did the arithmetic of a repair. But a person still walked around the car, looked at the dent, and decided what it was worth.
    shots:
      - {tpl: desk, at: 0, p: {eras: [{era: 1988, at: 0, label: "1988"}], accent: "#b6462c", cam: [{t: 0, x: 0, z: 0.0}, {t: 6, x: -40, z: 0.04}, {t: 12, x: -80, z: 0.08}],
           cap: [{s: "Late 1980s: the computer reaches the adjuster", at: "@late"}, {s: "BLS Occupational Outlook Handbook, 1990–91", at: "@handbook"},
                 {s: "terminals on the desk", at: "@terminals"}, {s: "portable computers in the field", at: "@portable"}]}}
      - {tpl: quote, at: "@material-0.4", in: slide, p: {beats: [{s: "material damage adjusters", at: "@material"}, {s: "computerized estimating equipment", at: "@computerized"}], text: "Material damage adjusters inspect automobile damage and use the latest computerized estimating equipment to prepare estimates of the damage.", who: "U.S. Bureau of Labor Statistics", where: "Occupational Outlook Handbook, 1990–91", at: "@inspect", src: [OOH90]}}
      - {tpl: inspect, at: "@machine-0.4", in: fade, p: {era: 1988, walk: ["@machine", "@walked+1"], flash: ["@looked", "@looked+0.8"], cam: [{t: "@machine", x: -40, z: 0.03}, {t: "@person", x: -80, z: 0.05}, {t: "@worth+1", x: -120, z: 0.07}],
           cap: [{s: "the machine: the arithmetic of a repair", at: "@arithmetic"}, {s: "a person: what it was worth", at: "@person"}]}}

  - id: "06"
    part: STORY
    vo: >-
      The lamplighter walks on. Up in the insurance building, the clerks' floors went quiet long ago. One office is still lit:
      someone looks at a photo of a dented car on a screen. For decades, a person still had to look at the car.
    vo_offset: 2.5
    min_dur: 29
    tail: 1.5
    shots:
      - {tpl: street, at: 0, p: {lamps: [{x: 260}, {x: 860}, {x: 1460}, {x: 2060}], lighter: {from: 300, to: 1300, walk: [0.5, "@lit+1"]}, warm: 0.4, windows: 0.3,
                                 cam: [{t: 0, x: 0, z: 0}, {t: 4, x: -100, z: 0.02}, {t: "@lit+1", x: -300, z: 0.05}]}}
      - {tpl: desk, at: "@someone-0.4", in: fade, p: {eras: [{era: 2025, at: "@someone-0.4", label: " "}], accent: "#b6462c", cam: [{t: "@someone", x: 0, z: 0}, {t: "@decades", x: -40, z: 0.04}, {t: "@car#2+1.5", x: -80, z: 0.08}, {t: "@car#2+5", x: -110, z: 0.1}]}}

  - id: "07"
    part: TODAY
    vo: >-
      That part is now changing. Claims adjusters, examiners, and investigators decide what a claim is worth. In 2025, there were about three hundred seventy-six thousand of them.
      The BLS projects about three hundred fifty-five thousand by 2035, a decline of five percent, while all jobs together grow three point five percent.
      Its reason is plain: computer software can evaluate photographs of damaged property and calculate an estimated claim amount.
    shots:
      - {tpl: desk, at: 0, p: {eras: [{era: 2025, at: 0, label: "2025"}], accent: "#b6462c", cam: [{t: 0, x: 0, z: 0.05}, {t: 6, x: -40, z: 0.08}],
           cap: [{s: "That part is now changing", at: "@changing"}, {s: "claims adjusters decide what a claim is worth", at: "@decide"}]}}
      - {tpl: isotype, at: "@seventysix-1.0", in: fade, p: {title: "Claims adjusters, examiners & investigators, U.S.", subtitle: "employment, 2025 and projected 2035", unit: 20000, unitName: "workers", per: 20,
           groups: [{label: "2025", num: ca25, at: "@seventysix"}, {label: "2035 (projected)", num: ca35, at: "@fiftyfive"}],
           cap: [{num: ca_chg, s: "projected change, 2025–35", at: "@decline"}, {num: all_chg, s: "all occupations, projected 2025–35", at: "@grow"}]}}
      - {tpl: quote, at: "@reason-0.4", in: slide, p: {beats: [{s: "its reason is plain", at: "@reason"}], text: "…computer software can evaluate photographs of damaged property and calculate an estimated claim amount.", who: "U.S. Bureau of Labor Statistics", where: "Occupational Outlook Handbook", at: "@software", src: [OOHC]}}

  - id: "08"
    part: TODAY
    vo: >-
      For one small job, the change is sharper. Auto damage appraisers look at wrecked cars and estimate repair costs. There were about thirteen thousand five hundred of them in 2025.
      The BLS projects about twelve thousand four hundred by 2035: down nine percent, almost twice the decline for adjusters.
      In its 2025 article on AI, the BLS described the shift: once photographs are taken, the analysis and initial payout estimates, traditionally prepared by an adjuster, can be autogenerated by AI.
    shots:
      - {tpl: inspect, at: 0, p: {era: 2025, walk: [0.5, 5], flash: ["@wrecked", "@estimate"], estimate: "@twelve", cam: [{t: 0, x: -20, z: 0.02}, {t: 6, x: -50, z: 0.05}, {t: 12, x: -80, z: 0.08}, {t: 18, x: -100, z: 0.1}],
           cap: [{s: "A small job, a sharper change", at: "@small"}, {s: "auto damage appraisers estimate repair costs", at: "@auto"}, {s: "about 13,500 of them in 2025", at: "@thirteen"}, {s: "the BLS projection, to 2035", at: "@projects"},
                 {num: ap_chg, s: "projected change, 2025–35 — almost twice the adjusters'", at: "@down"}]}}
      - {tpl: quote, at: "@article-0.4", in: slide, p: {beats: [{s: "BLS, Monthly Labor Review, 2025", at: "@article"}, {s: "once photographs are taken", at: "@photographs"}, {s: "traditionally prepared by an adjuster", at: "@traditionally"}, {s: "autogenerated by AI", at: "@autogenerated"}], text: "Once photographs are taken, the analysis and initial payout estimates, traditionally prepared by an adjuster, can be autogenerated by AI.", who: "BLS economists", where: "Monthly Labor Review, February 2025", at: "@once", src: [MLR25]}}

  - id: "09"
    part: TODAY
    vo: >-
      How widely is this used? Hard numbers are scarce. The BLS's January 2026 review put it more gently: adjusters can use AI tools to assess photographs of property damage, which improves efficiency in generating payout estimates.
      In a survey by state insurance regulators, released in 2022, eighty-eight percent of one hundred ninety-three auto insurers said they use,
      plan to use, or plan to explore AI and machine learning. Accident image analysis was one of the claims uses. That counts plans as well as practice,
      so it tells us about intent, not about how many claims a machine already prices.
    shots:
      - {tpl: quote, at: 0, p: {beats: [{s: "how widely is AI used?", at: "@widely"}, {s: "hard numbers are scarce", at: "@scarce"}, {s: "BLS, January 2026", at: "@january"}, {s: "a survey by state insurance regulators", at: "@survey"}, {s: "193 auto insurers, 2022", at: "@released"}, {s: "use, plan to use, or plan to explore", at: "@use"}], text: "Claims adjusters, examiners, and investigators can use AI tools to assess photographs of property damage, which improves efficiency in generating payout estimates.", who: "BLS", where: "Monthly Labor Review, January 2026", at: "@gently", src: [MLR26],
}}
      - {tpl: sign, at: "@eightyeight-1.2", in: fade, p: {num: naic, caption: "of 193 U.S. auto insurers use, plan to use, or plan to explore AI/ML (NAIC, 2022)", at: "@eightyeight", capAt: "@plan", wall: brick,
           cam: [{t: "@eightyeight-1.2", x: 0, z: 0.0}, {t: "@plan", x: -30, z: 0.03}]}}
      - {tpl: desk, at: "@accident-0.4", in: fade, p: {eras: [{era: 2025, at: "@accident-0.4", label: "2025"}], accent: "#b6462c", cam: [{t: "@accident", x: 0, z: 0.03}, {t: "@counts", x: -40, z: 0.06}, {t: "@intent", x: -80, z: 0.09}],
           cap: [{s: "accident image analysis: one of the claims uses", at: "@accident"}, {s: "plans as well as practice", at: "@counts"}, {s: "intent, not a count of claims", at: "@intent"}]}}

  - id: "10"
    part: TODAY
    vo: >-
      So here is the comparison, with a caution. Not the same job: the same claims desk.
      We will not set these numbers side by side. One is a survey of office workers over nine years; the other is a forecast for a single occupation.
      What we can compare is the line. In 1966, the BLS drew it at judgment and decision making: the computer kept the records, and people decided what a claim was worth.
      Today, the BLS says software can evaluate photographs of damaged property and calculate an estimated claim amount.
      Not the same technology. The same pattern: a repetitive human task, taken over by an automated system.
      But the differences matter. Back then, the machine kept the records. Now software drafts the first estimate, the step that once needed a person's eye. The final call, so far, still sits with people.
    shots:
      - {tpl: archive, at: 0, p: {img: assets/ll/archive/fsa-8b28380.jpg, rid: LOC-8b28380, focus: [0.45, 0.70], credit: "Automobile accident, U.S. 40, Maryland, 1936 · Library of Congress",
           cam: [{t: 0, x: 0, z: 0.02}, {t: 8, x: -40, z: 0.06}, {t: 16, x: -80, z: 0.1}, {t: 24, x: -110, z: 0.13}],
           cap: [{s: "The comparison, with a caution", at: "@comparison"}, {s: "not the same job — the same claims desk", at: "@job"}, {s: "two jobs, two kinds of number: not side by side", at: "@side"}, {s: "a survey of office workers vs. a forecast for one job", at: "@survey"}, {s: "what we can compare is the line", at: "@compare"},
                 {s: "1966: the line at judgment", at: "@1966"}, {s: "the computer keeps the records; people decide the worth", at: "@records"}]}}
      - {tpl: inspect, at: "@today-0.4", in: fade, p: {era: 2025, walk: ["@today", "@pattern"], flash: ["@photographs"], estimate: "@calculate", cam: [{t: "@today", x: 0, z: 0.0}, {t: "@pattern", x: -50, z: 0.04}, {t: "@drafts", x: -90, z: 0.08}, {t: "@final", x: -110, z: 0.1}],
           cap: [{s: "today: software estimates the claim from photos", at: "@today"}, {s: "not the same technology — the same pattern", at: "@pattern"}, {s: "but the differences matter", at: "@differences"},
                 {s: "then: the records · now: the first estimate", at: "@drafts"}, {s: "the final call, so far: still people", at: "@final"}], src: [B1468, OOHC]}}

  - id: "11"
    part: TODAY
    vo: >-
      In 1966, the BLS drew its line at judgment and decision making. That line held for a long time. It is the line that is now moving.
      What is left for people may be the hard cases: the disputed claim, the unclear photo, the customer who needs someone to explain.
      Whether that is enough work for the people who do this job today is something no projection can settle. That is what we will be watching.
    min_dur: 24
    shots:
      - {tpl: desk, at: 0, p: {eras: [{era: 1963, at: 0, label: "1963"}, {era: 1988, at: "@long", label: "1988"}, {era: 2025, at: "@moving", label: "2025"}], accent: "#b6462c",
