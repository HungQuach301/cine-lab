           cap: [{s: "1966: judgment cannot be computerized", at: "@1966"}, {s: "today: the line is moving", at: "@moving"}, {s: "left for people: the hard cases?", at: "@hard"},
                 {s: "no projection can settle it", at: "@projection"}]}}

  - id: "12"
    part: STORY
    vo: >-
      Back on the street, the lamplighter reaches the last post. The glass opens, the flame takes, and the corner is lit again.
      Every era has its last lamplighters. Some of them sat at the claims desk.
