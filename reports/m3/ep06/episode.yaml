  - id: "05"
    part: HISTORY
    map: {q: "Where did the work go?", act: 2, emo: relief, color: sepia, cue: history, trade: [pencil-paper, keyboard-typing],
          in: cut, out: match, out_note: "cửa sổ sáng của người vẽ (đèn kẹp) → cùng cửa sổ nhìn từ phố đêm; J-cut bước chân người thắp đèn", lamp: {in: false, out: true},
          nouns: [{w: "@moved", img: "khung đôi: khay chữ chì | cửa sổ người vẽ"}, {w: "@designers", img: "bàn vẽ rồi máy tính để bàn"}, {w: "@sixteen", img: "hàng hình người: nghệ sĩ thị giác 1988", anchor: art88}, {w: "@limit", img: "cửa sổ người vẽ dưới đèn"}]}
    vo: >-
      But the work did not vanish. It moved. The economist James Bessen describes how it happened. Designers used to draw a page and send it to typesetters, then mark revisions and send it back.
      With desktop publishing, it became easier for designers to use the software themselves. Designers using computers substituted for typesetters.
      In his words: there are fewer typesetters, but more graphic designers and desktop publishers. And the designers had to learn entirely new skills to use the new technology.
      In 1988, visual artists, a broad group from graphic designers and illustrators to painters and sculptors, held about two hundred sixteen thousand jobs. The BLS expected them to grow faster than average, though for graphic artists, computers would limit that growth.
    tail: 1.2
    shots:
      - {tpl: diptych, at: 0, p: {split: "@moved-0.2", left: {hero: case_close, i: 150, fx: 0.5}, right: {hero: shop_hook, i: 280, fx: 0.5},
           cap: [{s: "the work did not vanish: it moved", at: "@moved"}, {s: "economist James Bessen", at: "@economist", src: [BES16]}]}}
      - {tpl: desk, at: "@designers-0.4", in: fade, p: {eras: [{era: 1960, at: "@designers-0.4", label: "1975"}, {era: 1988, at: "@desktop-0.3", label: "1988"}], accent: "#2f5d7c", frame: {z: 1.25, x: 0.44, y: 0.56},
           cam: [{t: "@designers", x: 30, z: 0.0}, {t: "@substituted+1", x: -50, z: 0.06}],
           cap: [{s: "designer draws → typesetter sets → revisions go back", at: "@revisions"}, {s: "desktop publishing: designers use the software themselves", at: "@desktop"}, {s: "designers using computers substituted for typesetters", at: "@substituted", src: [BES16]}]},
         sfx: [{file: assets/ll/sfx/pencil-paper.mp3, at: "@draw", src_ss: 4.0, dur: 3.5, gain_db: -12, fade_ms: 400}, {file: assets/ll/sfx/keyboard-typing.mp3, at: "@desktop", src_ss: 3.0, dur: 3.0, gain_db: -15, fade_ms: 400}]}
      - {tpl: quote, at: "@words-0.4", in: flip, p: {beats: [{s: "in his words", at: "@words"}, {s: "designers had to learn entirely new skills", at: "@entirely"}], text: "There are fewer typesetters, but more graphic designers and desktop publishers.", who: "James Bessen", where: "How Computer Automation Affects Occupations, 2016", at: "@fewer", src: [BES16]}}
      - {tpl: isotype, at: "@visual-1.0", in: fade, p: {title: "Visual artists, United States, 1988", subtitle: "graphic artists (incl. graphic designers) and fine artists", unit: 10000, unitName: "jobs", per: 22,
           groups: [{label: "1988", num: art88, at: "@sixteen"}], cap: [{s: "a broad group: graphic designers, illustrators, painters, sculptors", at: "@broad", src: [OOH90]}, {s: "BLS outlook: faster than average…", at: "@faster", src: [OOH90]}]}}
      - {tpl: plate, at: "@though-0.3", in: fade, p: {hero: shop_hook, off: 230, cap: [{s: "graphic artists: growth limited by computers", at: "@limit", src: [OOH90]}]},
         sfx: [{file: assets/ll/sfx/pencil-paper.mp3, at: "@though", src_ss: 30.0, dur: 3.0, gain_db: -14, fade_ms: 500}, {file: assets/ll/sfx/footsteps-steps.mp3, at: "@growth+0.6", src_ss: 0.5, dur: 2.6, gain_db: -12, fade_ms: 300}]}

  # ===== HỒI 3 · HÔM NAY (lạnh) =====
  - id: "06"
