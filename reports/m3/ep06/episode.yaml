shorts:
  - id: S1
    hook: "1990: 'more are certain to disappear'"
    vo: >-
      In 1990, the Bureau of Labor Statistics wrote about newspaper typesetters. Equipment that lets reporters and editors format pages at a desktop terminal has already eliminated many typesetting jobs, and more are certain to disappear. The work did not vanish: designers began doing it themselves, on computers.
    shots:
      - {tpl: plate, at: 0, p: {hero: s_lino, off: 0, cap: [{s: "BLS, 1990: newspaper typesetters", at: "@1990", src: [OOH90]}, {s: "pages formatted at a desktop terminal", at: "@format"}, {s: "many typesetting jobs already gone", at: "@eliminated"}, {s: "“more are certain to disappear”", at: "@certain"}]},
         sfx: [{file: assets/ll/sfx/press-rhythm.mp3, at: 0.2, src_ss: 2.0, dur: 9.0, gain_db: -15, fade_ms: 900}]}
      - {tpl: plate, at: "@vanish-0.6", in: fade, p: {hero: s_wall, off: 0, cap: [{s: "the work moved: designers did it themselves, on computers", at: "@vanish", src: [BES16]}]}}
  - id: S2
    hook: "Image work posts −17% after image AI"
    vo: >-
      One study looked at a large online freelancing platform. Within a year of image generators, posts for graphic design and 3D modeling work fell about seventeen percent, compared with manual jobs. That is one platform, and it counts job posts, not jobs.
    shots:
      - {tpl: jobboard, at: 0, p: {drop: "@seventeen+0.1", share: 0.17, seed: 17, mood: cold, cam: [{t: 0, x: 0, z: 0.0}, {t: 6, x: -20, z: 0.05}],
           cap: [{s: "a large freelancing platform", at: "@platform", src: [DHZ]}, {s: "within a year of image generators", at: "@within"}, {s: "graphic design and 3D modeling posts", at: "@graphic", src: [DHZ]},
                 {num: img, s: "job posts vs. manual jobs", at: "@seventeen"}, {s: "one platform · job posts, not jobs", at: "@counts"}]}}
  - id: S3
    hook: "BLS: AI will reduce the need for graphic designers"
    vo: >-
      The Bureau of Labor Statistics projects that automated design tools, such as artificial intelligence, will make graphic designers more productive and reduce the need for these workers. Its projection: a decline of one point seven percent from 2025 to 2035, while all jobs grow three point five percent.
    shots:
      - {tpl: plate, at: 0, sfx: [{file: assets/ll/sfx/keyboard-typing.mp3, at: 0.4, src_ss: 2.0, dur: 6.0, gain_db: -16, fade_ms: 700}], p: {hero: s_wall, off: 60, cap: [{s: "BLS: automated design tools, such as AI", at: "@automated", src: [OOHGD]}, {s: "more productive…", at: "@productive"}, {s: "…and less need for these workers", at: "@reduce"},
           {num: gd_chg, s: "graphic designers, projected 2025–35", at: "@one"}, {num: all_chg, s: "all jobs, projected 2025–35", at: "@three"}]}}
