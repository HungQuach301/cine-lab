                 {s: "then: the computer sets the type; the designer takes the tool", at: "@then", src: [BES16]}]}}
      - {tpl: desk, at: "@today-0.4", in: fade, p: {eras: [{era: 2025, at: "@today-0.4", label: "2025"}], accent: "#2f5d7c", cam: [{t: "@today", x: 0, z: 0.0}, {t: "@same", x: -50, z: 0.04}, {t: "@automated", x: -65, z: 0.055}, {t: "@differences", x: -80, z: 0.07}, {t: "@came", x: -95, z: 0.08}, {t: "@fewer", x: -110, z: 0.09}, {t: "@far", x: -120, z: 0.1}, {t: "@forecast#2", x: -125, z: 0.105}, {t: "@lost+1", x: -130, z: 0.11}],
