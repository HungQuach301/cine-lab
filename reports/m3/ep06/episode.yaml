# Last Lamplighters · Tập 6 "The Hand That Drew It" — đặc tả v2 (DỰNG LẠI theo NGUYÊN TẮC TỐI CAO, chủ dự án 06/10/2026).
# Giữ nguyên lời, số, nguồn đã duyệt ở G1. Đổi: hình (cảnh đinh 3D, mẫu vật chất v3, bàn làm việc ≤ 3 lần), nhạc theo hồi, âm thanh nghề,
# ngắt nghỉ trước số neo, bản đồ liền mạch `map:` mỗi đoạn (CHUAN-KENH §11.1), chuyển hồi bằng match cut / J-cut có ngọn đèn.
# Cặp nghề: thợ sắp chữ / người dàn trang (1942–1990, máy sắp chữ điện tử, chế bản trên máy tính) ↔ nhà thiết kế đồ hoạ với AI tạo sinh (2022–34).
# Nguồn: reports/m3/ep06/NGUON-TAP6.md. Mọi số đọc toàn văn (FRASER, NBER, EconStor). Số BLS 2025–35: "đã xác minh (Claude)" 06/10/2026 (G1 duyệt: đổi sang đợt mới nhất; 2024–34 chỉ ở khung riêng).
# G1 duyệt 06/10/2026: tiêu đề A; đoạn 11 viết lại theo CHUAN-KENH §10 (không nói về cách làm phim).
# KHÔNG dùng: đỉnh 86 300 của thợ ảnh (trùng con số 86 000 của phòng sắp chữ, dễ đọc nhầm) — chỉ nói "nearly nine in ten" và 9 200; số đếm thợ sắp chữ sau 1988 (không có toàn văn).
# Thư viện cần thêm trước khi dựng (một lượt, đầu tập): PROP typecase (khay chữ chì + tay cầm sắp chữ), PROP drawboard (bàn vẽ nghiêng + đèn kẹp); ERA 1942 → typecase, 1960 → drawboard.
