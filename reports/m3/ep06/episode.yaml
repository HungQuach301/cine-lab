  # 11 — đoạn minh bạch (rủi ro "cao" của SERIES): phim này làm bằng AI. LỜI NHÁP — chủ dự án duyệt hoặc viết lại ở G1, ghi AUTHORSHIP.
  - id: "11"
    part: TODAY
    vo: >-
      A word about this film. It was made with AI tools, including the voice you are hearing. But a person chose this story, approved every script, and decides what goes out.
      The BLS points the same way for designers: the machine makes first drafts faster, and a person still has to choose, fix, and answer for the one that goes out.
      Whether that leaves enough paid work for the people who once drew every line by hand, the hand that decides and not only the hand that drew, is something no projection can settle yet.
