segments:
  # 00 — móc câu (Q14): ai vẽ tấm áp phích này? Trả lời ở đoạn 11 (hand, decides).
  - id: "00"
    part: STORY
    vo: >-
      Who made this: a hand, or a machine? In 1990, the government said computers had already eliminated many typesetting jobs.
      Today, machines draw too. On one freelance platform, job posts for image work fell seventeen percent.
    vo_offset: 0.6
    tail: 0.6
    fadeIn: 0
    shots:
      - {tpl: desk, at: 0, p: {eras: [{era: 1960, at: 0, label: " "}, {era: 2025, at: "@today-0.3", label: " "}], accent: "#2f5d7c", cam: [{t: 0, x: 0, z: 0.03}, {t: 5, x: -30, z: 0.06}, {t: 10, x: -60, z: 0.09}, {t: 16, x: -90, z: 0.12}, {t: 22, x: -110, z: 0.14}],
           cap: [{s: "Who made this: a hand, or a machine?", at: "@who", src: []}, {s: "1990: computers had already eliminated many typesetting jobs (BLS)", at: "@1990", src: [OOH90]},
