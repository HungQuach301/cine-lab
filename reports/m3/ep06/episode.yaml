                 {s: "then: the keystrokes, and more designers", at: "@keystrokes", src: [BES16]}, {s: "now: the drawing itself, and fewer designers projected", at: "@reaches", src: [OOHGD]}, {s: "so far: a forecast and fewer job posts, not a count of jobs lost", at: "@far"}]}}
  - id: "11"
    part: TODAY
    vo: >-
      Who made this: a hand, or a machine? For most of a century, the answer was a hand: first the hand that set the type, then the hand that drew the page.
      If the machine makes the first drafts, the BLS expects designers to shift their focus to the later stages of the work. What is left is the hand that decides: which draft, what to fix, and what is good enough to print.
      Whether deciding is enough paid work for the people who once drew every line by hand is something no projection can settle yet.
    min_dur: 26
    shots:
      - {tpl: desk, at: 0, p: {eras: [{era: 1942, at: 0, label: "1942"}, {era: 1960, at: "@drew", label: "1960"}, {era: 2025, at: "@machine#2", label: "2025"}], accent: "#2f5d7c",
           cam: [{t: 0, x: 0, z: 0}, {t: 6, x: -30, z: 0.02}, {t: 12, x: -60, z: 0.04}, {t: 18, x: -80, z: 0.05}, {t: 24, x: -100, z: 0.07}, {t: "@deciding", x: -115, z: 0.08}, {t: "@paid", x: -120, z: 0.085}, {t: "@settle+1", x: -125, z: 0.09}],
           cap: [{s: "a hand, or a machine?", at: "@who", src: []}, {s: "the hand that set the type · the hand that drew the page", at: "@first"}, {s: "the later stages of the work", at: "@later", src: [MLR26]},
                 {s: "the hand that decides", at: "@decides"}, {s: "which draft · what to fix · what is good enough", at: "@which"}, {s: "enough paid work in deciding?", at: "@enough"}, {s: "no projection can settle it yet", at: "@projection"}]}}

  - id: "12"
    part: STORY
    vo: >-
      Back on the street, the lamplighter reaches the last post. The glass opens, the flame takes, and the corner is lit again.
      Every era has its last lamplighters. Some of them set type by hand.
    vo_offset: 3.0
    min_dur: 24
    tail: 2.0
    shots:
