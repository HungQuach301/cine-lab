  - id: "07"
    part: TODAY
    map: {q: "Can anyone see the change coming?", act: 3, emo: doubt, color: cold, cue: today, trade: [camera-shutter],
          in: cut, out: cut, lamp: {in: false, out: false},
          nouns: [{w: "@film", img: "phòng tối đèn đỏ, dải phim âm bản"}, {w: "@nine", img: "ô phim mờ dần, còn 1/10"}, {w: "@thousand", img: "số sơn trên tường", anchor: ph23}, {w: "@generative", img: "tường bản nháp"}]}
    pause: [{before: "@nine", s: 0.5}]
    vo: >-
      Can the BLS see a change like this coming? Once, it did. In the early 2000s, digital cameras were replacing film, and the BLS projected that photographic process workers, the people who developed film, would decline.
      They fell by nearly nine in ten, to only nine thousand two hundred by 2023.
      That change was easy to see coming: the digital camera improved on a familiar tool, and its path was clear.
      The tools now reaching designers are different. For a brand-new technology like generative AI, the BLS changes its projections only when its research provides clear evidence.
    shots:
      - {tpl: plate, at: 0, p: {hero: wall_back, off: 200, cap: [{s: "Can the BLS see it coming?", at: "@coming", src: []}]},
         sfx: [{file: assets/ll/sfx/mouse-clicks.mp3, at: 0.5, src_ss: 32.0, dur: 2.5, gain_db: -13, fade_ms: 400}]}
      - {tpl: filmstrip, at: "@once-0.3", in: fade, p: {fade: 999, seed: 29, cam: [{t: "@once", x: 0, z: 0.0}, {t: "@fell", x: -60, z: 0.06}],
           cap: [{s: "once, it did: early 2000s, digital cameras replace film", at: "@digital", src: [MLR25]}, {s: "BLS projected: photo processing workers decline", at: "@projected", src: [MLR25]}]},
         sfx: [{file: assets/ll/sfx/camera-shutter.mp3, at: "@digital", src_ss: 0.5, dur: 1.2, gain_db: -8, fade_ms: 60}]}
      - {tpl: filmstrip, at: "@fell-0.4", in: cut, p: {fade: "@nine", keep: 0.11, seed: 31, cam: [{t: "@fell", x: 80, z: 0.2}, {t: "@2023+0.5", x: 40, z: 0.24}], cap: [{s: "nearly nine in ten gone", at: "@nine", src: [MLR25]}]}}
      - {tpl: sign, at: "@only-0.4", in: fade, p: {num: ph23, at: "@thousand", wall: plaster, cam: [{t: "@only", x: 0, z: 0.0}, {t: "@2023+0.8", x: -30, z: 0.03}],
           cap: [{s: "photographic process workers, 2023", at: "@2023", src: [MLR25]}, {s: "easy to see coming: a familiar tool, improved", at: "@easy", src: [MLR25]}, {s: "…and a clear path", at: "@path", src: [MLR25]}]}}
      - {tpl: plate, at: "@tools-0.4", in: fade, p: {hero: wall_push, off: 0, cap: [{s: "the tools now reaching designers are different", at: "@tools"}, {s: "generative AI: projections change…", at: "@brandnew", src: [MLR25]}, {s: "…only with clear evidence", at: "@clear#2"}]},
         sfx: [{file: assets/ll/sfx/keyboard-typing.mp3, at: "@generative", src_ss: 5.0, dur: 4.0, gain_db: -15, fade_ms: 400}]}

  - id: "08"
    part: TODAY
    map: {q: "What does the BLS expect for designers?", act: 3, emo: concern, color: cold, cue: today, trade: [keyboard-typing, mouse-clicks],
          in: cut, out: cut, lamp: {in: false, out: false},
          nouns: [{w: "@drafts", img: "tường bản nháp đầy dần"}, {w: "@fiftythree", img: "hàng hình người 2025", anchor: gd25}, {w: "@one", img: "hàng hình người 2025 → 2035 (dự báo)", anchor: gd_chg}, {w: "@three", img: "hàng hình người (chú thích so sánh), rồi cột so sánh", anchor: all_chg}]}
    pause: [{before: "@one", s: 0.7}]
    tail: 4.0
    vo: >-
      In January 2026, a BLS review described what generative AI does for graphic designers: it helps them explore ideas and create first drafts much more quickly, and automate repetitive tasks such as prototyping.
      The newest projections, for 2025 to 2035, go further. Automated design tools, such as artificial intelligence, are projected to make graphic designers more productive and reduce the need for these workers.
      Graphic designers held about two hundred fifty-three thousand jobs in 2025. The BLS projects about two hundred forty-nine thousand by 2035: a decline of one point seven percent, while all jobs together grow three point five percent.
    shots:
      - {tpl: plate, at: 0, p: {hero: wall_push, off: 100, cap: [{s: "BLS, Monthly Labor Review, January 2026", at: "@january", src: [MLR26]}, {s: "explore ideas", at: "@explore"}, {s: "first drafts, much more quickly", at: "@drafts"}, {s: "repetitive tasks such as prototyping", at: "@repetitive"}]},
         sfx: [{file: assets/ll/sfx/keyboard-typing.mp3, at: "@explore", src_ss: 10.0, dur: 4.0, gain_db: -15, fade_ms: 400}, {file: assets/ll/sfx/mouse-clicks.mp3, at: "@prototyping", src_ss: 20.0, dur: 2.0, gain_db: -12, fade_ms: 300}]}
      - {tpl: quote, at: "@newest-0.4", in: flip, p: {beats: [{s: "the newest projections, 2025–35", at: "@newest"}, {s: "more productive", at: "@productive"}, {s: "…and less need for these workers", at: "@reduce"}], text: "Automated design tools, such as artificial intelligence (AI), are projected to make graphic designers more productive and reduce the need for these workers.",
           who: "U.S. Bureau of Labor Statistics", where: "Occupational Outlook Handbook, 2025–35", at: "@automated", src: [OOHGD]}}
      - {tpl: isotype, at: "@held-1.0", in: fade, p: {title: "Graphic designers, United States", subtitle: "employment, 2025 and projected 2035", unit: 10000, unitName: "jobs", per: 26,
           groups: [{label: "2025", num: gd25, at: "@fiftythree"}, {label: "2035 (projected)", num: gd35, at: "@fortynine"}],
           cap: [{s: "graphic designers, 2025", at: "@held", src: [OOHGD]}, {num: gd_chg, s: "graphic designers, projected change, 2025–35", at: "@one"}, {num: all_chg, s: "all jobs, projected change, 2025–35", at: "@three"}]}}
      - {tpl: bars, at: "@percent#2+0.3", in: slide, p: {title: "Projected job change, 2025–35", subtitle: "same source, same period: BLS", unit: '%', max: 4, kindEach: true,
           bars: [{label: "Graphic designers", num: gd_chg, at: "@percent#2+0.4"}, {label: "All occupations", num: all_chg, at: "@percent#2+0.9"}]}}

  - id: "09"
    part: TODAY
    map: {q: "Where is the change felt first?", act: 3, emo: concern, color: cold, cue: today, trade: [mouse-clicks],
          in: cut, out: cut, lamp: {in: false, out: false},
          nouns: [{w: "@platform", img: "bảng ghim tin việc"}, {w: "@seventeen", img: "17 % tờ tin rơi khỏi bảng", anchor: img}, {w: "@freelancer", img: "người thiết kế (bóng) trước tường bản nháp"}]}
    pause: [{before: "@seventeen", s: 0.7}]
    vo: >-
      Outside the forecasts, one study looked at a large online freelancing platform. After image generators such as Midjourney, Stable Diffusion, and DALL-E 2 were released in 2022,
      posts for image creation work, graphic design and 3D modeling, fell about seventeen percent within a year, compared with manual jobs.
      The authors note the drop was larger than the platform's usual seasonal swings. Still, that is one platform, and it counts job posts, not jobs. But it is where a freelancer feels a change first: in the number of clients asking.
    shots:
      - {tpl: jobboard, at: 0, p: {drop: 999, seed: 17, mood: cold, cam: [{t: 0, x: 30, z: 0.0}, {t: "@posts", x: -30, z: 0.04}],
           cap: [{s: "one study: a large freelancing platform", at: "@study", src: [DHZ]}, {s: "after image generators, 2022", at: "@generators", src: [DHZ]}]}}
      - {tpl: jobboard, at: "@posts-0.3", in: cut, p: {drop: "@seventeen+0.1", share: 0.17, seed: 19, mood: cold, cam: [{t: "@posts", x: -80, z: 0.22}, {t: "@manual+1", x: -40, z: 0.26}],
           cap: [{s: "graphic design and 3D modeling posts", at: "@posts", src: [DHZ]}, {num: img, s: "image-work job posts vs. manual jobs, within a year", at: "@seventeen"}]}}
      - {tpl: sign, at: "@authors-0.4", in: fade, p: {num: img, at: "@authors+0.2", wall: brick, cam: [{t: "@authors", x: 0, z: 0.0}, {t: "@jobs#2", x: -30, z: 0.03}],
           cap: [{s: "larger than the usual seasonal swings", at: "@seasonal", src: [DHZ]}, {s: "one platform · job posts, not jobs", at: "@platform#2", src: [DHZ]}]}}
      - {tpl: plate, at: "@freelancer-0.4", in: fade, p: {hero: wall_back, off: 160, cap: [{s: "where a freelancer feels it first", at: "@feels"}, {s: "in the number of clients asking", at: "@clients"}]},
         sfx: [{file: assets/ll/sfx/mouse-clicks.mp3, at: "@freelancer", src_ss: 26.0, dur: 3.0, gain_db: -12, fade_ms: 300}]}

  - id: "10"
    part: TODAY
    map: {q: "Is this the same story again?", act: 3, emo: reflection, color: cold, cue: today, trade: [typewriter-old, press-rhythm, keyboard-typing],
          in: cut, out: cut, lamp: {in: false, out: false},
          nouns: [{w: "@pattern", img: "khung đôi: khay chữ chì | tường bản nháp"}, {w: "@repetitive", img: "tay đặt chữ lặp lại"}, {w: "@keystrokes", img: "bàn phím máy Linotype"}, {w: "@drawing", img: "tường bản nháp, người thiết kế"}, {w: "@posts#2", img: "bảng tin việc thưa dần"}]}
    vo: >-
      So here is the comparison, with a caution. We will not set these numbers side by side: one is a count from 1988, one is a forecast, and one is a single platform's job posts.
      What we can compare is the pattern. Then, the computer took over setting the type, and designers began doing that work themselves, on screen. Today, software can draft the first image, and designers use it to reach a first draft much more quickly.
      Not the same technology. The same pattern: a repetitive human task, taken over by an automated system.
      But the differences matter. Back then, the machine took the keystrokes, and there came to be more designers. This time, it reaches for the drawing itself, and the BLS projects fewer designers. So far, that is a forecast and a drop in job posts, not yet a count of jobs lost.
    shots:
      - {tpl: plate, at: 0, p: {hero: lino_high, off: 150, cap: [{s: "the comparison, with a caution", at: "@comparison"}, {s: "not side by side:", at: "@side"}, {s: "a count from 1988", at: "@count", src: [OOH90]}]},
         sfx: [{file: assets/ll/sfx/press-rhythm.mp3, at: 0.3, src_ss: 24.0, dur: 5.0, gain_db: -17, fade_ms: 1200}]}
      - {tpl: plate, at: "@forecast-0.3", in: fade, p: {hero: wall_push, off: 250, cap: [{s: "a forecast, 2025–35", at: "@forecast", src: [OOHGD]}]},
         sfx: [{file: assets/ll/sfx/mouse-clicks.mp3, at: "@forecast", src_ss: 14.0, dur: 2.0, gain_db: -14, fade_ms: 300}]}
      - {tpl: jobboard, at: "@single-0.3", in: fade, p: {drop: 999, seed: 29, mood: cold, cam: [{t: "@single", x: 40, z: 0.16}, {t: "@pattern", x: 10, z: 0.2}], cap: [{s: "one platform's job posts", at: "@single", src: [DHZ]}]}}
      - {tpl: diptych, at: "@pattern-0.4", in: fade, p: {split: "@today-0.2", left: {hero: case_close, i: 60, fx: 0.5}, right: {hero: wall_push, i: 300, fx: 0.5},
           cap: [{s: "what we can compare is the pattern", at: "@pattern"}, {s: "then: computers set the type; designers did that work themselves", at: "@then", src: [BES16]}, {s: "today: software can draft the first image", at: "@today", src: [MLR26]}, {s: "designers use it to reach a first draft faster", at: "@reach", src: [MLR26]}]}}
      - {tpl: plate, at: "@technology-0.6", in: fade, p: {hero: case_close, off: 200, cap: [{s: "not the same technology — the same pattern", at: "@technology"}, {s: "a repetitive human task, taken over by an automated system", at: "@repetitive"}]},
         sfx: [{file: assets/ll/sfx/typewriter-old.mp3, at: "@technology", src_ss: 2.0, dur: 5.0, gain_db: -15, fade_ms: 400}]}
      - {tpl: plate, at: "@differences-0.4", in: fade, p: {hero: lino_row, off: 150, cap: [{s: "but the differences matter", at: "@differences"}, {s: "then: the keystrokes, and more designers", at: "@keystrokes", src: [BES16]}]},
         sfx: [{file: assets/ll/sfx/press-rhythm.mp3, at: "@differences", src_ss: 18.0, dur: 5.0, gain_db: -15, fade_ms: 700}]}
      - {tpl: plate, at: "@reaches-0.5", in: fade, p: {hero: wall_back, off: 60, cap: [{s: "now: the drawing itself, and fewer designers projected", at: "@reaches", src: [OOHGD]}]},
         sfx: [{file: assets/ll/sfx/keyboard-typing.mp3, at: "@reaches", src_ss: 12.0, dur: 3.5, gain_db: -15, fade_ms: 400}]}
      - {tpl: jobboard, at: "@far-0.4", in: fade, p: {drop: "@drop+0.2", share: 0.17, seed: 23, mood: cold, cam: [{t: "@far", x: 20, z: 0.1}, {t: "@lost+1", x: -10, z: 0.13}],
           cap: [{s: "so far: a forecast and fewer job posts, not a count of jobs lost", at: "@far"}]}}

  - id: "11"
    part: TODAY
    map: {q: "Who made this: a hand, or a machine? (trả lời)", act: 3, emo: resolve, color: cold, cue: today, trade: [typewriter-old, pencil-paper, keyboard-typing],
          in: cut, out: jcut, out_note: "khung đôi khay chữ dưới đèn → ngọn đèn phố; tiếng đèn xì vào trước hình", lamp: {in: true, out: true},
          nouns: [{w: "@who", img: "cửa sổ người vẽ (lặp móc câu)"}, {w: "@type", img: "khay chữ chì, tay đặt chữ"}, {w: "@drew", img: "người vẽ bên bàn vẽ, màn hình bừng"}, {w: "@drafts", img: "tường bản nháp"}, {w: "@decides", img: "người thiết kế, đèn bàn, tờ in"}, {w: "@hand#4", img: "khung đôi: khay chữ | bàn thiết kế"}]}
    vo: >-
      Who made this: a hand, or a machine? For most of a century, the answer was a hand: first the hand that set the type, then the hand that drew the page.
      If the machine makes the first drafts, the BLS expects designers to shift their focus to the later stages of the work. What is left is the hand that decides: which draft, what to fix, and what is good enough to print.
      Whether deciding is enough paid work for the people who once drew every line by hand is something no projection can settle yet.
    min_dur: 26
    shots:
      - {tpl: plate, at: 0, p: {hero: shop_hook, off: 200, cap: [{s: "a hand, or a machine?", at: "@who", src: []}, {s: "for most of a century: a hand", at: "@answer"}]},
         sfx: [{file: assets/ll/sfx/pencil-paper.mp3, at: 0.4, src_ss: 70.0, dur: 4.0, gain_db: -14, fade_ms: 600}]}
      - {tpl: plate, at: "@first-0.3", in: fade, p: {hero: case_close, off: 100, cap: [{s: "the hand that set the type", at: "@first"}]},
         sfx: [{file: assets/ll/sfx/typewriter-old.mp3, at: "@set", src_ss: 7.0, dur: 2.0, gain_db: -15, fade_ms: 300}]}
      - {tpl: plate, at: "@drew-0.6", in: fade, p: {hero: shop_bridge, off: 200, cap: [{s: "the hand that drew the page", at: "@drew"}]},
         sfx: [{file: assets/ll/sfx/pencil-paper.mp3, at: "@drew", src_ss: 50.0, dur: 2.5, gain_db: -12, fade_ms: 300}]}
      - {tpl: plate, at: "@machine#2-0.3", in: fade, p: {hero: wall_push, off: 200, cap: [{s: "if the machine makes the first drafts…", at: "@drafts"}, {s: "…designers shift to the later stages of the work", at: "@later", src: [MLR26]}]},
         sfx: [{file: assets/ll/sfx/keyboard-typing.mp3, at: "@drafts", src_ss: 14.0, dur: 3.0, gain_db: -15, fade_ms: 400}]}
