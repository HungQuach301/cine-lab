segments:
  # ===== HỒI 1 · TRUYỆN (ấm) =====
  - id: "00"
    part: STORY
    map: {q: "Who made this: a hand, or a machine?", act: 1, emo: curiosity, color: warm, cue: theme, trade: [press-heidelberg, typewriter-old, mouse-clicks],
          in: cut, out: cut, lamp: {in: true, out: false},
          nouns: [{w: "@who", img: "cửa sổ xưởng in: người vẽ bên bàn vẽ"}, {w: "@typesetting", img: "khay chữ chì dưới đèn"}, {w: "@draw", img: "tường bản nháp hiện dần"}, {w: "@seventeen", img: "bảng ghim tin việc, 17 % tờ rơi"}]}
    pause: [{before: "@seventeen", s: 0.5}]
    vo: >-
      Who made this: a hand, or a machine? In 1990, the government said computers had already eliminated many typesetting jobs.
      Today, machines draw too. On one freelance platform, posts for image work fell seventeen percent, compared with manual jobs.
    speed: 1.08
    vo_offset: 0.3
    tail: 0.2
    fadeIn: 0
    shots:
      - {tpl: plate, at: 0, p: {hero: shop_hook, off: 0, cap: [{s: "Who made this: a hand, or a machine?", at: "@who", src: []}]},
         sfx: [{file: assets/ll/sfx/press-heidelberg.mp3, at: 0.2, src_ss: 2.0, dur: 4.6, gain_db: -12, fade_ms: 600}]}
      - {tpl: plate, at: "@1990-0.3", p: {hero: case_wide, off: 24, cap: [{s: "1990: computers had already eliminated many typesetting jobs (BLS)", at: "@1990", src: [OOH90]}]},
         sfx: [{file: assets/ll/sfx/typewriter-old.mp3, at: "@1990", src_ss: 1.0, dur: 3.0, gain_db: -14, fade_ms: 300}]}
      - {tpl: plate, at: "@today-0.3", p: {hero: wall_push, off: 60, cap: [{s: "today: machines draw too", at: "@today", src: []}]},
         sfx: [{file: assets/ll/sfx/mouse-clicks.mp3, at: "@today", src_ss: 2.0, dur: 2.6, gain_db: -10, fade_ms: 200}]}
      - {tpl: jobboard, at: "@freelance-0.3", in: fade, p: {drop: "@seventeen+0.1", share: 0.17, mood: cold, cam: [{t: "@freelance", x: 0, z: 0.0}, {t: "@percent+1", x: -40, z: 0.06}],
           cap: [{num: img, s: "image-work posts vs. manual jobs, one platform, within a year", at: "@seventeen"}]}}

  - id: "01"
    part: STORY
    map: {q: "Who set the words by hand?", act: 1, emo: wonder, color: warm, cue: theme, trade: [footsteps-steps, gas-hiss, typewriter-old],
          in: cut, out: match, out_note: "đèn treo trên khay chữ → hàng đèn treo trên máy Linotype; J-cut tiếng máy đúc chữ", lamp: {in: true, out: true},
          nouns: [{w: "@lamplighter", img: "người thắp đèn đi qua xưởng in, thắp đèn"}, {w: "@cellar", img: "bậc hầm và cửa hầm sáng"}, {w: "@letters", img: "khay chữ chì"}, {w: "@letter", img: "tay đặt từng con chữ vào tay cầm"}]}
    vo: >-
      At dusk, the lamplighter passes a print shop. Down the cellar steps, a lamp burns over a wooden case of metal letters.
      Every word in tomorrow's paper will be set by hand, one letter at a time.
    vo_offset: 3.4
    min_dur: 27
    tail: 1.4
    shots:
      - {tpl: text, at: 0, p: {lamp: true, lines: [{s: "THE HAND THAT DREW IT", px: 80}, {s: "Last Lamplighters · Episode 6", px: 34, serif: false}]}}
      - {tpl: plate, at: 3.0, in: fade, p: {hero: shop_walk, off: 0, ev: [{at: 6.6, what: "người thắp đèn dừng, giơ sào"}, {at: 7.6, what: "đèn bén"}]},
         sfx: [{file: assets/ll/sfx/footsteps-steps.mp3, at: 3.2, src_ss: 0.5, dur: 3.6, gain_db: -12, fade_ms: 400}, {file: assets/ll/sfx/gas-hiss.mp3, at: 7.6, src_ss: 2.0, dur: 1.8, gain_db: -8, fade_ms: 200}]}
      - {tpl: plate, at: "@lamp-0.3", in: fade, p: {hero: case_wide, off: 0},
         sfx: [{file: assets/ll/sfx/footsteps-steps.mp3, at: "@down", src_ss: 6.0, dur: 2.4, gain_db: -12, fade_ms: 300}]}
      - {tpl: plate, at: "@every-0.4", p: {hero: case_line, off: 0, ev: [{at: "@every+8.6", what: "dòng chữ đầy, tay nhấc tay cầm"}], cap: [{s: "every word, set by hand", at: "@every"}, {s: "one letter at a time", at: "@letter"}]},
         sfx: [{file: assets/ll/sfx/typewriter-old.mp3, at: "@every", src_ss: 4.0, dur: 6.5, gain_db: -15, fade_ms: 400}]}

  # ===== HỒI 2 · LỊCH SỬ (sepia) =====
  - id: "02"
    part: HISTORY
    map: {q: "How was a page made before computers?", act: 2, emo: craft, color: sepia, cue: history, trade: [press-rhythm, typewriter-old],
          in: match, in_note: "match cut đèn treo; tiếng máy vào trước hình 1,5 s (J-cut)", out: cut, lamp: {in: true, out: false},
          nouns: [{w: "@hot", img: "hàng máy Linotype, nồi chì đỏ"}, {w: "@operator", img: "ảnh: tay thợ Linotype trên bàn phím"}, {w: "@room", img: "ảnh: phòng sắp chữ NYT"}, {w: "@compositors", img: "ảnh: thợ dàn trang khuôn chì"}]}
    vo: >-
      For most of a century, printing ran on hot type. A Linotype operator typed a line, and the machine cast it in molten lead.
      In a newspaper composing room, rows of these machines clattered through the night, and compositors fitted the lines of lead into pages.
      The Bureau of Labor Statistics later wrote that this method was well along the road to extinction.
    min_dur: 28
    shots:
      - {tpl: plate, at: 0, p: {hero: lino_row, off: 0, cap: [{s: "hot type: lines cast in molten lead", at: "@hot", src: [OOH90]}]},
         sfx: [{file: assets/ll/sfx/press-rhythm.mp3, at: -1.5, src_ss: 1.0, dur: 9.0, gain_db: -11, fade_ms: 700}]}
      - {tpl: archive, at: "@operator-0.3", in: fade, p: {img: assets/ll/archive/fsa-8d22724.jpg, rid: LOC-8d22724, focus: [0.62, 0.5], credit: "Linotyper's hands, NYT, 1942 · Library of Congress",
           cam: [{t: "@operator", x: 0, z: 0.02}, {t: "@molten+1", x: -40, z: 0.08}], cap: [{s: "a Linotype operator types a line", at: "@operator"}]},
         sfx: [{file: assets/ll/sfx/typewriter-old.mp3, at: "@typed", src_ss: 6.0, dur: 2.6, gain_db: -15, fade_ms: 300}]}
      - {tpl: archive, at: "@newspaper-0.3", p: {img: assets/ll/archive/fsa-8d22721.jpg, rid: LOC-8d22721, focus: [0.5, 0.45], credit: "NYT composing room, 1942 · Library of Congress",
           cam: [{t: "@newspaper", x: 40, z: 0.0}, {t: "@night+0.5", x: -20, z: 0.07}], cap: [{s: "a newspaper composing room", at: "@newspaper"}]},
         sfx: [{file: assets/ll/sfx/press-rhythm.mp3, at: "@rows", src_ss: 12.0, dur: 3.2, gain_db: -14, fade_ms: 600}]}
      - {tpl: archive, at: "@compositors-0.3", p: {img: assets/ll/archive/fsa-8d22748.jpg, rid: LOC-8d22748, focus: [0.45, 0.62], credit: "Page make-up, NYT, 1942 · Library of Congress",
           cam: [{t: "@compositors", x: 0, z: 0.03}, {t: "@pages+1", x: 30, z: 0.09}], cap: [{s: "compositors fit the lines of lead into pages", at: "@compositors"}]}}
      - {tpl: plate, at: "@later-0.4", in: fade, p: {hero: lino_row, off: 140, cap: [{s: "the BLS, 1990:", at: "@later", src: [OOH90]}, {s: "“…well along the road to extinction”", at: "@well", src: [OOH90]}]},
         sfx: [{file: assets/ll/sfx/press-rhythm.mp3, at: "@later", src_ss: 20.0, dur: 6.0, gain_db: -15, fade_ms: 1500}]}

  - id: "03"
    part: HISTORY
    map: {q: "What replaced hot type?", act: 2, emo: change, color: sepia, cue: history, trade: [keyboard-typing, pencil-paper],
          in: cut, out: cut, lamp: {in: false, out: false},
          nouns: [{w: "@computer", img: "bàn làm việc: thiết bị đầu cuối 1975"}, {w: "@photographic", img: "phòng tối: bản in phơi trên dây"}, {w: "@pasteup", img: "bàn dàn trang: cột chữ trượt vào khuôn"}, {w: "@screen", img: "cận màn hình thiết bị đầu cuối"}, {w: "@eliminating", img: "dao rạch ngang tấm dàn trang"}]}
    vo: >-
      What replaced it was cold type. Text was keyed into a computer that was programmed to hyphenate, space, and create columns of text, and a machine printed it onto photographic paper.
      Paste-up artists cut those columns apart and arranged them, with the illustrations, on a board. Increasingly, the BLS noted, the author did the keyboarding before the job was even sent out.
      Then came electronic pagination: a whole newspaper page, made up on a screen, eliminating the role of paste-up artists.
    shots:
      - {tpl: desk, at: 0, p: {eras: [{era: 1988, at: 0, label: "1975"}], accent: "#2f5d7c", cam: [{t: 0, x: 0, z: 0.02}, {t: "@photographic", x: -50, z: 0.07}],
           cap: [{s: "cold type: text keyed into a computer", at: "@cold", src: [OOH90]}, {s: "hyphenate · space · create columns", at: "@hyphenate"}]},
         sfx: [{file: assets/ll/sfx/keyboard-typing.mp3, at: "@keyed", src_ss: 1.0, dur: 4.0, gain_db: -14, fade_ms: 400}]}
      - {tpl: filmstrip, at: "@machine-0.3", in: fade, p: {fade: 999, cam: [{t: "@machine", x: 0, z: 0.0}, {t: "@pasteup", x: -40, z: 0.05}], cap: [{s: "printed onto photographic paper", at: "@photographic"}]}}
      - {tpl: pasteup, at: "@pasteup-0.4", in: slide, p: {at: "@cut", seed: 41, cam: [{t: "@pasteup", x: 0, z: 0.0}, {t: "@author", x: -30, z: 0.06}],
           cap: [{s: "paste-up: columns cut apart…", at: "@cut"}, {s: "…arranged with pictures on a board", at: "@board"}, {s: "the author does the keyboarding", at: "@author", src: [OOH90]}]},
         sfx: [{file: assets/ll/sfx/pencil-paper.mp3, at: "@cut", src_ss: 20.0, dur: 4.0, gain_db: -12, fade_ms: 400}]}
      - {tpl: desk, at: "@electronic-0.4", in: fade, p: {eras: [{era: 1988, at: "@electronic-0.4", label: " "}], accent: "#2f5d7c", frame: {z: 1.9, x: 0.54, y: 0.62},
           cam: [{t: "@electronic", x: 0, z: 0.0}, {t: "@eliminating", x: -30, z: 0.04}], cap: [{s: "electronic pagination: the page made up on a screen", at: "@pagination"}]},
         sfx: [{file: assets/ll/sfx/keyboard-typing.mp3, at: "@screen", src_ss: 8.0, dur: 2.0, gain_db: -15, fade_ms: 300}]}
      - {tpl: pasteup, at: "@eliminating-0.4", in: cut, p: {at: -50, cut: "@eliminating+0.2", seed: 43, cam: [{t: "@eliminating", x: 60, z: 0.18}, {t: "@artists#2+1", x: 20, z: 0.22}],
           cap: [{s: "eliminating the role of paste-up artists", at: "@eliminating"}]}}

  - id: "04"
    part: HISTORY
    map: {q: "How many jobs, and where were they going?", act: 2, emo: weight, color: sepia, cue: history, trade: [press-rhythm, typewriter-old],
          in: cut, out: cut, lamp: {in: false, out: false},
          nouns: [{w: "@eightysix", img: "phòng sắp chữ góc cao: hàng máy và người vận hành", anchor: comp88}, {w: "@typing", img: "ảnh: thợ sắp chữ bằng tay, NYT 1942"}, {w: "@apprenticeship", img: "khay chữ chì, tay thợ"}, {w: "@terminal", img: "phòng biên tập: hàng người bên máy, đèn bàn tắt dần"}]}
    pause: [{before: "@eightysix", s: 0.7}]
    vo: >-
      By 1988, composing room workers held about eighty-six thousand jobs in the United States, more than a third of them at newspapers.
      Across the whole printing industry, the BLS expected their numbers to stay about level through the year 2000: printing was growing, but computers were taking over much of the typing.
      The training changed too. In the past, almost all compositors learned through an apprenticeship. By 1990, new technologies had lowered skill requirements, and most learned the craft on the job.
      At newspapers, the outlook was blunt: equipment that lets reporters and editors format pages at a desktop terminal has already eliminated many typesetting and composition jobs, and more are certain to disappear.
    shots:
      - {tpl: plate, at: 0, p: {hero: lino_high, off: 0, cap: [{s: "composing room workers, United States, 1988", at: "@composing", src: [OOH90]}, {num: comp88, s: "jobs, 1988", at: "@eightysix"}, {s: "more than a third at newspapers", at: "@third"}]},
         sfx: [{file: assets/ll/sfx/press-rhythm.mp3, at: 0.0, src_ss: 3.0, dur: 9.0, gain_db: -15, fade_ms: 900}]}
      - {tpl: archive, at: "@expected-0.4", in: fade, p: {img: assets/ll/archive/fsa-8d22743.jpg, rid: LOC-8d22743, focus: [0.4, 0.55], credit: "Setting type by hand, NYT, 1942 · Library of Congress",
           cam: [{t: "@expected", x: 0, z: 0.02}, {t: "@typing+1", x: -40, z: 0.09}],
           cap: [{s: "all of printing, outlook to 2000: about level", at: "@expected", src: [OOH90]}, {s: "printing was growing…", at: "@growing"}, {s: "…but computers took over much of the typing", at: "@typing", src: [OOH90]}]}}
      - {tpl: plate, at: "@training-0.4", in: fade, p: {hero: case_close, off: 140, cap: [{s: "the training changed too", at: "@training"}, {s: "in the past: an apprenticeship", at: "@apprenticeship", src: [OOH90]}, {s: "1990: skill requirements lowered", at: "@lowered", src: [OOH90]}, {s: "…most learned on the job", at: "@job"}]},
         sfx: [{file: assets/ll/sfx/typewriter-old.mp3, at: "@apprenticeship", src_ss: 9.0, dur: 3.5, gain_db: -16, fade_ms: 400}]}
      - {tpl: rows, at: "@newspapers#2-0.4", in: fade, p: {variant: typing, rows: 3, per: 7, dim: ["@terminal", "@disappear"], cam: [{t: "@newspapers#2", x: 0, z: 0.0}, {t: "@already", x: -30, z: 0.04}, {t: "@disappear+1", x: -60, z: 0.08}],
           cap: [{s: "at newspapers: reporters and editors format pages", at: "@reporters", src: [OOH90]}, {s: "at a desktop terminal", at: "@terminal"},
                 {s: "BLS, 1990: “…already eliminated many typesetting and composition jobs”", at: "@already", src: [OOH90]}, {s: "“…and more are certain to disappear”", at: "@certain", src: [OOH90]}]},
