shorts:
  - id: S1
    hook: "1990: 'more are certain to disappear'"
    vo: >-
      In 1990, the Bureau of Labor Statistics wrote about newspaper typesetters. Equipment that lets reporters and editors format pages at a desktop terminal has already eliminated many typesetting jobs, and more are certain to disappear. The work did not vanish. Designers took the tool.
    shots:
      - {tpl: desk, at: 0, p: {eras: [{era: 1942, at: 0, label: " "}, {era: 1988, at: "@equipment-0.3", label: " "}], accent: "#2f5d7c", cam: [{t: 0, x: 0, z: 0.02}, {t: 8, x: -30, z: 0.06}, {t: 16, x: -60, z: 0.1}, {t: 22, x: -80, z: 0.12}],
           cap: [{s: "BLS, 1990: newspaper typesetters", at: "@1990", src: [OOH90]}, {s: "pages formatted at a desktop terminal", at: "@format"}, {s: "many typesetting jobs already gone", at: "@eliminated"},
                 {s: "“more are certain to disappear”", at: "@certain"}, {s: "the work moved: designers took the tool", at: "@vanish"}]}}
  - id: S2
    hook: "Image work posts −17% after image AI"
    vo: >-
      One study looked at a large online freelancing platform. Within a year of image generators, posts for graphic design and 3D modeling work fell about seventeen percent, compared with manual jobs. That is one platform, and it counts job posts, not jobs.
    shots:
      - {tpl: sign, at: 0, p: {num: img, at: "@seventeen", cam: [{t: 0, x: 0, z: 0.0}, {t: 6, x: -20, z: 0.03}],
           cap: [{s: "a large freelancing platform", at: "@platform", src: [DHZ]}, {s: "within a year of image generators", at: "@within"}, {s: "graphic design and 3D modeling posts", at: "@graphic", src: [DHZ]},
                 {s: "one platform", at: "@one#2"}, {s: "job posts, not jobs", at: "@counts"}]}}
  - id: S3
    hook: "BLS: AI will reduce the need for graphic designers"
    vo: >-
      The Bureau of Labor Statistics projects that automated design tools, such as artificial intelligence, will make graphic designers more productive and reduce the need for these workers. Its projection: a decline of one point seven percent from 2025 to 2035, while all jobs grow three point five percent.
    shots:
      - {tpl: desk, at: 0, p: {eras: [{era: 2025, at: 0, label: " "}], accent: "#2f5d7c", cam: [{t: 0, x: 0, z: 0.02}, {t: 8, x: -30, z: 0.06}, {t: 16, x: -60, z: 0.1}, {t: 22, x: -80, z: 0.12}],
           cap: [{s: "BLS: automated design tools, such as AI", at: "@automated", src: [OOHGD]}, {s: "more productive…", at: "@productive"}, {s: "…and less need for these workers", at: "@reduce"},
                 {num: gd_chg, s: "graphic designers, projected 2025–35", at: "@one"}, {num: all_chg, s: "all jobs, projected 2025–35", at: "@three"}]}}
