segments:
  - id: "00"
    part: STORY
    dur: 6
    fadeIn: 0
    shots:
      - {tpl: rows, at: 0, p: {variant: teller, rows: 1, per: 6, dim: [2.0, 4.8], screen: 3.8, screenLabel: "ATM", cam: [{t: 0, x: 0, z: 0.02}, {t: 6, x: -50, z: 0.1}]}}

  - id: "01"
    part: STORY
    vo: >-
      At dusk, the lamplighter starts the round. On the corner stands a bank, and in its wall a small screen glows all night.
      It never closes. It never needs a lunch break. Inside, behind the counter, there were once people at every window.
      Tonight, only a few of those windows are lit.
    vo_offset: 4.0
    min_dur: 46
    tail: 1.5
    shots:
      - {tpl: street, at: 0, p: {lamps: [{x: 260}, {x: 860, lit: "@round+0.5"}, {x: 1460}, {x: 2060}], lighter: {from: 500, to: 820, walk: [0.5, "@round"], lights: [1]}, warm: 0.6, windows: 0.5,
                                 cam: [{t: 0, x: 0, z: 0}, {t: "@corner", x: -280, z: 0.06}]}}
      - {tpl: rows, at: "@inside-0.4", in: fade, p: {variant: teller, rows: 1, per: 6, dim: ["@once", "@tonight"], screen: "@inside", screenLabel: "ATM", cam: [{t: "@inside", x: 40, z: 0}, {t: "@lit+1.5", x: -40, z: 0.1}]}}

  - id: "02"
    part: HISTORY
    vo: >-
      For most of the twentieth century, banking meant a person at a window. The teller counted your cash, checked your signature,
      and wrote the deposit in your passbook. It was careful, repetitive work, and after the Second World War there was more and more of it.
      In 1950, the U.S. census counted about sixty-five thousand bank tellers. By 1970, on a newer census basis, about two hundred fifty-three thousand.
      That growth came before cash machines, in the long postwar boom.
    min_dur: 30
    shots:
      - {tpl: text, at: 0, p: {lamp: true, lines: [{s: "THE TELLER'S WINDOW", px: 84}, {s: "Last Lamplighters · Episode 3", px: 34, serif: false}]}}
      - {tpl: line, at: "@1950-0.6", in: slide, p: {title: "Bank tellers, United States", subtitle: "census counts · two occupation classifications", beats: [{s: "counted in the U.S. census", at: "@census"}, {s: "before cash machines: the postwar boom", at: "@postwar"}],
           ylabel: "tellers", yfmt: k, xr: [1950, 1970], xticks: [1950, 1960, 1970], ymax: 300000, at: "@1950", dur: 14,
           series: [{points: [[1950, 65000], [1960, 131000]], labels: [0, 1], ltext: ["65,000", "131,000 (1960 classification)"], lpos: ["", "below"]},
                    {points: [[1960, 135000], [1970, 253000]], labels: [0, 1], ltext: ["135,000 (1970 classification)", "253,000"], at: "@newer"}],
           marks: [{x: 1960, label: "classification changes", at: "@newer"}],
           note: "1950–60: 1960 classification · 1960–70: 1970 classification — not one continuous series", noteAt: "@newer", nums: [{num: tel50}, {num: tel70}]}}

  - id: "03"
    part: HISTORY
    vo: >-
      Then came a machine built for the most repetitive part of the job. Cash machines were first installed in the United States in the 1970s.
      A machine could hand out cash, take a deposit, and report a balance, at any hour, without a person at the window.
      From the mid-1990s, banks rolled them out fast. By 2015, economist James Bessen counted more than four hundred thousand of them in the United States alone.
      You might expect the tellers to vanish. They did not.
    shots:
      - {tpl: text, at: 0, p: {beats: [{s: "a machine for the most repetitive part of the job", at: "@machine"}], lines: [{s: "1970s", px: 110, at: "@1970s", color: "#4f2a0c"}, {s: "first cash machines in the U.S.", px: 38, serif: false, at: "@installed"},
                                  {s: "mid-1990s · rapid rollout", px: 38, serif: false, at: "@mid1990s"}], src: [BES15]}}
      - {tpl: bignum, at: "@2015-0.4", in: slide, p: {title: "ATMs installed in the United States", beats: [{s: "economist James Bessen", at: "@economist"}], value: 400000, text: "400,000+", at: "@four", caption: "by 2015", icon: person, nums: [{num: atm}]}}
      - {tpl: quote, at: "@vanish-0.6", in: flip, p: {text: "The number of bank teller jobs did not decrease as the ATMs were rolled out.", who: "James Bessen", where: "IMF Finance & Development, March 2015", at: "@not", src: [BES15]}}

  - id: "04"
    part: HISTORY
    vo: >-
      Why not? Because the machine made each branch cheaper to run. Between 1988 and 2004, the number of tellers needed to operate an average urban branch
      fell from twenty to thirteen. So banks did something unexpected. They opened more branches. In urban areas, Bessen reports, forty-three percent more.
      Fewer tellers per branch, but many more branches. Bessen puts the logic simply: the ATM let banks run branch offices at lower cost,
      and that prompted them to open many more of them. A machine that saved labor at each window created demand for more windows.
    shots:
      - {tpl: bars, at: 0, p: {title: "Tellers needed per urban branch", subtitle: "average urban market", beats: [{s: "why didn't tellers vanish?", at: "@why"}, {s: "each branch became cheaper to run", at: "@cheaper"}], unit: "", max: 25,
           bars: [{label: "1988", num: br20, at: "@twenty"}, {label: "2004", num: br13, at: "@thirteen"}]}}
      - {tpl: bignum, at: "@opened-0.3", in: slide, p: {title: "Bank branches in urban areas", beats: [{s: "banks opened more branches", at: "@opened"}], value: 43, text: "+43%", suffix: "%", at: "@fortythree", caption: "more branches (Bessen)", nums: [{num: branch}]}}
      - {tpl: quote, at: "@logic-0.4", in: flip, p: {text: "The ATM allowed banks to operate branch offices at lower cost; this prompted them to open many more branches.", who: "James Bessen", where: "How Computer Automation Affects Occupations (2016)", at: "@logic", src: [BES16]}}

  - id: "05"
    part: HISTORY
    vo: >-
      And the job itself changed. Counting cash mattered less. Talking to customers mattered more. In Bessen's words, tellers became an important part of the
      relationship banking team: selling accounts, explaining loans, solving problems. In census and survey data, full-time-equivalent teller employment kept rising
      after 2000, by about two percent a year, faster than the labor force as a whole.
      Bessen's point is not that machines never cost jobs. It is that when a machine takes one task, the job can survive if people move to the tasks that are left.
      The machine did not end the job. It changed what the job was for.
    shots:
      - {tpl: quote, at: 0, p: {beats: [{s: "the job itself changed", at: "@job"}, {s: "counting cash mattered less", at: "@counting"}, {s: "talking to customers mattered more", at: "@talking"}], text: "Tellers became an important part of the 'relationship banking team.'", who: "James Bessen", where: "IMF Finance & Development, March 2015", at: "@words", src: [BES15]}}
      - {tpl: bignum, at: "@census-0.4", in: slide, p: {title: "Full-time-equivalent bank tellers, after 2000", beats: [{s: "census and survey data", at: "@survey"}], value: 2.0, text: "+2.0% a year", suffix: "% a year", d: 1, at: "@two", caption: "faster than the labor force as a whole (Bessen)", nums: [{num: fte}]}}

  - id: "06"
    part: STORY
    vo: >-
      The lamplighter crosses the square. Most of the bank's windows are dark now, but the screen by the door still glows.
      The work has moved again: from the counter, to the phone, to an app, and now to software that reads, scores, and answers.
    vo_offset: 2.5
    min_dur: 30
    tail: 1.5
    shots:
      - {tpl: street, at: 0, p: {lamps: [{x: 260}, {x: 860}, {x: 1460}, {x: 2060}], lighter: {from: 300, to: 1300, walk: [0.5, "@glows+1"]}, warm: 0.4, windows: 0.4,
                                 cam: [{t: 0, x: 0, z: 0}, {t: "@glows+1", x: -300, z: 0.05}]}}
      - {tpl: office, at: "@moved-0.4", in: fade, p: {light: "@software", cam: [{t: "@moved", x: 0, z: 0}, {t: "@answers+1.5", x: -80, z: 0.08}]}}

  - id: "07"
    part: TODAY
    vo: >-
      Today, the outlook for tellers is different. The Bureau of Labor Statistics puts their number at about three hundred thirty-nine thousand in 2025.
      It projects about two hundred ninety-five thousand by 2035, a decline of thirteen percent. The reasons it gives are familiar:
      online and mobile banking, enhanced ATMs, and video kiosks. That is a projection, not a count.
    shots:
      - {tpl: bars, at: 0, p: {title: "Bank tellers, United States", subtitle: "employment, 2025 and projected 2035", kindEach: true, beats: [{s: "the outlook for tellers today", at: "@outlook"}],
           bars: [{label: "2025", num: tel25, at: "@three"}, {label: "2035 (projected)", num: tel35, at: "@ninetyfive"}], note: "Projected change, 2025–35: −13%", noteAt: "@decline", nums: [{num: tel_chg}]}}
      - {tpl: text, at: "@reasons-0.4", in: slide, p: {beats: [{s: "the reasons BLS gives", at: "@reasons"}], lines: [{s: "online and mobile banking", px: 46, at: "@online"}, {s: "enhanced ATMs", px: 46, at: "@enhanced"},
                                                          {s: "video kiosks", px: 46, at: "@video"}, {s: "a projection, not a count", px: 34, serif: false, at: "@projection", color: "#4f2a0c"}], src: [OOHT]}}

  - id: "08"
    part: TODAY
    vo: >-
      The machines are also moving further up the counter, to the people who decide who gets credit. Loan officer jobs are projected to grow only about one percent,
      from two hundred eighty-three thousand to two hundred eighty-six thousand, as branches close and loan processing becomes more automated.
      Most firms, the BLS notes, already use underwriting software.
    shots:
      - {tpl: bars, at: 0, p: {title: "Loan officers, United States", subtitle: "employment, 2025 and projected 2035", kindEach: true, beats: [{s: "further up the counter: who gets credit", at: "@further"}],
           bars: [{label: "2025", num: lo25, at: "@eightythree"}, {label: "2035 (projected)", num: lo35, at: "@eightysix"}], note: "Most firms use underwriting software (BLS)", noteAt: "@underwriting", nums: [{num: lo_chg}]}}

  - id: "09"
    part: TODAY
    vo: >-
      Behind the loan officer sits the credit analyst, who studies the numbers behind a loan. In a 2025 article on artificial intelligence, BLS economists wrote that
      AI can synthesize large amounts of data and reach big-picture conclusions, and that these tasks are the essence of a credit rating.
      In that article's projection, an earlier one for 2023 to 2033, credit analyst jobs were set to decline three point nine percent.
      It belongs to a different projection cycle from the other numbers.
    shots:
      - {tpl: quote, at: 0, p: {beats: [{s: "behind the loan officer", at: "@behind"}, {s: "the credit analyst: the numbers behind a loan", at: "@analyst"}, {s: "BLS economists, Monthly Labor Review, 2025", at: "@article"}],
           text: "AI can synthesize large amounts of data and reach big-picture conclusions, and, indeed, these tasks are the essence of a credit rating.", who: "BLS economists", where: "Monthly Labor Review, February 2025", at: "@synthesize", src: [MLR25]}}
      - {tpl: bignum, at: "@earlier-0.4", in: slide, p: {title: "Credit analysts, earlier projection cycle 2023–33", beats: [{s: "an earlier projection: 2023 to 2033", at: "@earlier"}], value: -3.9, text: "−3.9%", suffix: "%", d: 1, at: "@nine",
           caption: "a different projection cycle from the 2025–35 numbers", nums: [{num: ca_old}]}}

  - id: "10"
    part: TODAY
    vo: >-
      Does the software actually judge credit better? Economists at the Federal Reserve Bank of Philadelphia tested a machine-learning model on U.S. credit bureau records.
      In every year from 2004 to 2019, it predicted defaults better than a traditional statistical model.
      It is a test of models, not a count of jobs. It shows the scoring is getting better. It does not show what happens to the people who did it.
    shots:
      - {tpl: text, at: 0, p: {beats: [{s: "does software judge credit better?", at: "@judge"}, {s: "Federal Reserve Bank of Philadelphia", at: "@federal"}],
           lines: [{s: "machine learning vs. a traditional model", px: 46, at: "@tested"}, {s: "U.S. credit bureau records", px: 34, serif: false, at: "@records"},
                   {s: "better default predictions, every year 2004–2019", px: 38, serif: false, at: "@every"},
                   {s: "a test of models, not a count of jobs", px: 34, serif: false, at: "@test", color: "#4f2a0c"}], src: [PF]}}

  # Đoạn 11 — Claude soạn theo câu hỏi nghề; chủ dự án duyệt nguyên văn (05/10/2026). Góc nhìn, không phải số liệu. Hình: quầy giao dịch, giao dịch viên ngẩng lên nhìn khách lo lắng (bóng 2.5D, không cận mặt).
  - id: "11"
    part: TODAY
    vo: >-
      Ask someone who has worked in banking, and the line looks like this. Machines took the routine: cash, statements, transfers.
      Models now score a loan in seconds. But a model answers one question — how risky is this? People still answer another — should we lend, and on what terms?
      And sometimes the most important thing a teller does is notice that something is wrong: a customer, nervous, sending money to a stranger.
      The machine processes the request. A person asks why.
    vo_offset: 1.0
    tail: 1.5
    shots:
      - {tpl: text, at: 0, p: {beats: [{s: "A banker's view", at: "@ask"}], lines: [{s: "A banker's view", px: 60, at: "@ask"}, {s: "a perspective, not data", px: 30, serif: false, at: "@ask", color: "#4f2a0c"},
                                                          {s: "machines: cash, statements, transfers", px: 38, serif: false, at: "@routine"}, {s: "a model: how risky is this?", px: 38, serif: false, at: "@risky"},
                                                          {s: "people: should we lend, and on what terms?", px: 38, serif: false, at: "@lend"}]}}
      - {tpl: rows, at: "@sometimes-0.4", in: fade, p: {variant: teller, rows: 1, per: 3, look: "@notice", customer: {nervous: true, at: "@customer"}, cam: [{t: "@sometimes", x: 0, z: 0.04}, {t: "@why+1.5", x: -40, z: 0.14}]}}

  - id: "12"
    part: TODAY
    vo: >-
      So here is the comparison, on the same scale: one source, one period, 2025 to 2035. Bank tellers: down about thirteen percent.
      Loan officers: up about one percent. All jobs together: up three point five percent.
      For tellers, the BLS points to online banking and machines, not to AI alone.
      Not the same technology as the ATM. The same pattern: a repetitive human task, taken over by an automated system.
      The ATM took over the cash. Software now takes on more of the paperwork and the scoring.
      But the differences matter. Back then, cheaper branches meant more branches, and more tellers. Now the BLS expects fewer branches.
      And all three of these numbers are forecasts for one decade. The ATM story is history. We set them side by side for the pattern, not for the arithmetic.
    shots:
      - {tpl: bars, at: 0, p: {title: "Projected change in employment, 2025–35", subtitle: "U.S., BLS projections", unit: '%', max: 15, d: 1, beats: [{s: "the comparison, on the same scale", at: "@comparison"}, {s: "one source, one period: 2025–35", at: "@source"}],
           bars: [{label: "bank tellers", num: tel_chg, at: "@tellers"}, {label: "loan officers", num: lo_chg, at: "@loan"}, {label: "all occupations", num: all_chg, at: "@all"}],
           note: "not the same technology — the same pattern", noteAt: "@pattern"}}
      - {tpl: text, at: "@differences-0.4", in: slide, p: {lines: [{s: "then: cheaper branches → more branches, more tellers", px: 38, serif: false, at: "@back"}, {s: "now: BLS expects fewer branches", px: 38, serif: false, at: "@fewer"},
                                                          {s: "forecasts, not counts", px: 38, serif: false, at: "@forecasts", color: "#4f2a0c"}], src: [BES15, OOHL]}}

  - id: "13"
    part: TODAY
    vo: >-
      The teller's story is the more hopeful kind. A machine took over the most repetitive task, and for decades the job grew anyway,
      because people did more of what the machine could not: advice, trust, a face at the window.
      But that came with a condition. Cheaper branches meant more branches. That condition may not hold now.
      With AI, it is an open question. It depends on whether banks create new work faster than software takes the old work away.
      That is what we will be watching.
    min_dur: 26
    shots:
      - {tpl: text, at: 0, p: {align: left, lh: 92, lines: [{s: "The more hopeful case", px: 64, at: "@hopeful"}, {s: "The ATM took the cash; the job grew anyway.", px: 34, serif: false, at: "@grew"},
                                                         {s: "People did what the machine could not.", px: 34, serif: false, at: "@people"}, {s: "The condition: more branches. Not now.", px: 34, serif: false, at: "@condition"}, {s: "With AI: an open question.", px: 34, serif: false, at: "@open"}], src: [BES15, OOHT]}}
      - {tpl: office, at: "@watching-1.5", in: fade, p: {light: "@watching", cam: [{t: "@watching-1.5", x: 0, z: 0}, {t: "@watching+4", x: -90, z: 0.06}]}}

  - id: "14"
    part: STORY
    vo: >-
      Back on the corner, the lamplighter reaches the last post. The glass opens, the flame takes. Across the street, the little screen glows, patient as ever.
      Every era has its last lamplighters. Some of them stood behind a bank window, and many still do.
    vo_offset: 3.0
    min_dur: 34
    tail: 2.0
    shots:
