shorts:
  - id: S1
    hook: "The ATM didn't kill the bank teller"
    vo: >-
      When cash machines spread across America, everyone expected bank tellers to disappear. They did not. Economist James Bessen found that between 1988 and 2004,
      an average urban branch needed fewer tellers, twenty down to thirteen. But branches got cheaper to run, so banks opened more of them. Fewer tellers per branch, more branches,
      and a new job: talking to customers instead of counting cash.
    shots:
      - {tpl: rows, at: 0, p: {variant: teller, rows: 1, per: 4, screen: "@machines", screenLabel: "ATM"}}
      - {tpl: text, at: "@everyone-0.3", in: slide, p: {lines: [{s: "everyone expected tellers", px: 56, at: "@everyone"}, {s: "to disappear", px: 56, at: "@disappear"}, {s: "they did not", px: 64, at: "@did"}], src: [BES15]}}
      - {tpl: bars, at: "@economist-0.3", in: slide, p: {title: "Tellers per urban branch", beats: [{s: "economist James Bessen", at: "@economist"}, {s: "1988 → 2004", at: "@1988"}, {s: "an average urban branch", at: "@average"}], unit: "", max: 25,
           bars: [{label: "1988", num: br20, at: "@twenty"}, {label: "2004", num: br13, at: "@thirteen"}]}}
      - {tpl: text, at: "@branches-0.3", in: flip, p: {lines: [{s: "cheaper to run", px: 56, at: "@cheaper"}, {s: "more branches", px: 56, at: "@opened"}, {s: "fewer tellers per branch", px: 44, at: "@fewer#2"}, {s: "a new job:", px: 48, at: "@new"},
                                                          {s: "talking to customers", px: 48, at: "@talking"}, {s: "not counting cash", px: 48, at: "@counting"}], src: [BES15]}}
  - id: S2
    hook: "Bank tellers: 13% fewer by 2035?"
    vo: >-
      In 2025, about three hundred thirty-nine thousand Americans worked as bank tellers. The Bureau of Labor Statistics projects about two hundred ninety-five thousand by 2035,
      a decline of thirteen percent. Its reasons: online and mobile banking, enhanced ATMs, video kiosks. It is a projection, not a count.
    shots:
      - {tpl: bars, at: 0, p: {title: "Bank tellers, U.S.", beats: [{s: "2025", at: "@2025"}, {s: "Americans working as bank tellers", at: "@americans"}, {s: "Bureau of Labor Statistics", at: "@bureau"}, {s: "BLS projects", at: "@projects"}, {s: "by 2035", at: "@2035"}, {s: "a decline of 13%", at: "@decline"}],
           kindEach: true, bars: [{label: "2025", num: tel25, at: "@three"}, {label: "2035\n(projected)", num: tel35, at: "@ninetyfive"}]}}
      - {tpl: text, at: "@reasons-0.3", in: slide, p: {lines: [{s: "online and mobile banking", px: 52, at: "@online"}, {s: "enhanced ATMs", px: 52, at: "@enhanced"}, {s: "video kiosks", px: 52, at: "@video"},
                                                          {s: "a projection,", px: 42, at: "@projection"}, {s: "not a count", px: 42, at: "@count"}], src: [OOHT]}}
  - id: S3
    hook: "AI and the essence of a credit rating"
    vo: >-
      What does AI change inside a bank? In 2025, economists at the Bureau of Labor Statistics wrote that AI can synthesize large amounts of data and reach big-picture conclusions,
      and that these tasks are the essence of a credit rating. In that projection, credit analyst jobs were set to decline three point nine percent from 2023 to 2033.
    shots:
      - {tpl: text, at: 0, p: {lines: [{s: "What does AI change", px: 60, at: "@what"}, {s: "inside a bank?", px: 60, at: "@inside"}, {s: "BLS economists, 2025", px: 44, at: "@economists"}], src: [MLR25]}}
      - {tpl: quote, at: "@synthesize-0.4", in: slide, p: {beats: [{s: "large amounts of data", at: "@large"}, {s: "big-picture conclusions", at: "@bigpicture"}], text: "AI can synthesize large amounts of data and reach big-picture conclusions…", who: "BLS economists", at: "@synthesize", src: [MLR25]}}
      - {tpl: quote, at: "@these-0.4", in: flip, p: {beats: [{s: "the essence of a credit rating", at: "@essence"}], text: "…these tasks are the essence of a credit rating.", who: "Monthly Labor Review, Feb 2025", at: "@these", src: [MLR25]}}
      - {tpl: bignum, at: "@projection-0.3", in: slide, p: {title: "Credit analysts", beats: [{s: "credit analyst jobs", at: "@analyst"}, {s: "2023–33 projection cycle", at: "@2023"}], value: -3.9, text: "−3.9%", suffix: "%", d: 1, at: "@nine", caption: "projected decline (2023–33)", nums: [{num: ca_old}]}}
