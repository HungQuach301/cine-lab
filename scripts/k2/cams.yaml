# KÊNH 2 · THƯ VIỆN GÓC MÁY (chống lặp, chủ dự án 12/10/2026). Dùng trong đặc tả tập: heroes.<khoá>.cam: <preset> → camera_id = <preset>.
# Luật (scripts/k2/prep.py): cùng (scene_id, camera_id) tối đa 2 shot/tập; vượt → dừng trước khi thu giọng. Biến thể rẻ = cùng cảnh, khác preset.
# - module k2v (map, chart3d, photo): preset tính trong module theo khung nội dung (module: true; opt.preset), xem design/k2v/*.js.
# - cảnh Steel (k2g01/*): toạ độ tuyệt đối; 'src' ghi nguồn. Biến thể 'orbit-*', 'high-wide', 'low-close', 'tele' sinh tự động bằng quay quanh điểm nhìn của 'default'
#   và đã rà tờ khung (channel-k2/k2v-mau/cams/<cảnh>.jpg) — preset có 'loai: true' là bị loại khi rà (lộ mép cảnh/xuyên vật thể), không dùng.
map/globe:
  orbit:
    module: true
    note: quả địa cầu xoay chậm quanh opt.focus (toàn cầu)
  flyto:
    module: true
    note: toàn cầu → bay xuống opt.focus (tầm thành phố, nghiêng 32°)
  pullback:
    module: true
    note: từ opt.focus kéo lên toàn cầu
  tilt-low:
    module: true
    note: xiên thấp 50–54° trên opt.focus, quét nhẹ hướng
  top:
    module: true
    note: nhìn thẳng xuống, trôi ngang
  pan:
    module: true
    note: lia ngang dọc vĩ tuyến qua opt.focus
  pair:
    module: true
    note: opt.from → cung → opt.to (shot mẫu A)
chart3d/stack:
  front-dolly:
    module: true
    note: chính diện, tiến chậm
  crane-up:
    module: true
    note: thấp sát cột đầu → cẩu lên lộ toàn chiều cao (shot mẫu B)
  low-hero:
    module: true
    note: góc thấp 24 mm, cột vươn cao
  orbit-l:
    module: true
    note: quay quanh từ trái
  orbit-r:
    module: true
    note: quay quanh từ phải
  top-down:
    module: true
    note: từ trên cao nhìn xuống
  side-track:
