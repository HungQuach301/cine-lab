    hook: "1950 vs. 2025: why is steel guarded like a weapon?"
    vo: >-
      In 1950, America made about eighty-eight million tonnes of steel — almost half the world's. In 2025: about eighty-two million. Just about four percent.
      So why is steel now guarded like a weapon? Our answer: because steel power was never only about tonnage. It was about share, and about control of the path.
