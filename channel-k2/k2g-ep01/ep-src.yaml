           {a: pile1, s: "2025 · U.S. 81.9 Mt", sub: "≈ 4% of world steel", at: "@four", dy: -260, num: share25}], cap: [{s: "1 bar = 10 Mt · orange = U.S.", at: 0.3, src: [USGS, WSIF]}]}}
