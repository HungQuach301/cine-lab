           items: [{s: "It was about share", at: "@share"}, {s: "and about control of the path", at: "@control"}]}}}
  - id: S2
    hook: "Does Washington now own U.S. Steel?"
    vo: >-
      A popular claim worth checking: that the golden share means Washington now owns U.S. Steel. The companies' own announcement describes something narrower.
      The share lets the government appoint one independent director, and gives the president consent rights over specific decisions, including cutting investment commitments in the agreement,
      changing the name or headquarters, moving production or jobs abroad, and certain plant closures or idlings. The full agreement has not been made public.
    shots:
