# K2G-01 "Steel" — ĐẶC TẢ NGUỒN (sửa ở đây; make_spec.py ghép lời khoá v3.7 nguyên văn từ vo-skel.yaml → episode.yaml).
# Một mẫu `plate` (scripts/k2/lib/k2.js): nền cảnh 3D (rõ) + nhãn bám vật thể (labels) + dải chú thích (cap) + tựa (title); hoặc thẻ số (card) trên nền cảnh 3D mờ.
# Luật đa dạng bối cảnh (chủ dự án 11/10): bối cảnh = cảnh 3D nền (kể cả nền mờ của thẻ); không bối cảnh nào > 25 % hay > 90 s liên tục; nửa sau ≥ 3 bối cảnh.
# Số neo đoạn 07, 08, 10 mỗi số một khung riêng; số phụ lên hình. "@từ" trong opt cảnh 3D = giây trong cảnh (scripts/k2/prep.py).
