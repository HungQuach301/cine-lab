# KÊNH 2 · cuộn shot mẫu K2V2 (phiên V2, 14/10/2026) — đề tài trung tính: kênh Erie (NY) và Main Line (PA), 1825–1834. Số có nguồn công khai: claims.md cạnh tệp này.
# Dựng: scripts/k2/vshot.py channel-k2/k2v2-mau/K2V2-reel.yaml [--draft] [--spp 4]. Kiểm: checks/ll/q_types.py (Q33/Q34), q_scene.py, q_footage.py
id: k2v2-reel
title: K2V2 sample reel
out: /var/tmp/cine-out/k2v-shots/K2V2-reel
heroes:
  h_hook:
    hero: relief/map
    opt:
      relief: erie
      sepia: [7.0, 9.0]
      regions:
      - {id: ny, state: New York, color: '#3CC2B0', at: [9.2, 10.4], lift: 12, fill: 0.42}
      - {id: pa, state: Pennsylvania, color: '#F2C14E', at: [9.7, 10.9], lift: 12, fill: 0.42}
      routes:
      - {id: valley, pts: [{src: mohawk, from: rome, to: troy}], draw: [3.3, 5.6], out: 8.4, style: solid, color: '#ffe6b0', w: 12}
      - {id: erie, pts: [buffalo, {src: erie, from: buffalo, to: montezuma}, syracuse, rome, {src: mohawk, from: rome, to: troy}, albany], draw: [10.4, 13.6], style: dashed, color: '#F08A4B', w: 7}
      - {id: hudson, pts: [albany, {src: hudson, from: albany, to: nyc}, nyc], draw: [13.4, 14.8], style: dashed, color: '#F08A4B', w: 6}
      rings:
      - {id: gap, at: littlefalls, t: 3.4, out: 7.4, color: '#ffe6b0', px: 150}
      - {id: buf, at: buffalo, t: 10.3}
      - {id: alb, at: albany, t: 13.4}
      places: [littlefalls, buffalo, albany, nyc]
      cam:
      - {t: 0, lon: -75.9, lat: 41.9, dist: 560, tilt: 26, head: -4}
      - {t: 5, lon: -74.95, lat: 42.78, dist: 330, tilt: 34, head: 4}
      - {t: 9.5, lon: -76.1, lat: 42.5, dist: 500, tilt: 30, head: 0}
      - {t: 15, lon: -75.7, lat: 42.1, dist: 560, tilt: 28, head: -2}
  h_trip:
    hero: relief/map
    opt:
      relief: erie
      palette: sepia
      regions:
      - {id: ny, state: New York, color: '#3CC2B0', at: -1, lift: 12, fill: 0.38}
      routes:
      - {id: erie, pts: [buffalo, {src: erie, from: buffalo, to: montezuma}, syracuse, rome, {src: mohawk, from: rome, to: troy}, albany], draw: -1, style: solid, color: '#F08A4B', w: 6}
      places: [buffalo, rochester, albany]
      pins:
      - {id: sack, at: buffalo, dx: -6, dz: 6}
      - {id: farm, at: [-77.75, 42.9]}
      - {id: town, at: albany, dx: 8, dz: 6}
      walkers:
      - {id: boat, route: erie, t: [0.4, 9.6], u: [0.0, 0.955]}
      - {id: crew, route: erie, t: [0.4, 9.6], u: [0.03, 0.985]}
      cam:
      - {t: 0, lon: -78.55, lat: 42.55, dist: 250, tilt: 40, head: 6}
      - {t: 3.4, lon: -77.3, lat: 42.65, dist: 260, tilt: 40, head: 4}
      - {t: 6.6, lon: -75.7, lat: 42.7, dist: 260, tilt: 40, head: 2}
      - {t: 10, lon: -74.2, lat: 42.4, dist: 270, tilt: 40, head: 0}
  h_num:
    hero: relief/map
    opt:
      relief: erie
      palette: sepia
      regions:
      - {id: ny, state: New York, color: '#3CC2B0', at: -1, lift: 3, fill: 0.3}
      places: [buffalo]
      cols:
      - {id: wagon, at: [-78.42, 42.80], kind: coins, n: 10, t: [0.6, 2.8], r: 8}
      - {id: canal, at: [-78.02, 42.84], kind: coins, n: 1, t: [3.5, 3.6], r: 8}
      pins:
      - {id: wagon, at: [-78.62, 42.74]}
      - {id: boat, at: [-77.86, 42.92]}
      cam:
      - {t: 0, lon: -78.3, lat: 42.66, dist: 135, tilt: 46, head: 2}
      - {t: 8, lon: -78.2, lat: 42.72, dist: 115, tilt: 50, head: 8}
  h_clin:
    hero: photo/print
    opt: {img: /assets/k2/archive/met-11602-clinton.jpg, focus: [0.5, 0.27], push: 0.2}
  h_score:
    hero: relief/map
    opt:
      relief: erie
      palette: sepia
      regions:
      - {id: ny, state: New York, color: '#3CC2B0', at: -1, lift: 12, fill: 0.42}
      - {id: pa, state: Pennsylvania, color: '#F2C14E', at: -1, lift: 12, fill: 0.42}
      routes:
      - {id: erie, pts: [buffalo, {src: erie, from: buffalo, to: montezuma}, syracuse, rome, {src: mohawk, from: rome, to: troy}, albany], draw: -1, style: solid, color: '#3CC2B0', w: 6}
      - {id: main, pts: [philadelphia, columbia-pa, harrisburg, hollidaysburg, johnstown, pittsburgh], draw: -1, style: dashed, color: '#F2C14E', w: 6, smooth: 1}
      cam:
      - {t: 0, lon: -76.9, lat: 41.4, dist: 600, tilt: 22, head: -2}
      - {t: 6, lon: -76.5, lat: 41.6, dist: 570, tilt: 25, head: 2}
places: [Mohawk Valley, Buffalo, Albany, New York]
people:
- {name: DeWitt Clinton, photo: MET-11602}
anchors: [wagon_cost, canal_tenth]
segments:
- id: H
  part: HOOK
  dur: 15
  shots:
  - tpl: plate
    at: 0
    type: map
    scene_id: relief/map
    camera_id: relief-hook-glide
    places: [littlefalls, buffalo, albany, nyc]
    p:
      hero: h_hook
      places:
      - {a: littlefalls, s: Mohawk Valley, at: 3.6, out: 7.4, side: auto, c: '#ffe6b0'}
      - {a: buffalo, s: Buffalo, at: 10.5, side: left, c: '#F08A4B'}
      - {a: albany, s: Albany, at: 13.4, side: auto, c: '#F08A4B'}
      - {a: nyc, s: New York, at: 14.3, side: right, c: '#F08A4B'}
      cap:
      - {s: 'The Mohawk Valley: a low path from the Great Lakes to the Hudson', at: 1.2}
      - {s: '1825: New York opens the Erie Canal, 363 miles from Buffalo to Albany', at: 9.8}
      src: 'Sources: Library of Congress · NPS · Erie Canalway NHC · Terrain: USGS 3DEP · Map: Natural Earth'
      asof: '1825'
      asofAt: 8.4
- id: J
  part: BODY
  dur: 10
  shots:
  - tpl: plate
    at: 0
    type: map
    scene_id: relief/map
    camera_id: relief-route-follow
    places: [buffalo, rochester, albany]
    p:
      hero: h_trip
      stickers:
      - {a: 'st:sack', img: 'stk:sack', at: 0.3, out: 4.0, px: 130}
      - {a: 'st:farm', img: {role: farmer, hand: wheat}, at: 2.3, px: 170}
      - {a: 'st:boat', img: 'stk:boat', at: 0.5, px: 130, walk: true, hz: 1.2, face: right}
      - {a: 'st:crew', img: {role: sailor, hand: rope}, at: 0.7, px: 160, walk: true}
      - {a: 'st:town', img: {role: merchant}, at: 8.2, px: 170}
      places:
      - {a: buffalo, s: Buffalo, at: 0.3, out: 3.2, side: auto, c: '#F08A4B'}
      - {a: rochester, s: Genesee Valley, at: 2.4, out: 6.0, side: auto, c: '#F08A4B'}
      - {a: albany, s: Albany, at: 8.0, side: auto, c: '#F08A4B'}
      cap:
      - {s: 'Wheat from the Genesee Valley could now float east to Albany, then down the Hudson', at: 1.0}
      src: 'Source: Erie Canalway National Heritage Corridor · Terrain: USGS 3DEP · Map: Natural Earth'
- id: N
  part: BODY
  dur: 8
  shots:
  - tpl: plate
    at: 0
    type: map
    scene_id: relief/map
    camera_id: relief-num-push
    places: [buffalo]
    p:
      hero: h_num
      stickers:
      - {a: 'st:wagon', img: 'stk:wagon', at: 0.3, px: 160}
      - {a: 'st:boat', img: 'stk:boat', at: 3.3, px: 150}
      tags:
      - {a: 'col:wagon', s: '$90–125', sub: 'a ton, Buffalo to New York, by wagon', big: true, kind: actual, at: 2.2, side: auto, prefer: [left, up, right], c: '#F2C14E', num: wagon_cost}
      - {a: 'col:canal', s: '1/10', sub: 'of the old cost, once wheat went by canal', big: true, kind: actual, at: 4.1, side: auto, prefer: [right, up, left], c: '#3CC2B0', num: canal_tenth}
      src: 'Sources: NYS Archives Partnership Trust · Erie Canalway NHC · One coin = one tenth of the wagon cost'
- id: P
  part: BODY
  dur: 5
  shots:
  - tpl: plate
    at: 0
    type: photo
    scene_id: photo/print
    camera_id: kenburns-push
    people: [DeWitt Clinton]
    p:
      hero: h_clin
      photo: MET-11602
      cap:
      - {s: 'DeWitt Clinton, Governor of New York · painted 1826', at: 0.5}
      src: 'Painting: Samuel F. B. Morse, 1826 · The Metropolitan Museum of Art, Open Access (public domain)'
- id: S
  part: BODY
  dur: 6
  shots:
  - tpl: plate
    at: 0
    type: map
    scene_id: relief/map
    camera_id: relief-score-drift
    p:
      hero: h_score
      dim: 0.42
      score:
        corner:
          at: 0.2
          sides:
          - {s: New York, c: '#3CC2B0', icon: 'stk:boat', n: [{t: 0, v: 0}, {t: 0.85, v: 1}, {t: 1.65, v: 2}, {t: 2.05, v: 3}]}
          - {s: Pennsylvania, c: '#F2C14E', icon: 'stk:wagon', n: 0}
        board:
          at: 0.3
          title: Two routes west
          sides:
          - {s: Erie Canal, c: '#3CC2B0', icon: 'stk:boat'}
          - {s: Main Line, c: '#F2C14E', icon: 'stk:wagon'}
          rows:
          - {k: Opened, icon: 'stk:document', v: ['1825', '1834'], win: 0, at: 0.65}
          - {k: Length, icon: 'stk:flag', v: ['363 mi', '394 mi'], at: 1.05}
          - {k: Climb from the start, icon: 'stk:mountain', v: ['568 ft', '2,102 ft'], win: 0, at: 1.45}
          - {k: Cost to build, icon: 'stk:coins', v: ['$7.1M', '$16.5M'], win: 0, at: 1.85}
          foot: 'Sources: NPS Allegheny Portage Railroad NHS · Erie Canalway NHC'
numbers:
  wagon_cost: {v: 90, text: '$90–125', kind: actual, year: 1825, unit: '$/ton', src: NYSAPT, say: ninety to one hundred twenty-five dollars}
  canal_tenth: {v: 0.1, text: '1/10', kind: actual, year: 1825, unit: ratio, src: ECNHC-NS, say: a tenth}
sources:
  NYSAPT: {short: 'NYS Archives Partnership Trust, "Canal at Work"', url: 'https://www.nysarchivestrust.org/exhibits/erie-canal/canal-work'}
  ECNHC-NS: {short: 'Erie Canalway NHC, National Significance', url: 'https://eriecanalway.org/application/files/9814/5133/0135/07-2_National_Significance_Final.pdf'}
  ECNHC-FF: {short: 'Erie Canalway NHC, Fast Facts', url: 'https://eriecanalway.org/learn/history-culture/fast-facts'}
  NPS-ALPO: {short: 'NPS, Allegheny Portage Railroad NHS', url: 'https://www.nps.gov/alpo/learn/historyculture/allegheny-portage-railroad.htm'}
  NPS-ALPO-ML: {short: 'NPS, Pennsylvania Main Line Canal', url: 'https://www.nps.gov/alpo/learn/historyculture/pennsylvania-main-line-canal.htm'}
  LOC: {short: 'Library of Congress, Opening of the Erie Canal', url: 'https://guides.loc.gov/this-month-in-business-history/october/opening-erie-canal'}
