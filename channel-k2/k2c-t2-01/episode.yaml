- id: '06'
  part: END
  vo: 'So, what to watch. November ninth, 2026: whether the fee pause is extended or runs out as the notice sets. Philadelphia: whether the announced investment shows up as new capacity. And June 2030:
    the delivery date Military Times reported for the first of those ships. The scoreboard. 1943, at the peak: three Liberty ships launched a day. A 2023 congressional report: around five new ships a year.
    Different ships, different eras. Our read of the record: America didn''t forget how to build ships. Since the 1980s, it has built few because few orders came — and the record ties high prices to fewer
    domestic purchases, and the lack of exports to missing economies of scale. No source we found measures how much each factor counts. If you''re finding this useful, subscribing is how you''ll catch the
    next one. Back in Richmond, Kaiser''s Shipyard Number Three is now part of a national park. Next time: why one country makes almost all the world''s shipping containers.'
