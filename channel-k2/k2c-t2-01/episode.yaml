- id: '04'
  part: CH4
  vo: 'In 1962, South Korea''s output was about a hundred and seven dollars per person, in that year''s dollars. Chung Ju-yung had built Hyundai as a construction company. When he decided to go into shipbuilding
    in the early 1970s, by the company''s own account Hyundai had "no experience, capital, or shipbuilding technology whatsoever." By Hyundai''s account, while the shipyard was still being planned, a Greek
    shipowner, George Livanos, ordered two crude oil tankers. So, by that account, an order from a foreign owner came before the yard existed. A 2010 Korea Times column adds a story. Chung went abroad carrying
    a photo of the empty beach and a 500-won banknote showing a turtle ship, a warship from Korea''s history. We found no documents for it, so treat it as lore: one columnist''s account, not a record. Hyundai''s
    own history says ground was broken in March 1972 on that beach in Ulsan, for what it calls the world''s largest shipyard. By the company''s account, it completed the shipyard and two supertankers, the
    Atlantic Baron and the Atlantic Baroness, at the same time, in 1974. Meanwhile, the government set its own targets. In January 1973, President Park Chung Hee announced a drive for heavy industry, naming
    shipbuilding, with exports as the goal. Munseob Lee, writing for the Korea Economic Institute of America in 2023, lists the support: tax incentives, subsidized long-term loans, and industrial complexes
    built by the government. Our read: from the start, this yard''s customers were abroad. In 2025, South Korea''s output was about thirty-six thousand dollars per person, again in that year''s dollars,
    not adjusted for inflation. The sources we used don''t measure how much of that rise came from shipbuilding.'
