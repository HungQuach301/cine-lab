- id: '02'
  part: CH2
  vo: 'In 1944, the Liberty program was cut back. After April, no more Liberty contracts were let. America already had a different kind of customer, written into law in 1920. Back then, American shippers
    were sending Alaska cargo by rail to Vancouver, Canada, and on by foreign ships. Senator Wesley Jones of Washington, chair of the Commerce Committee, sought to stop that by requiring Alaska-bound cargo
    to move through the Port of Seattle. The cargo rule in that act, Section 27, is known as the Jones Act: a ship carrying cargo between two American ports must be American-built, and owned and crewed
    by Americans. Congress''s researchers say it gives American shipyards "a significant degree of protection." The American Maritime Partnership, a coalition of supporters, puts its case in its headline:
    "American Jobs. American Security." Critics, like Senator Mike Lee and Representative Tom McClintock, who introduced a bill on June twelfth, 2025, to repeal it, say its costs mean "higher prices for
    Americans." There was also a federal subsidy, the Construction Differential Subsidy, meant to let American owners buy American ships at the world price. In the 1970s, American yards built about five
    percent of the world''s tonnage: fifteen to twenty-five new ships a year. The subsidy ended in the 1980s, and Congress''s researchers note that some observers see that as the main reason fewer ships
    were built. Output fell to around five a year, which a 2023 congressional report calls the current rate.'
