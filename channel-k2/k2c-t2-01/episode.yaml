- id: '05'
  part: CH5
  vo: 'Which brings us to the present. In March 2024, five American labor unions, including the steelworkers and the boilermakers, petitioned the U.S. Trade Representative over China''s shipbuilding. Congress''s
    researchers summarize the Trade Representative''s findings: Chinese government plans set production and market-share targets, backed by subsidies and state financing. And in 2025, ninety percent of
    the ships Chinese shipbuilders made were for export. In January 2025, the Trade Representative found that China''s "targeted dominance" in these sectors was "unreasonable" and "burdens or restricts
    U.S. commerce." Then came the fees. From October 2025, ships owned or operated by Chinese companies, and ships built in China, owed a fee on their U.S. voyages, based mostly on the ship''s size, up
    to five times a year. The stated aim: to discourage the use and purchase of Chinese-built ships, and to press China to drop the practices the Trade Representative had found. China''s Ministry of Commerce
    had already objected: in February 2025, responding to the proposed measures, a spokesperson said they would "fail to revitalize" American shipbuilding and raise shipping costs. Within a month, "in light
    of" a trade deal between President Trump and President Xi, the notice says, the Trade Representative suspended them through November ninth, 2026. In September, a letter from more than two hundred trade
    groups, by our count of its signatories, asked for the suspension to be extended. Resuming the fees, they wrote, "would add another cost layer to an already strained transportation system." As of October
    fifteenth, 2026, no extension had been published. And Philadelphia. According to Korea JoongAng Daily, Hanwha, a South Korean group, bought the shipyard for a hundred million dollars in December 2024.
    In August 2025, it announced five billion dollars of investment, with a goal of raising output from one and a half ships a year to twenty. That''s an announced goal; the article gives no date for reaching
    it. As of October fifteenth, 2026: in July, Military Times reported the Philadelphia yard had been tapped to build two missile-tracking ships for the Pentagon, the first slated for June 2030. Our read:
    the pattern again, an order. This time it came after the investment was announced, and before any report we found of the new capacity being finished.'
