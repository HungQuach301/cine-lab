segments:
- id: '00'
  part: HOOK
  vo: 'In 1943, at the peak, America launched three cargo ships a day. In a 2026 report, Congress''s researchers put America''s share of world shipbuilding tonnage at 0.04 percent. China''s, in 2024: more
    than half. And the company that has announced plans to expand a Philadelphia shipyard is South Korean. So why does America build so few ships? You''ll often hear: wages. The record says something narrower.
    And there''s a deadline in this story: November ninth, 2026.'
