- id: '03'
  part: CH3
  vo: 'Now the answer you''ll often hear: American shipyards lost because American workers cost too much. The cost gap goes back at least to 1922, when a government report put American-built ships at twenty
    percent more than foreign ones. By the 1950s, double. By the 1990s, three times. In 2019, Congress''s researchers cited one consulting firm''s estimate for one ship type: an American-built tanker, at
    about four times the global price of a similar vessel. A 2023 report from Congress''s researchers lists wages, especially for welders, among the factors behind higher prices. Then it adds one more:
    without exports, American shipyards can''t reach economies of scale — the savings that come from building many of the same thing. Our read: the protected home market is small. A 2019 congressional report
    counted ninety-nine oceangoing ships in the Jones Act fleet as of March 2018. At home, the 2023 report adds, high prices hold buyers back wherever a truck, a train or a pipeline can do the job. Our
    read: put those together and you get a loop. High prices mean few orders. Few orders mean no scale. No scale keeps prices high. The pieces come from the record; the loop is our interpretation. Our emphasis
    on scale is a position the evidence only partly supports.'
