- id: '01'
  part: CH1
  vo: 'Start in Richmond, California, in December 1940, when Henry J. Kaiser started his first Richmond shipyard. What allowed it to grow, the Park Service says, were orders: ships for the British government,
    already at war. The Liberty was a slow cargo ship, designed as an emergency answer to a shortage of cargo ships. In June 1942, a Liberty ship took a hundred and twenty-two days, on average. By December
    1943, thirty-nine. As a publicity stunt, one Richmond yard built the Robert E. Peary in four days and fifteen and a half hours. In 1943, a government photographer pictured one of the people building
    Liberty ships in Richmond: Josie Lucille Owens, a welder trainee, helping build the Liberty ship George Washington Carver. The four Richmond yards produced 747 ships, more than any other shipyard complex
    in the country. Richmond grew from fewer than twenty-four thousand people in 1940 to nearly a hundred thousand by 1943. Our read: notice who the customers were. The British government, and America''s
    own Maritime Commission. Governments, in wartime.'
