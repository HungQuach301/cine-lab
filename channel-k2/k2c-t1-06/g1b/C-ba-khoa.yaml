# K2C-T1-06 · G1b shot mẫu C — ba khoá + kết quả (đoạn 03, 04, 06, 08): lô nhỏ và chỗ đỗ, cầu thang (tầng 4 = NP), vạch "4" của ngân hàng, sa bàn hai đầu 1972 → 2025.
# Phiên P, 13/10/2026. Dựng: scripts/k2/vshot.py channel-k2/k2c-t1-06/g1b/C-ba-khoa.yaml --spp 4. Kiểm: checks/ll/q_types.py, q_scene.py, q_footage.py trên <out>/timeline.json
id: k2c106-g1b-c
title: K2C-T1-06 G1b sample C (locks)
out: /var/tmp/cine-out/k2c106-g1b/C-ba-khoa
heroes:
  c_lot:    {hero: k2c106/lot, cam: plan, opt: {preset: plan, stalls: 10, grow: [0.6, 4.2]}}
  c_stairs: {hero: k2c106/stairs, cam: elev_stack, opt: {preset: elev_stack, mode: one, floors: 4, stackAt: [0.3, 0.55], np: [3.4, 4.0]}}
  c_bank:   {hero: k2c106/bank, cam: fifth_block, opt: {preset: fifth_block, fifth: [2.4, 4.2]}}
  c_ends:   {hero: k2c106/ends, cam: wide_1972, opt: {preset: wide_1972, year: 1972, year1: 2025, yearAt: [1.2, 4.8]}}
places: []
people: []
anchors: [c14, c15, c26]
segments:
- id: C
  part: BODY
  dur: 24
  shots:
  - tpl: plate
    at: 0
    type: scene3d
    scene_id: k2c106/lot
    camera_id: plan
    places: []
    people: []
    p:
      hero: c_lot
      tags:
      - {a: parking, s: 2 spaces per home, sub: 'most common parking rule, Colorado', at: 2.6, side: right, gap: 60, c: '#F08A4B', num: c14}
      cap:
      - {s: 'On a small lot, parking takes room from the building (illustration)', at: 0.5}
      src: 'Source: National Zoning Atlas, Zoning Report: Colorado (2025) · 3D illustration, not to scale'
  - tpl: plate
    at: 5
    in: cut
    type: scene3d
    scene_id: k2c106/stairs
    camera_id: elev_stack
    places: []
    people: []
    p:
      hero: c_stairs
      tags:
      - {a: core1, s: One staircase, sub: 'up to the 3rd story, ≤4 homes per floor', at: 6.6, out: 8.2, side: right, c: '#3CC2B0', num: c15}
      - {a: np, s: '4th story: NP', sub: not permitted on one stair, at: 8.5, side: right, c: '#E0564B', num: c15}
      cap:
      - {s: 'Model code, 2021 edition (as reprinted in Seattle’s 2021 code)', at: 5.3}
      asof: Facts as of 12 Oct 2026
      asofAt: 5.3
      src: 'Source: Seattle Building Code 2021 (IBC 2021 text), Table 1006.3.4(1) · 3D illustration'
  - tpl: plate
    at: 11
    in: cut
    type: scene3d
    scene_id: k2c106/bank
    camera_id: fifth_block
    places: []
    people: []
    p:
      hero: c_bank
      tags:
      - {a: line, s: '4', sub: 'single-family = 1–4 homes', big: true, kind: actual, at: 11.6, side: left, gap: 70, c: '#F08A4B', num: c26}
      - {a: s5, s: 5+ homes, sub: multifamily, at: 14.2, side: right, gap: 50, c: '#9AA7B5', num: c26}
      cap:
      - {s: 'In housing finance, one number draws a line: four', at: 11.3}
      asof: Facts as of 12 Oct 2026
      asofAt: 11.3
      src: 'Source: 12 CFR §1282.1 (FHFA housing-goals regulation) · 3D illustration'
  - tpl: plate
    at: 17.5
    in: cut
    type: scene3d
    scene_id: k2c106/ends
    camera_id: wide_1972
    places: []
    people: []
    p:
      hero: c_ends
      tags:
      - {a: houses, s: Houses, at: 18.0, side: up, c: '#3CC2B0'}
      - {a: small, s: Small buildings, at: 18.4, side: up, c: '#F2C14E'}
      - {a: big, s: 50+ units, at: 18.8, side: up, c: '#F08A4B'}
      cap:
      - {s: '1972 → 2025: new construction moved toward the two ends', at: 17.8}
      src: 'Sources: Census New Residential Construction · Census Characteristics of New Housing · our read; 3D illustration, not to scale'
numbers:
  c14: {v: 2, text: 2 spaces per home, kind: actual, year: 2025, unit: spaces, src: NZACO, say: two spaces for every home}
  c15: {v: 3, text: up to the third story, kind: actual, year: 2021, unit: stories, src: IBCSEA, say: up to the third story}
  c26: {v: 4, text: 1–4 homes, kind: actual, year: 2026, unit: homes, src: CFR1282, say: four}
sources:
  NZACO: {short: 'National Zoning Atlas, Zoning Report: Colorado (2025)', url: 'https://www.zoningatlas.org/s/Colorado-Report-Updated-a32l.pdf'}
  IBCSEA: {short: 'Seattle Building Code 2021, Chapter 10', url: 'https://www.seattle.gov/documents/Departments/SDCI/Codes/SeattleBuildingCode/2021SBCChapter10.pdf'}
  CFR1282: {short: '12 CFR §1282.1 (FHFA)', url: 'https://www.ecfr.gov/current/title-12/chapter-XII/subchapter-E/part-1282/subpart-A/section-1282.1'}
