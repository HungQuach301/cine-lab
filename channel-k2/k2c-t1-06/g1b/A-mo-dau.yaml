# K2C-T1-06 · G1b shot mẫu A — mở đầu (đoạn 00–01): toà góc phố chạng vạng, biểu đồ hook, đẩy vào mặt tiền + câu hỏi, dãy phố "họ hàng", mặt cắt một cầu thang.
# Phiên P, 13/10/2026. Dựng: scripts/k2/vshot.py channel-k2/k2c-t1-06/g1b/A-mo-dau.yaml --spp 4. Kiểm: checks/ll/q_types.py, q_scene.py, q_footage.py trên <out>/timeline.json
# Mốc thời gian trong opt = giây trong cảnh (tính từ đầu shot); trong p = giây trong đoạn. Số trên hình khớp claims.md (C01, C02).
id: k2c106-g1b-a
title: K2C-T1-06 G1b sample A (hook)
out: /var/tmp/cine-out/k2c106-g1b/A-mo-dau
heroes:
