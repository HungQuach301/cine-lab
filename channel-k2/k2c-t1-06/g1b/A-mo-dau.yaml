    hero: chart3d/bars
    cam: front-dolly
    opt:
      preset: front-dolly
      scale: 0.8
      w: 2.4
      d: 2.4
      bars:
      - {id: stock, x: -2.4, v: 7.54, color: '#F08A4B', grow: [0.3, 1.8]}
      - {id: new25, x: 2.4, v: 1.07, color: '#3CC2B0', grow: [2.2, 3.2]}
