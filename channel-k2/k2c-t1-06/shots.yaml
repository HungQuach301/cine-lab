# K2C-T1-06 "Apartments" — SHOT LIST (G1a, khớp lời khoá ứng viên v8.1 script.md). Chưa dựng khung mẫu 3D (chờ bộ công cụ phiên V).
# Khai theo checks 1.10.1 (BAO-CAO §18.4): mỗi shot `type` ∈ {scene3d, map, chart3d, photo, document, footage, card}, `scene_id`, `camera_id`;
# đặc tả khai `places:`, `people:` (photo: rid/clip_id hoặc ly_do), `anchors:`.
# `at` = cụm từ trong lời đoạn đó (khớp lần đầu; "#n" = lần thứ n). Thời điểm ước bằng 151,2 từ/phút (Eric, đo ở K2G-01) — `shotlist.py` tính.
# `nums` = mã claim hiện trên hình; `src` = clip_id trong SOURCES-FOOTAGE (ứng viên: CAN-TAI-HO.csv / footage-ung-vien.csv); `label` = nhãn năm/nguồn bắt buộc trên hình.
# Document: ≤ 3 s, có p.paper + p.date (Q34d). Footage/ảnh: ≤ 8 s mỗi clip, nhãn năm (QUAN-TRI-RUI-RO §6.3, §6.5).
