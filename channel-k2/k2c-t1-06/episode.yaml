- id: 08
  part: RESULT
  vo: 'Here''s what America built over the same decades. Two-to-four-unit completions peaked in the 1970s, then fell in waves: from about 86,000 homes in 1986 to 45,000 in 1990, and from about 41,000 in 2006 to 9,000 in 2010. In 2025: 16,000. The Census numbers show when — not why; this video doesn''t test what caused each drop. As a share of all new homes, two-to-four-unit buildings went from almost six percent in the early 1970s to just over one percent in 2025 — our calculation from Census completions, pooling 1970 through 1974. Small apartment buildings of five to nineteen units went from three hundred seventy-seven thousand homes completed in 1973, the series'' peak year, to about 48,000 in 2025 — from the Census''s separate multifamily series, our sum of two columns. Single-family houses went from about fifty-seven percent of new homes in the early 1970s to about sixty-eight percent in 2025 — again our calculation, pooling 1970 through 1974. And in that same multifamily series, buildings of fifty or more units went from one in five new apartments in 1972 to fifty-seven percent in 2025. Our read: across these two series, new construction moved toward the two ends — houses, and large apartment buildings.'
