- id: '04'
  part: LOCK2
  vo: 'Lock two: the stairwell. The rule requires two separate ways out of taller apartment buildings, with exceptions. The International Building Code is a model code; Seattle''s code, for example, reprints its text, with local amendments. In the model code''s 2021 edition — as reprinted in Seattle''s 2021 code, which we checked — an apartment building may have a single staircase up to the third story, with at most four homes per floor and sprinklers throughout. A fourth story on one stair is not permitted. So the single-stair limit bites at the fourth story, and at any floor with more than four homes — the taller building on a small lot. On that lot, a second stair takes a slice of every floor. The Pew Charitable Trusts, working with the Center for Building in North America — a group that advocates allowing more single-stair buildings — estimates, in a 2025 report summary, that the extra stairway and corridor take around seven percent of the floor area and cost the equivalent of six to thirteen percent of total construction costs. In an August 2024 proposal to Washington''s Building Code Council, the Washington Association of Building Officials, explaining Seattle''s history, wrote that on its many small lots, "two exits took up a significant portion of the floor plate." Seattle has allowed some single-stair apartment buildings since its 1977 code, those officials wrote; its 2021 code allows them up to six stories, with at most four homes per floor and extra protections such as a pressurized stairway. There''s a code cost below four stories, too. A 2024 Terner Center study at UC Berkeley noted that in California, buildings with three or more homes fall under the stricter commercial building code — adding, by its estimate, roughly ten percent to construction costs.'
