- id: '03'
  part: LOCK1
  vo: 'A century later, how much of the map still works that way? Take one state the National Zoning Atlas has mapped. In its 2025 report, covering 334 jurisdictions in Colorado: Fifty-nine percent of residential land allows only single-family homes. Just three percent allows buildings of more than four homes "as of right" — meaning without a special approval. That''s one state, as mapped for that report — not a national figure, and not today''s map. The map has fine print, too. In Colorado, the Atlas found parking requirements on eighty-five percent of residential land, most often two spaces for every home. On a small lot, every parking space is room the building can''t use.'
