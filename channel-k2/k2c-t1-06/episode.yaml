- id: '00'
  part: HOOK
  vo: About one in thirteen American homes sits in a building with two to four apartments. Of the new homes finished in 2025, about one in a hundred did. So why did America almost stop building them? Two different Census counts — homes in the 2024 survey, homes finished in one year — and the shares are our calculation. This video explains how the system works. It isn't financial or investment advice. Facts are as of October twelfth, 2026.
