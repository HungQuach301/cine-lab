- id: '06'
  part: LOCK3
  vo: 'Lock three: the bank. In housing finance, one number draws a line: four. The Federal Housing Finance Agency defines, in its housing-goals regulation, single-family housing as one to four homes, and multifamily as more than four. Fannie Mae''s and the FHA''s single-family loan programs cover buildings of one to four units. So, in these definitions, a fourplex is classed with houses, not with apartment buildings. Add a fifth home, and the building falls outside these single-family programs. Now add the shop. Fannie Mae''s single-family rules accept a mixed-use property only if it''s a one-unit home whose borrower lives there and runs the business. The FHA allows mixed use up to four units, if at least fifty-one percent of the floor area is residential. So a shop with five apartments above it fits neither single-family program. For small projects, the same Terner Center study reported that in California, lenders often require completion guarantees and "recourse to the developer''s personal assets."'
