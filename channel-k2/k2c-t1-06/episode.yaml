shorts:
- id: S1
  hook: 1 in 13 homes — but 1 in 100 new ones. Why?
  shots:
  - tpl: plate
    at: 0
    type: scene3d
    p:
      hero: s_corner
      frame0: 0
      asofY: 1548
      labels:
      - a: building
        s: about 1 in 13
        sub: U.S. homes in 2–4-apartment buildings (2024)
        at: '@thirteen'
        dy: -260
        num: c01
      cap:
      - s: Census ACS 2024 · our calculation
        at: 0.3
        src:
        - ACS24
  - tpl: plate
    at: '@of-0.3'
    in: fade
    type: chart3d
    scene_id: ch_hook
    camera_id: s-crane
    p:
      hero: s_hook
      frame0: 0
      labels:
      - a: stock:top
        s: 7.5%
        sub: homes standing (2024)
        at: '@of+0.4'
        dy: -160
        num: c01
      - a: new25:top
        s: 1.1%
        sub: new homes finished (2025)
        at: '@hundred'
        dy: -200
        num: c02
      cap:
      - s: Two different Census counts · our calculation
        at: '@of'
        src:
        - ACS24
        - NRC
  - tpl: plate
    at: '@so-0.3'
    in: fade
    type: scene3d
    p:
      hero: s_corner2
      frame0: 0
      cap:
      - s: Why did America almost stop building them?
        at: '@why'
  vo: About one in thirteen American homes sits in a building with two to four apartments. Of the new homes finished in 2025, about one in a hundred did. So why did America almost stop building them?
- id: S2
  hook: Why one staircase stops at three stories
  shots:
  - tpl: plate
    at: 0
    type: scene3d
    p:
      hero: s_stairs
      frame0: 0
      asof: Facts as of 12 Oct 2026
      asofY: 1548
      labels:
      - a: core1
        s: One staircase
        sub: up to the 3rd story · ≤ 4 homes per floor
        at: '@single'
        dy: -220
        num: c15
      - a: np
        s: '4th story: NP'
        sub: not permitted
        at: '@fourth'
        dy: -200
        num: c15
      cap:
      - s: Model code, 2021 edition (as reprinted in Seattle's 2021 code)
        at: 0.3
        src:
        - IBCSEA
  - tpl: plate
    at: '@so-0.3'
    in: fade
    type: scene3d
    p:
      hero: s_tall
      frame0: 0
      cap:
      - s: The taller building on a small lot
        at: '@taller'
  vo: In the model code's 2021 edition — as reprinted in Seattle's 2021 code, which we checked — an apartment building may have a single staircase up to the third story, with at most four homes per floor and sprinklers throughout. A fourth story on one stair is not permitted. So the single-stair limit bites at the fourth story, and at any floor with more than four homes — the taller building on a small lot.
