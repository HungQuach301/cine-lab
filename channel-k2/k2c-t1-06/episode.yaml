- id: '07'
  part: FORCES
  vo: 'Our read: the rules aren''t the whole story. For recent years, these sources point to other forces too. In October 2026, researchers at the Federal Reserve Bank of Minneapolis wrote that high borrowing, operating and construction costs, and low rent growth, "have challenged the profitability of multifamily apartments and slowed multifamily construction in many markets." And in 2024, the Terner Center at UC Berkeley found that its small model buildings in California, in most cases, "would not be built under recent market conditions." To recap: the map can block any of these buildings. The stairwell bites at four stories, or above four homes a floor. The bank line sorts buildings at five homes, and puts many buildings with a shop outside the single-family programs. And building costs, borrowing costs and rents weigh on new apartments too. Whether each of these contributed to the long decline, and by how much, the record we found doesn''t measure.'
