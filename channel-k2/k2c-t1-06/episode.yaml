- id: '11'
  part: ENDING
  vo: 'So why did America almost stop building them? Our read: the record we found doesn''t pin it on any single lock, or on the rules alone. The buildings themselves didn''t go away — about eleven million American homes were in buildings of two to four units in the 2024 Census survey, and, by our calculation from that survey, more than eight in ten of the occupied ones were rented. But three sets of rules shape new ones: the map decides where they can stand, the stairwell how tall the next size up can rise, the bank which loan programs they fit. And building costs, borrowing costs and rents, researchers at the Minneapolis Fed and the Terner Center found, weigh on whether the numbers work at all. The map and stairwell rules have defenders, with reasons on the record. In some places, the map and the stairwell have started to change. Whether that brings back the building on the corner, the record doesn''t settle yet.'
