- id: '05'
  part: LOCK2
  vo: 'So is one staircase safe enough? Fire officials, researchers and code bodies disagree. In a March 2024 position statement, the International Association of Fire Chiefs declared its "unwavering support" for keeping a second stairway in apartment buildings over three stories. In an undated joint statement, the International Association of Fire Fighters and the Metropolitan Fire Chiefs Association wrote: "Put simply, lives will be endangered." In an undated report to the Legislature, California''s state fire marshal described "near-unanimous opposition" from the state''s fire departments to single-stair buildings above three stories, and found added safeguards "do not fully substitute for the redundancy of two independent stairways." Pew and the Center for Building cite a count of fire records: in New York City''s four thousand four hundred forty modern single-stair buildings since 2012, they found the fire-death rate the same as in the city''s other residential buildings, and they say a missing second stair played no role in the four deaths they counted in New York and Seattle''s modern single-stair buildings from 2012 to 2024. A modeling study for Minnesota''s labor department, in December 2025, found that, in its risk model, the number of stairs made a difference only when the sprinklers failed and both the apartment door and the stair door on the fire floor were open. In a vote announced in May 2026, governmental members of the International Code Council backed a proposal, eighty-six to thirty-four, to allow one stair up to four stories in the next model code, the 2027 edition — which, as of October 12, 2026, has not been published.'
