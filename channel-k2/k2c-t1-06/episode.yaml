- id: '02'
  part: LOCK1
  vo: 'Lock one: the map. In 1921, when the Commerce Department under Herbert Hoover set up an advisory committee on zoning, only forty-eight American cities and towns had zoning ordinances, Hoover wrote. The committee drafted a model law for the powers a state could give its cities — over building height and size, lot coverage, density and land use, with different rules in different districts. In 1926, a case from Euclid, Ohio — "practically a suburb" of Cleveland, the Court said — reached the Supreme Court. Euclid had zoned its land in tiers: single-family houses only; then two-family homes; then apartment houses. Retail stores and shops didn''t come in until the fourth tier. So a corner shop with apartments above it fit in none of the first three. The Court upheld the ordinance, six to three. Summing up reports from commissions and experts, Justice Sutherland listed the concerns about apartment houses among detached homes: buildings "interfering by their height and bulk with the free circulation of air and monopolizing the rays of the sun," and bringing traffic and parked cars. Apartment houses which, he wrote, "in a different environment would be not only entirely unobjectionable but highly desirable, come very near to being nuisances" in such districts. And if a zoning rule was "fairly debatable," the Court said, the legislative judgment "must be allowed to control" — in plain terms, under that standard, judges deferred to the local lawmakers who wrote the rule.'
