- id: '01'
  part: CONTEXT
  vo: 'Picture the classic version on a city corner: a shop on the ground floor, two or three floors of apartments above, one staircase. The plainer versions are a duplex, a triplex, a fourplex. Just above them sit small apartment buildings of five to nineteen homes. By our calculation from Census survey data, almost a quarter of occupied homes in two-to-four-unit buildings went up before 1940, by the year residents reported. Our read: the records we found don''t pin the decline on any single cause. What the record does show is rules in three areas that apply to these buildings. We''ll call them locks — rules that limit what can be built — without judging whether each limit is right. Then we''ll look at the forces outside the rules: building and borrowing costs, and rents.'
