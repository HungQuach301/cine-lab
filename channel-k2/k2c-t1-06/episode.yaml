- id: '10'
  part: WHERE
  vo: 'So where are these buildings legal again? As of October 12, 2026: New York City''s "City of Yes" plan, approved by the City Council on December 5, 2024, re-legalized housing above shops on commercial streets in all its low-density districts — two to four stories of homes over a ground-floor business. In the Department of City Planning''s final plan, the new "missing middle" buildings are meant to match the scale of existing buildings that had been "functionally banned by zoning." Oregon''s 2019 law requires cities of 25,000 people or more to allow duplexes through fourplexes, townhouses and cottage clusters in areas zoned for detached single-family homes. Washington''s 2023 law requires many cities to allow at least two to six homes per lot, depending on city size and distance to major transit. On stairs: Texas lets its cities allow single-stair buildings up to six stories, with at most four homes per floor, since September 2025. Colorado requires many cities of 100,000 people or more to allow five-story single-stair apartment buildings by December 1, 2027. And the lending line is still four.'
