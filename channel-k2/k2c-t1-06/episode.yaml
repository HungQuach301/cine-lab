- id: 09
  part: MYTH
  vo: 'So what happens when a place opens the map? When Washington state''s legislature heard its 2023 middle-housing bill, supporters called it "the fastest and most scalable way to increase housing production." In the committee''s staff summary of the testimony, others said its "uniform application of requirements does not recognize the uniqueness of each city," and that "more people would just create more traffic." Minneapolis offers one test. Its 2040 plan, adopted in 2019, allows — as of October 2026 — duplexes and triplexes in areas once zoned only for single-family homes. In October 2026, Minneapolis Fed researchers reported that from 2020 through 2025 the city permitted 317 new units in duplexes, triplexes and fourplexes — about two percent of the homes it permitted in multifamily buildings, and roughly the same as a comparison group. Their headline also reported stable rents; this video doesn''t test what caused them. Their summary: land-use changes "appear insufficient to drive new housing production in a challenging development environment." When California''s SB 9 took effect in January 2022, it let homeowners split their lot and build up to four homes on a single-family parcel. In its first year, Los Angeles received 211 applications for new units under the law; San Diego received seven. In a 2019 study, the researcher Yonah Freemark found short-term, local effects of upzoning near Chicago rail stations: higher property prices, but over five years, no measurable increase in newly permitted homes. Other studies report increases. A 2023 study by Urban Institute researchers linked loosening land-use reforms to a rise in housing supply of about 0.8 percent within three to nine years, mostly at the higher end of rents. And outside the U.S., a 2023 University of Auckland working paper estimated that roughly 21,800 additional homes were permitted in the five years after Auckland upzoned about three quarters of its residential land — about four percent of its housing stock. So on housing production, the record is mixed. In Minneapolis and in SB 9''s first year, the counts were in the hundreds or fewer; the Urban Institute and Auckland studies found increases. These studies measure different things in different places, so they don''t add up to one number — and none of the studies we cite covers Washington''s 2023 law, or the traffic and city-by-city concerns raised there.'
