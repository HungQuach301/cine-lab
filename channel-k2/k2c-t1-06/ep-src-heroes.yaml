# K2C-T1-06 "Apartments" — ĐẶC TẢ NGUỒN, phần cảnh (ghép bởi ep-src.yaml qua make_spec.py; sửa ở đây).
# Cảnh 3D của tập: design/ll-hero/k2c106.js (preset máy quay CAM[cảnh]); module k2v: map/globe, chart3d/*, photo/*; footage/clip (scripts/k2/hero.js, trích khung, kiểm SHA).
# camera_id = tên preset (heroes.<k>.cam) hoặc máy quay khai trực tiếp; scene_id khai ở shot cho ảnh/biểu đồ/văn bản (mỗi ảnh, mỗi bộ số là một bối cảnh riêng).
heroes:
  # ---------- corner (toà góc phố) ----------
  c_wide:   {hero: k2c106/corner, cam: wide_dusk, opt: {tod: dusk}}
  c_push:   {hero: k2c106/corner, cam: push_facade, opt: {tod: dusk}}
  c_sec:    {hero: k2c106/corner, cam: section, opt: {tod: dusk, section: ["@floors-0.6", "@floors+1.0"]}}
  c_stair:  {hero: k2c106/corner, cam: stair_section, opt: {tod: dusk, section: [0.2, 1.4]}}
  c_shop:   {hero: k2c106/corner, cam: shop_section, opt: {tod: dusk, section: [0.4, 1.6], shop: 1.4}}
  c_day:    {hero: k2c106/corner, cam: day_town_center, opt: {tod: day}}
  c_blue:   {hero: k2c106/corner, cam: blue_hour_end, opt: {tod: blue}}
  c_secend: {hero: k2c106/corner, cam: section_end, opt: {tod: blue, section: [0.4, 1.8]}}
  c_crane:  {hero: k2c106/corner, cam: crane_up, opt: {tod: blue}}
  # ---------- street (dãy phố) ----------
  st_block: {hero: k2c106/street, cam: high_block, opt: {tod: day}}
  st_dolly: {hero: k2c106/street, cam: dolly_day, opt: {tod: day}}
  st_tele:  {hero: k2c106/street, cam: tele_fronts, opt: {tod: day}}
  st_tall:  {hero: k2c106/street, cam: tall_walkups, opt: {tod: day, hl: 3, hlAt: [0.4, 1.0]}}
  st_dusk:  {hero: k2c106/street, cam: dusk_new, opt: {tod: dusk}}
  # ---------- tiers (sa bàn Euclid, minh hoạ) ----------
  ti_top:   {hero: k2c106/tiers, cam: top, opt: {fill: [0.4, 0.9, 1.4, 1.9]}}
  ti_obl:   {hero: k2c106/tiers, cam: oblique_tiers, opt: {fill: ["@single-family", "@two-family", "@then#2", "@retail"], probe: {at: "@so", zones: [0, 1, 2, 3], step: 3.0}}}
  ti_front: {hero: k2c106/tiers, cam: front_low, opt: {fill: ["@different", "@rules", "@different#2", "@districts"]}}   # Q32b 13/10: tách ảnh DET-08 (9,2 s > 8 s); bốn vùng sáng lần lượt theo "different rules in different districts"
  ti_shadow: {hero: k2c106/tiers, cam: shadow_low, opt: {sun: 1}}
  # ---------- lot ----------
  lo_plan:  {hero: k2c106/lot, cam: plan, opt: {stalls: 10, grow: ["@parking", "@spaces+1.5"]}}
  lo_pencil: {hero: k2c106/lot, cam: pencil, opt: {stalls: 6, grow: -1}}
  # ---------- stairs (mặt cắt) ----------
  sa_model: {hero: k2c106/stairs, cam: model_code, opt: {mode: one, floors: 3}}
  sa_elev:  {hero: k2c106/stairs, cam: elev_stack, opt: {mode: one, floors: 4, stackAt: ["@single-0.6", 0.5], np: ["@fourth", "@fourth+0.6"]}}
  sa_plan:  {hero: k2c106/stairs, cam: plan_compare, opt: {mode: compare, floors: 4}}
  sa_floor: {hero: k2c106/stairs, cam: floor_plate, opt: {mode: two, floors: 4}}
  sa_press: {hero: k2c106/stairs, cam: pressurized, opt: {mode: one, floors: 6, press: ["@pressurized-0.4", "@pressurized+0.6"]}}
  sa_fire:  {hero: k2c106/stairs, cam: fire_logic, opt: {mode: one, floors: 4, fire: ["@sprinklers", 1.0]}}
  # ---------- bank ----------
  b_side:   {hero: k2c106/bank, cam: side, opt: {}}
  b_line:   {hero: k2c106/bank, cam: line_four, opt: {}}
  b_counter: {hero: k2c106/bank, cam: counter, opt: {}}
  b_fifth:  {hero: k2c106/bank, cam: fifth_block, opt: {fifth: ["@fifth", "@fifth+1.8"]}}
  b_reject: {hero: k2c106/bank, cam: mixed_reject, opt: {fifth: -1, shop: 1, reject: ["@neither-0.4", "@neither+0.4"]}}
  b_still:  {hero: k2c106/bank, cam: line_still, opt: {}}
  # ---------- ends (hai đầu, 1972 → 2025) ----------
  e_72:     {hero: k2c106/ends, cam: wide_1972, opt: {year: 1972}}
  e_25:     {hero: k2c106/ends, cam: wide_2025, opt: {year: 1972, year1: 2025, yearAt: [0.3, 3.0]}}

