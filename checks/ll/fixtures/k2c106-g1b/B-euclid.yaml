      places:
      - {id: euclid, ll: [-81.5268, 41.5931], name: 'Euclid, Ohio', at: 3.4}
      - {id: cleveland, ll: [-81.6944, 41.4993], name: Cleveland, at: 4.0}
      cam:
      - {t: 0, lon: -70, lat: 30, alt: 24, tilt: 0, mm: 35}
      - {t: 1.6, lon: -76, lat: 36, alt: 12, tilt: 10, mm: 35}
      - {t: 4.4, lon: -81.6, lat: 40.95, alt: 0.75, tilt: 38, head: 0, mm: 35}
      - {t: 6.5, lon: -81.62, lat: 41.2, alt: 0.6, tilt: 40, head: 4, mm: 35}
