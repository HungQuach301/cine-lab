  b_tiers: {hero: k2c106/tiers, cam: oblique_tiers, opt: {preset: oblique_tiers, fill: [0.3, 1.0, 1.7, 2.4], probe: {at: 3.6, zones: [0, 1, 2, 3], step: 3.0}}}
  b_det07: {hero: photo/print, cam: push, opt: {img: /cache/loc-det-07.jpg, focus: [0.8, 0.45], push: 0.2}}
